olic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Baruch<!-- --> <span class="text-stone-500">2</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/BAR/">About <!-- -->Baruch</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">A further confession of the sins of the people, and of the justice of God.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Wherefore the Lord our God hath made good his word, that he spoke to us, and to our judges that have judged Israel, and to our kings, and to our princes, and to all Israel and Juda:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>That the Lord would bring upon us great evils, such as never happened under heaven, as they have come to pass in Jerusalem, according to the things that are written in the law of Moses:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>That a man should eat the flesh of his own son, and the flesh of his own daughter.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And he hath delivered them up to be under the hand of all the kings that are round about us, to be a reproach, and desolation among all the people, among whom the Lord hath scattered us.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And we are brought under, and are not uppermost: because we have sinned against the Lord our God, by not obeying his voice.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>To the Lord our God belongeth justice: but to us, and to our fathers confusion of face, as at this day.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For the Lord hath pronounced against us all these evils that are come upon us:</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And we have not entreated the face of the Lord our God, that we might return every one of us from our most wicked ways.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And the Lord hath watched over us for evil, and hath brought it upon us: for the Lord is just in all his works which he hath commanded us:</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And we have not hearkened to his voice to walk in the commandments of the Lord which he hath set before us.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And now, O Lord God of Israel, who hast brought thy people out of the land of Egypt with a strong hand, and with signs, and with wonders, and with thy great power, and with a mighty arm, and hast made thee a name as at this day,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>We have sinned, we have done wickedly, we have acted unjustly, O Lord our God, against all thy justices.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Let thy wrath be turned away from us: for we are left a few among the nations where thou hast scattered us.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Hear, O Lord, our prayers, and our petitions, and deliver us for thy own sake: and grant that we may find favour in the sight of them that have led us away:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>That all the earth may know that thou art the Lord our God, and that thy name is called upon Israel, and upon his posterity.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Look down upon us, O Lord, from thy holy house, and incline thy ear, and hear us.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Open thy eyes, and behold: for the dead that are in hell, whose spirit is taken away from their bowels, shall not give glory and justice to the Lord:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But the soul that is sorrowful for the greatness of evil she hath done, and goeth bowed down, and feeble, and the eyes that fail, and the hungry soul giveth glory and justice to thee the Lord.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>For it is not for the justices of our fathers that we pour out our prayers, and beg mercy in thy sight, O Lord our God:</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But because thou hast sent out thy wrath, and thy indignation upon us, as thou hast spoken by the hand of thy servants the prophets, saying:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Thus saith the Lord: Bow down your shoulder, and your neck, and serve the king of Babylon: and you shall remain in the land which I have given to your fathers.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>But if you will not hearken to the voice of the Lord your God, to serve the king of Babylon: I will cause you to depart out of the cities of Juda, and from without Jerusalem.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And I will take away from you the voice of mirth, and the voice of joy, and the voice of the bridegroom, and the voice of the bride, and all the land shall be without any footstep of inhabitants.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And they hearkened not to thy voice, to serve the king of Babylon: and thou hast made good thy words, which thou spokest by the hands of thy servants the prophets, that the bones of our kings, and the bones of our fathers should be removed out of their place:</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And behold they are cast out to the heat of the sun, and to the frost of the night: and they have died in grievous pains, by famine, and by the sword, and in banishment.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And thou hast made the temple, in which thy name was called upon, as it is at this day, for the iniquity of the house of Israel, and the house of Juda.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And thou hast dealt with us, O Lord our God, according to all thy goodness, and according to all that great mercy of thine:</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>As thou spokest by the hand of thy servant Moses, in the day when thou didst command him to write thy law before the children of Israel,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Saying: If you will not hear my voice, this great multitude shall be turned into a very small number among the nations, where I will scatter them:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>For I know that the people will not hear me, for they are a people of a stiff neck: but they shall turn to their heart in the land of their captivity:</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And they shall know that I am the Lord their God: and I will give them a heart, and they shall understand: and ears, and they shall hear.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And they shall praise me in the land of their captivity, and shall be mindful of my name.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And they shall turn away themselves from their stiff neck, and from their wicked deeds: for they shall remember the way of their fathers, that sinned against me.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>And I will bring them back again into the land which I promised with an oath to their fathers, Abraham, Isaac, and Jacob, and they shall be masters thereof: and I will multiply them, and they shall not be diminished.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>And I will make with them another covenant that shall be everlasting, to be their God, and they shall be my people: and I will no more remove my people, the children of Israel, out of the land that I have given them.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Propter quod statuit Dominus Deus noster verbum suum, quod locutus est ad nos, et ad judices nostros qui judicaverunt Israël, et ad reges nostros, et ad principes nostros, et ad omnem Israël et Juda :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>ut adduceret Dominus super nos mala magna, quæ non sunt facta sub cælo quemadmodum facta sunt in Jerusalem, secundum quæ scripta sunt in lege Moysi,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>et manducaret homo carnes filii sui et carnes filiæ suæ.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et dedit eos sub manu regum omnium qui sunt in circuitu nostro, in improperium et in desolationem in omnibus populis in quibus nos dispersit Dominus :</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et facti sumus subtus, et non supra, quia peccavimus Domino Deo nostro, non obaudiendo voci ipsius.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Domino Deo nostro justitia, nobis autem et patribus nostris confusio faciei, sicut est dies hæc :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>quia locutus est Dominus super nos omnia mala hæc quæ venerunt super nos :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et non sumus deprecati faciem Domini Dei nostri, ut reverteremur unusquisque nostrum a viis nostris pessimis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Et vigilavit Dominus in malis, et adduxit ea super nos : quia justus est Dominus in omnibus operibus suis quæ mandavit nobis,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et non audivimus vocem ipsius ut iremus in præceptis Domini, quæ dedit ante faciem nostram.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et nunc, Domine Deus Israël, qui eduxisti populum tuum de terra Ægypti in manu valida, et in signis, et in prodigiis, et in virtute tua magna, et in brachio excelso, et fecisti tibi nomen sicut est dies iste :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>peccavimus, impie egimus, inique gessimus, Domine Deus noster, in omnibus justitiis tuis.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Avertatur ira tua a nobis, quia derelicti sumus pauci inter gentes ubi dispersisti nos.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Exaudi, Domine, preces nostras et orationes nostras, et educ nos propter te, et da nobis invenire gratiam ante faciem eorum qui nos abduxerunt :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>ut sciat omnis terra quia tu es Dominus Deus noster, et quia nomen tuum invocatum est super Israël, et super genus ipsius.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Respice, Domine, de domo sancta tua in nos, et inclina aurem tuam, et exaudi nos.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Aperi oculos tuos et vide : quia non mortui qui sunt in inferno, quorum spiritus acceptus est a visceribus suis, dabunt honorem et justificationem Domino :</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>sed anima quæ tristis est super magnitudine mali, et incedit curva et infirma, et oculi deficientes, et anima esuriens, dat tibi gloriam et justitiam Domino.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Quia non secundum justitias patrum nostrorum nos fundimus preces et petimus misericordiam ante conspectum tuum, Domine Deus noster :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>sed quia misisti iram tuam et furorem tuum super nos, sicut locutus es in manu puerorum tuorum prophetarum, dicens :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Sic dicit Dominus : Inclinate humerum vestrum et cervicem vestram, et opera facite regi Babylonis, et sedebitis in terra quam dedi patribus vestris.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Quod si non audieritis vocem Domini Dei vestri, operari regi Babyloniæ, defectionem vestram faciam de civitatibus Juda, et a foris Jerusalem,</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>et auferam a vobis vocem jucunditatis et vocem gaudii, et vocem sponsi et vocem sponsæ, et erit omnis terra sine vestigio ab inhabitantibus eam.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et non audierunt vocem tuam, ut operarentur regi Babylonis : et statuisti verba tua, quæ locutus es in manibus puerorum tuorum prophetarum, ut transferrentur ossa regum nostrorum et ossa patrum nostrorum de loco suo :</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>et ecce projecta sunt in calore solis et in gelu noctis, et mortui sunt in doloribus pessimis, in fame et in gladio, et in emissione.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et posuisti templum in quo invocatum est nomen tuum in ipso sicut hæc dies, propter iniquitatem domus Israël et domus Juda.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et fecisti in nobis, Domine Deus noster, secundum omnem bonitatem tuam et secundum omnem miserationem tuam illam magnam :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>sicut locutus es in manu pueri tui Moysi, in die qua præcepisti ei scribere legem tuam coram filiis Israël,</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>dicens : Si non audieritis vocem meam, multitudo hæc magna convertetur in minimam inter gentes, quo ego eos dispergam :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>quia scio quod me non audiet populus : populus est enim dura cervice. Et convertetur ad cor suum in terra captivitatis suæ,</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>et scient quia ego sum Dominus Deus eorum : et dabo eis cor, et intelligent ; aures, et audient :</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>et laudabunt me in terra captivitatis suæ, et memores erunt nominis mei,</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>et avertent se a dorso suo duro, et a malignitatibus suis : quia reminiscentur viam patrum suorum, qui peccaverunt in me.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Et revocabo illos in terram quam juravi patribus eorum, Abraham, Isaac, et Jacob : et dominabuntur ejus, et multiplicabo eos, et non minorabuntur :</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>et statuam illis testamentum alterum sempiternum, ut sim illis in Deum, et ipsi erunt mihi in populum : et non movebo amplius populum meum, filios Israël, a terra quam dedi illis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/BAR/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Baruch 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/BAR/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Baruch 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->2<!-- --> of <!-- -->6<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Baruch 1" \",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/2dqridnhmvd9h.js\",\"/catholic-study-bible/_next/static/chunks/31o7mouwijfr9.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"BAR.2\",{\"bookId\":30,\"usfm\":\"BAR\",\"bookName\":\"Baruch\",\"drName\":\"Baruch\",\"chapter\":2,\"totalChapters\":6,\"dra\":[{\"verse\":1,\"text\":\"Wherefore the Lord our God hath made good his word, that he spoke to us, and to our judges that have judged Israel, and to our kings, and to our princes, and to all Israel and Juda:\"},{\"verse\":2,\"text\":\"That the Lord would bring upon us great evils, such as never happened under heaven, as they have come to pass in Jerusalem, according to the things that are written in the law of Moses:\"},{\"verse\":3,\"text\":\"That a man should eat the flesh of his own son, and the flesh of his own daughter.\"},{\"verse\":4,\"text\":\"And he hath delivered them up to be under the hand of all the kings that are round about us, to be a reproach, and desolation among all the people, among whom the Lord hath scattered us.\"},{\"verse\":5,\"text\":\"And we are brought under, and are not uppermost: because we have sinned against the Lord our God, by not obeying his voice.\"},{\"verse\":6,\"text\":\"To the Lord our God belongeth justice: but to us, and to our fathers confusion of face, as at this day.\"},{\"verse\":7,\"text\":\"For the Lord hath pronounced against us all these evils that are come upon us:\"},{\"verse\":8,\"text\":\"And we have not entreated the face of the Lord our God, that we might return every one of us from our most wicked ways.\"},{\"verse\":9,\"text\":\"And the Lord hath watched over us for evil, and hath brought it upon us: for the Lord is just in all his works which he hath commanded us:\"},{\"verse\":10,\"text\":\"And we have not hearkened to his voice to walk in the commandments of the Lord which he hath set before us.\"},{\"verse\":11,\"text\":\"And now, O Lord God of Israel, who hast brought thy people out of the land of Egypt with a strong hand, and with signs, and with wonders, and with thy great power, and with a mighty arm, and hast made thee a name as at this day,\"},{\"verse\":12,\"text\":\"We have sinned, we have done wickedly, we have acted unjustly, O Lord our God, against all thy justices.\"},{\"verse\":13,\"text\":\"Let thy wrath be turned away from us: for we are left a few among the nations where thou hast scattered us.\"},{\"verse\":14,\"text\":\"Hear, O Lord, our prayers, and our petitions, and deliver us for thy own sake: and grant that we may find favour in the sight of them that have led us away:\"},{\"verse\":15,\"text\":\"That all the earth may know that thou art the Lord our God, and that thy name is called upon Israel, and upon his posterity.\"},{\"verse\":16,\"text\":\"Look down upon us, O Lord, from thy holy house, and incline thy ear, and hear us.\"},{\"verse\":17,\"text\":\"Open thy eyes, and behold: for the dead that are in hell, whose spirit is taken away from their bowels, shall not give glory and justice to the Lord:\"},{\"verse\":18,\"text\":\"But the soul that is sorrowful for the greatness of evil she hath done, and goeth bowed down, and feeble, and the eyes that fail, and the hungry soul giveth glory and justice to thee the Lord.\"},{\"verse\":19,\"text\":\"For it is not for the justices of our fathers that we pour out our prayers, and beg mercy in thy sight, O Lord our God:\"},{\"verse\":20,\"text\":\"But because thou hast sent out thy wrath, and thy indignation upon us, as thou hast spoken by the hand of thy servants the prophets, saying:\"},{\"verse\":21,\"text\":\"Thus saith the Lord: Bow down your shoulder, and your neck, and serve the king of Babylon: and you shall remain in the land which I have given to your fathers.\"},{\"verse\":22,\"text\":\"But if you will not hearken to the voice of the Lord your God, to serve the king of Babylon: I will cause you to depart out of the cities of Juda, and from without Jerusalem.\"},{\"verse\":23,\"text\":\"And I will take away from you the voice of mirth, and the voice of joy, and the voice of the bridegroom, and the voice of the bride, and all the land shall be without any footstep of inhabitants.\"},{\"verse\":24,\"text\":\"And they hearkened not to thy voice, to serve the king of Babylon: and thou hast made good thy words, which thou spokest by the hands of thy servants the prophets, that the bones of our kings, and the bones of our fathers should be removed out of their place:\"},{\"verse\":25,\"text\":\"And behold they are cast out to the heat of the sun, and to the frost of the night: and they have died in grievous pains, by famine, and by the sword, and in banishment.\"},{\"verse\":26,\"text\":\"And thou hast made the temple, in which thy name was called upon, as it is at this day, for the iniquity of the house of Israel, and the house of Juda.\"},{\"verse\":27,\"text\":\"And thou hast dealt with us, O Lord our God, according to all thy goodness, and according to all that great mercy of thine:\"},{\"verse\":28,\"text\":\"As thou spokest by the hand of thy servant Moses, in the day when thou didst command him to write thy law before the children of Israel,\"},{\"verse\":29,\"text\":\"Saying: If you will not hear my voice, this great multitude shall be turned into a very small number among the nations, where I will scatter them:\"},{\"verse\":30,\"text\":\"For I know that the people will not hear me, for they are a people of a stiff neck: but they shall turn to their heart in the land of their captivity:\"},{\"verse\":31,\"text\":\"And they shall know that I am the Lord their God: and I will give them a heart, and they shall understand: and ears, and they shall hear.\"},{\"verse\":32,\"text\":\"And they shall praise me in the land of their captivity, and shall be mindful of my name.\"},{\"verse\":33,\"text\":\"And they shall turn away themselves from their stiff neck, and from their wicked deeds: for they shall remember the way of their fathers, that sinned against me.\"},{\"verse\":34,\"text\":\"And I will bring them back again into the land which I promised with an oath to their fathers, Abraham, Isaac, and Jacob, and they shall be masters thereof: and I will multiply them, and they shall not be diminished.\"},{\"verse\":35,\"text\":\"And I will make with them another covenant that shall be everlasting, to be their God, and they shall be my people: and I will no more remove my people, the children of Israel, out of the land that I have given them.\"}],\"vul\":[{\"verse\":1,\"text\":\"Propter quod statuit Dominus Deus noster verbum suum, quod locutus est ad nos, et ad judices nostros qui judicaverunt Israël, et ad reges nostros, et ad principes nostros, et ad omnem Israël et Juda :\"},{\"verse\":2,\"text\":\"ut adduceret Dominus super nos mala magna, quæ non sunt facta sub cælo quemadmodum facta sunt in Jerusalem, secundum quæ scripta sunt in lege Moysi,\"},{\"verse\":3,\"text\":\"et manducaret homo carnes filii sui et carnes filiæ suæ.\"},{\"verse\":4,\"text\":\"Et dedit eos sub manu regum omnium qui sunt in circuitu nostro, in improperium et in desolationem in omnibus populis in quibus nos dispersit Dominus :\"},{\"verse\":5,\"text\":\"et facti sumus subtus, et non supra, quia peccavimus Domino Deo nostro, non obaudiendo voci ipsius.\"},{\"verse\":6,\"text\":\"Domino Deo nostro justitia, nobis autem et patribus nostris confusio faciei, sicut est dies hæc :\"},{\"verse\":7,\"text\":\"quia locutus est Dominus super nos omnia mala hæc quæ venerunt super nos :\"},{\"verse\":8,\"text\":\"et non sumus deprecati faciem Domini Dei nostri, ut reverteremur unusquisque nostrum a viis nostris pessimis.\"},{\"verse\":9,\"text\":\"Et vigilavit Dominus in malis, et adduxit ea super nos : quia justus est Dominus in omnibus operibus suis quæ mandavit nobis,\"},{\"verse\":10,\"text\":\"et non audivimus vocem ipsius ut iremus in præceptis Domini, quæ dedit ante faciem nostram.\"},{\"verse\":11,\"text\":\"Et nunc, Domine Deus Israël, qui eduxisti populum tuum de terra Ægypti in manu valida, et in signis, et in prodigiis, et in virtute tua magna, et in brachio excelso, et fecisti tibi nomen sicut est dies iste :\"},{\"verse\":12,\"text\":\"peccavimus, impie egimus, inique gessimus, Domine Deus noster, in omnibus justitiis tuis.\"},{\"verse\":13,\"text\":\"Avertatur ira tua a nobis, quia derelicti sumus pauci inter gentes ubi dispersisti nos.\"},{\"verse\":14,\"text\":\"Exaudi, Domine, preces nostras et orationes nostras, et educ nos propter te, et da nobis invenire gratiam ante faciem eorum qui nos abduxerunt :\"},{\"verse\":15,\"text\":\"ut sciat omnis terra quia tu es Dominus Deus noster, et quia nomen tuum invocatum est super Israël, et super genus ipsius.\"},{\"verse\":16,\"text\":\"Respice, Domine, de domo sancta tua in nos, et inclina aurem tuam, et exaudi nos.\"},{\"verse\":17,\"text\":\"Aperi oculos tuos et vide : quia non mortui qui sunt in inferno, quorum spiritus acceptus est a visceribus suis, dabunt honorem et justificationem Domino :\"},{\"verse\":18,\"text\":\"sed anima quæ tristis est super magnitudine mali, et incedit curva et infirma, et oculi deficientes, et anima esuriens, dat tibi gloriam et justitiam Domino.\"},{\"verse\":19,\"text\":\"Quia non secundum justitias patrum nostrorum nos fundimus preces et petimus misericordiam ante conspectum tuum, Domine Deus noster :\"},{\"verse\":20,\"text\":\"sed quia misisti iram tuam et furorem tuum super nos, sicut locutus es in manu puerorum tuorum prophetarum, dicens :\"},{\"verse\":21,\"text\":\"Sic dicit Dominus : Inclinate humerum vestrum et cervicem vestram, et opera facite regi Babylonis, et sedebitis in terra quam dedi patribus vestris.\"},{\"verse\":22,\"text\":\"Quod si non audieritis vocem Domini Dei vestri, operari regi Babyloniæ, defectionem vestram faciam de civitatibus Juda, et a foris Jerusalem,\"},{\"verse\":23,\"text\":\"et auferam a vobis vocem jucunditatis et vocem gaudii, et vocem sponsi et vocem sponsæ, et erit omnis terra sine vestigio ab inhabitantibus eam.\"},{\"verse\":24,\"text\":\"Et non audierunt vocem tuam, ut operarentur regi Babylonis : et statuisti verba tua, quæ locutus es in manibus puerorum tuorum prophetarum, ut transferrentur ossa regum nostrorum et ossa patrum nostrorum de loco suo :\"},{\"verse\":25,\"text\":\"et ecce projecta sunt in calore solis et in gelu noctis, et mortui sunt in doloribus pessimis, in fame et in gladio, et in emissione.\"},{\"verse\":26,\"text\":\"Et posuisti templum in quo invocatum est nomen tuum in ipso sicut hæc dies, propter iniquitatem domus Israël et domus Juda.\"},{\"verse\":27,\"text\":\"Et fecisti in nobis, Domine Deus noster, secundum omnem bonitatem tuam et secundum omnem miserationem tuam illam magnam :\"},{\"verse\":28,\"text\":\"sicut locutus es in manu pueri tui Moysi, in die qua præcepisti ei scribere legem tuam coram filiis Israël,\"},{\"verse\":29,\"text\":\"dicens : Si non audieritis vocem meam, multitudo hæc magna convertetur in minimam inter gentes, quo ego eos dispergam :\"},{\"verse\":30,\"text\":\"quia scio quod me non audiet populus : populus est enim dura cervice. Et convertetur ad cor suum in terra captivitatis suæ,\"},{\"verse\":31,\"text\":\"et scient quia ego sum Dominus Deus eorum : et dabo eis cor, et intelligent ; aures, et audient :\"},{\"verse\":32,\"text\":\"et laudabunt me in terra captivitatis suæ, et memores erunt nominis mei,\"},{\"verse\":33,\"text\":\"et avertent se a dorso suo duro, et a malignitatibus suis : quia reminiscentur viam patrum suorum, qui peccaverunt in me.\"},{\"verse\":34,\"text\":\"Et revocabo illos in terram quam juravi patribus eorum, Abraham, Isaac, et Jacob : et dominabuntur ejus, et multiplicabo eos, et non minorabuntur :\"},{\"verse\":35,\"text\":\"et statuam illis testamentum alterum sempiternum, ut sim illis in Deum, et ipsi erunt mihi in populum : et non movebo amplius populum meum, filios Israël, a terra quam dedi illis.\"}],\"summary\":\"A further confession of the sins of the people, and of the justice of God.\",\"intro\":null,\"prev\":{\"usfm\":\"BAR\",\"chapter\":1,\"label\":\"Baruch 1\"},\"next\":{\"usfm\":\"BAR\",\"chapter\":3,\"label\":\"Baruch 3\"}}]]\n"])</script></body></html>
