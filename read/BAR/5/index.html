="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Put off, O Jerusalem, the garment of thy mourning, and affliction: and put on the beauty, and honour of that everlasting glory which thou hast from God.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>God will clothe thee with the double garment of justice, and will set a crown on thy head of everlasting honour.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>For God will shew his brightness in thee, to every one under heaven.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>For thy name shall be named to thee by God for ever: the peace of justice, and honour of piety.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Arise, O Jerusalem, and stand on high: and look about towards the east, and behold thy children gathered together from the rising to the setting sun, by the word of the Holy One rejoicing in the remembrance of God.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For they went out from thee on foot, led by the enemies: but the Lord will bring them to thee exalted with honour as children of the kingdom.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For God hath appointed to bring down every high mountain, and the everlasting rocks, and to fill up the valleys to make them even with the ground: that Israel may walk diligently to the honour of God.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Moreover the woods, and every sweetsmelling tree have overshadowed Israel by the commandment of God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>For God will bring Israel with joy in the light of his majesty, with mercy, and justice, that cometh from him.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Exue te, Jerusalem, stola luctus et vexationis tuæ, et indue te decore, et honore ejus, quæ a Deo tibi est, sempiternæ gloriæ.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Circumdabit te Deus diploide justitiæ, et imponet mitram capiti honoris æterni.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Deus enim ostendet splendorem suum in te, omni qui sub cælo est.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Nominabitur enim tibi nomen tuum a Deo in sempiternum : pax justitiæ, et honor pietatis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Exsurge, Jerusalem, et sta in excelso : et circumspice ad orientem, et vide collectos filios tuos ab oriente sole usque ad occidentem, in verbo Sancti, gaudentes Dei memoria.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Exierunt enim abs te pedibus ducti ab inimicis : adducet autem illos Dominus ad te portatos in honore sicut filios regni :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>constituit enim Deus humiliare omnem montem excelsum et rupes perennes, et convalles replere in æqualitatem terræ, ut ambulet Israël diligenter in honorem Dei.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Obumbraverunt autem et silvæ, et omne lignum suavitatis Israël ex mandato Dei.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Adducet enim Deus Israël cum jucunditate in lumine majestatis suæ, cum misericordia et justitia quæ est ex ipso.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/BAR/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Baruch 4</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/BAR/6/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Baruch 6</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->5<!-- --> of <!-- -->6<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Baruch 4" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/BAR/4/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h ":3,\"text\":\"Deus enim ostendet splendorem suum in te, omni qui sub cælo est.\"},{\"verse\":4,\"text\":\"Nominabitur enim tibi nomen tuum a Deo in sempiternum : pax justitiæ, et honor pietatis.\"},{\"verse\":5,\"text\":\"Exsurge, Jerusalem, et sta in excelso : et circumspice ad orientem, et vide collectos filios tuos ab oriente sole usque ad occidentem, in verbo Sancti, gaudentes Dei memoria.\"},{\"verse\":6,\"text\":\"Exierunt enim abs te pedibus ducti ab inimicis : adducet autem illos Dominus ad te portatos in honore sicut filios regni :\"},{\"verse\":7,\"text\":\"constituit enim Deus humiliare omnem montem excelsum et rupes perennes, et convalles replere in æqualitatem terræ, ut ambulet Israël diligenter in honorem Dei.\"},{\"verse\":8,\"text\":\"Obumbraverunt autem et silvæ, et omne lignum suavitatis Israël ex mandato Dei.\"},{\"verse\":9,\"text\":\"Adducet enim Deus Israël cum jucunditate in lumine majestatis suæ, cum misericordia et justitia quæ est ex ipso.\"}],\"summary\":\"Jerusalem is invited to rejoice and behold the return of her children out of their captivity.\",\"intro\":null,\"prev\":{\"usfm\":\"BAR\",\"chapter\":4,\"label\":\"Baruch 4\"},\"next\":{\"usfm\":\"BAR\",\"chapter\":6,\"label\":\"Baruch 6\"}}]]\n"])</script></body></html>
