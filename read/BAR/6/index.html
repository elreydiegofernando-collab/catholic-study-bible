<!DOCTYPE html><html lang="en" data-ts="m" class="eb_garamond_9485b480-module__yHr-RW__variable inter_bb5b7355-module__TNjG3a__variable antialiased"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><link rel="preload" href="/catholic-study-bible/_next/static/media/1497d94d4ac5c969-s.p.32itxo7y-xsdk.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/83afe278b6a6bb3c-s.p.2bn3s6zvc0dyp.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="preload" href="/catholic-study-bible/_next/static/media/e4505858a30c79c2-s.p.0tlhhw_qyyfys.woff2" as="font" crossorigin="" type="font/woff2"/><link rel="stylesheet" href="/catholic-study-bible/_next/static/chunks/26ihmjl2yjuua.css" data-precedence="next"/><link rel="preload" as="script" fetchPriority="low" href="/catholic-study-bible/_next/static/chunks/310vm2bl3xxpt.js"/><script src="/catholic-study-bible/_next/static/chunks/19mx3mg6lkumu.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/1mh6a-0e61pyc.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/2ob60erzgu9e1.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/turbopack-1b2i-imv7g590.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js" async=""></script><script src="/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js" async=""></script><meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/><meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)"/><title>Baruch 6 · Catholic Study Bible</title><meta name="description" content="The 73-book canon with the original languages, the Vulgate, and the Church&#x27;s reading of every verse."/><meta name="application-name" content="Catholic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Baruch<!-- --> <span class="text-stone-500">6</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/BAR/">About <!-- -->Baruch</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The epistle of Jeremias to the captives, as a preservative against idolatry.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>For the sins that you have committed before God, you shall be carried away captives into Babylon by Nabuchodonosor the king of Babylon.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And when you are come into Babylon, you shall be there many years, and for a long time, even to seven generations: and after that I will bring you away from thence with peace.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But now, you shall see in Babylon gods of gold, and of silver, and of stone, and of wood borne upon shoulders, causing fear to the Gentiles.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Beware therefore that you imitate not the doings of others, and be afraid, and the fear of them should seize upon you.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>But when you see the multitude behind, and before, adoring them, say you in your hearts: Thou oughtest to be adored, O Lord.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>For my angel is with you: And I myself will demand an account of your souls.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>For their tongue that is polished by the craftsman, and themselves laid over with gold and silver, are false things, and they cannot speak.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And as if it were for a maiden that loveth to go gay: so do they take gold and make them up.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Their gods have golden crowns upon their heads: whereof the priests secretly convey away from them gold, and silver, and bestow it on themselves.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Yea and they give thereof to prostitutes, and they dress out harlots: and again when they receive it of the harlots, they adorn their gods.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And these gods cannot defend themselves from the rust, and the moth.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>But when they have covered them with a purple garment, they wipe their face because of the dust of the house, which is very much among them.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>This holdeth a sceptre as a man, as a judge of the country, but cannot put to death one that offendeth him.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And this hath in his hand a sword, or an axe, but cannot save himself from war, or from robbers, whereby be it known to you, that they are not gods.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Therefore fear them not. For as a vessel that a man uses when it is broken becometh useless, even so are their gods:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>When they are placed in the house, their eyes are full of dust by the feet of them that go in.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And as the gates are made sure on every side upon one that hath offended the king, or like a dead man carried to the grave, so do the priests secure the doors with bars and locks, lest they be stripped by thieves.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>They light candles to them, and in great number, of which they cannot see one: but they are like beams in the house.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And they say that the creeping things which are of the earth, gnaw their hearts, while they eat them and their garments, and they feel it not.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Their faces are black with the smoke that is made in the house.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Owls, and swallows, and other birds fly upon their bodies, and upon their heads, and cats in like manner.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Whereby you may know that they are no gods. Therefore fear them not.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The gold also which they have, is for shew, but except a man wipe off the rust, they will not shine: for neither when they were molten, did they feel it.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Men buy them at a high price, whereas there is no breath in them.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And having not the use of feet they are carried upon shoulders, declaring to men how vile they are. Be they confounded also that worship them.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Therefore if they fall to the ground, they rise not up again of themselves, nor if a man set them upright, will they stand by themselves, but their gifts shall be set before them, as to the dead.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The things that are sacrificed to them, their priests sell and abuse: in like manner also their wives take part of them, but give nothing of it either to the sick, or to the poor.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The childbearing and menstruous women touch their sacrifices: knowing, therefore, by these things that they are not gods, fear them not.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>For how can they be called gods? because women set offerings before the gods of silver, and of gold, and of wood:</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And priests sit in their temples, having their garments rent, and their heads and beards shaven, and nothing upon their heads.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And they roar and cry before their gods, as men do at the feast when one is dead.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The priests take away their garments, and clothe their wives and their children.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And whether it be evil that one doth unto them, or good, they are not able to recompense it: neither can they set up a king, nor put him down:</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>In like manner they can neither give riches, nor requite evil. If a man make a vow to them, and perform it not: they cannot require it.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>They cannot deliver a man from death, nor save the weak from the mighty.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>They cannot restore the blind man to his sight: nor deliver a man from distress.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>They shall not pity the widow, nor do good to the fatherless.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Their gods, of wood, and of stone, and of gold, and of silver, are like the stones that are hewn out of the mountains: and they that worship them shall be confounded.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>How then is it to be supposed, or to be said, that they are gods?</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Even the Chaldeans themselves dishonor them: who when they hear of one dumb that cannot speak, they present him to Bel, entreating him, that he may speak.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>As though they could be sensible that have no motion themselves: and they, when they shall perceive this, will leave them: for their gods themselves have no sense.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>The women also, with cords about them, sit in the ways, burning olive-stones.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>And when any one of them, drawn away by some passenger, lieth with him, she upbraideth her neighbor, that she was not thought as worthy as herself, nor her cord broken.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>But all things that are done about them, are false: how is it then to be thought, or to be said, that they are gods?</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>And they are made by workmen, and by goldsmiths. They shall be nothing else but what the priests will have them to be.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>For the artificers themselves that make them, are of no long continuance. Can those things then that are made by them, be gods?</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>But they have left false things and reproach to them that come after.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>For when war cometh upon them, or evils: the priests consult with themselves, where they may hide themselves with them.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>How then can they be thought to be gods, that can neither deliver themselves from war, nor save themselves from evils?</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>For seeing they are but of wood, and laid over with gold, and with silver, it shall be known hereafter that they are false things, by all nations, and kings: and it shall be manifest that they are no gods, but the work of men’s hands, and that there is no work of God in them.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Whence, therefore, is it known that they are not gods, but the work of men’s hands, and no work of God is in them?</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>They cannot set up a king over the land, nor give rain to men.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>They determine no causes, nor deliver countries from oppression: because they can do nothing, and are as daws between heaven and earth.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>For when fire shall fall upon the house of these gods of wood, and of silver, and of gold, their priests indeed will flee away, and be saved: but they themselves shall be burnt in the midst like beams.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>And they cannot withstand a king and war. How then can it be supposed, or admitted, that they are gods?</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Neither are these gods of wood, and of stone, and laid over with gold, and with silver, able to deliver themselves from thieves or robbers: they that are stronger than them,</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>Shall take from them the gold, and silver, and the raiment wherewith they are clothed, and shall go their way, neither shall they help themselves.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Therefore it is better to be a king that sheweth his power: or else a profitable vessel in the house, with which the owner thereof will be well satisfied: or a door in the house, to keep things safe that are therein, than such false gods.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>The sun, and the moon, and the stars being bright, and sent forth for profitable uses, are obedient.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>In like manner the lightning, when it breaketh forth, is easy to be seen: and after the same manner the wind bloweth in every country.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>And the clouds, when God commandeth them to go over the whole world, do that which is commanded them.</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>The fire also being sent from above to consume mountains, and woods, doth as it is commanded. But these neither in shew, nor in power, are like to any one of them.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Wherefore it is neither to be thought, nor to be said, that they are gods: since they are neither able to judge causes, nor to do any good to men.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Knowing, therefore, that they are not gods, fear them not.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>For neither can they curse kings, nor bless them.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Neither do they shew signs in the heaven to the nations, nor shine as the sun, nor give light as the moon.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>Beasts are better than they, which can fly under a covert, and help themselves.</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>Therefore there is no manner of appearance that they are gods: so fear them not.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>For as a scarecrow in a garden of cucumbers keepeth nothing, so are their gods of wood, and of silver, and laid over with gold.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>They are no better than a white thorn in a garden, upon which every bird sitteth. In like manner also their gods of wood, and laid over with gold, and with silver, are like to a dead body cast forth in the dark.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>By the purple also and the scarlet which are motheaten upon them, you shall know that they are not gods. And they themselves at last are consumed, and shall be a reproach in the country.</button><button type="button" data-verse="72" aria-pressed="false" class="verse"><sup>72</sup>Better, therefore, is the just man that hath no idols: for he shall be far from reproach.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Propter peccata quæ peccastis ante Deum, abducemini in Babyloniam captivi a Nabuchodonosor rege Babylonis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Ingressi itaque in Babylonem, eritis ibi annis plurimis, et temporibus longis, usque ad generationes septem : post hoc autem educam vos inde cum pace.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Nunc autem videbitis in Babylonia deos aureos et argenteos, et lapideos et ligneos, in humeris portari, ostentantes metum gentibus.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Videte ergo ne et vos similes efficiamini factis alienis, et metuatis, et metus vos capiat in ipsis.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Visa itaque turba de retro et ab ante, adorantes dicite in cordibus vestris : Te oportet adorari, Domine.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Angelus enim meus vobiscum est : ipse autem exquiram animas vestras.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Nam lingua ipsorum polita a fabro ; ipsa etiam inaurata et inargentata : falsa sunt, et non possunt loqui.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et sicut virgini amanti ornamenta, ita accepto auro fabricati sunt.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Coronas certe aureas habent super capita sua dii illorum : unde subtrahunt sacerdotes ab eis aurum et argentum, et erogant illud in semetipsos.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Dant autem et ex ipso prostitutis, et meretrices ornant : et iterum cum receperint illud a meretricibus, ornant deos suos.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Hi autem non liberantur ab ærugine et tinea.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Opertis autem illis veste purpurea, extergunt faciem ipsorum propter pulverem domus qui est plurimus inter eos.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Sceptrum autem habet ut homo, sicut judex regionis, qui in se peccantem non interficit.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Habet etiam in manu gladium et securim, se autem de bello et a latronibus non liberat. Unde vobis notum sit quia non sunt dii :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>non ergo timueritis eos. Sicut enim vas hominis confractum inutile efficitur, tales sunt et dii illorum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Constitutis illis in domo, oculi eorum pleni sunt pulvere a pedibus introëuntium.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et sicut alicui qui regem offendit circumseptæ sunt januæ, aut sicut ad sepulchrum adductum mortuum : ita tutantur sacerdotes ostia clausuris et seris, ne a latronibus expolientur.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Lucernas accendunt illis, et quidem multas, ex quibus nullam videre possunt : sunt autem sicut trabes in domo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Corda vero eorum dicunt elingere serpentes qui de terra sunt, dum comedunt eos, et vestimentum ipsorum, et non sentiunt.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Nigræ fiunt facies eorum a fumo qui in domo fit.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Supra corpus eorum et supra caput eorum volant noctuæ, et hirundines, et aves etiam, similiter et cattæ.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Unde sciatis quia non sunt dii : ne ergo timueritis eos.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Aurum etiam quod habent ad speciem est : nisi aliquis exterserit æruginem, non fulgebunt : neque enim dum conflarentur, sentiebant.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Ex omni pretio empta sunt, in quibus spiritus non inest ipsis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Sine pedibus, in humeris portantur, ostentantes ignobilitatem suam hominibus : confundantur etiam qui colunt ea.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Propterea si ceciderint in terram, a semetipsis non consurgunt : neque si quis eum statuerit rectum, per semetipsum stabit : sed sicut mortuis munera eorum illis apponentur.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Hostias illorum vendunt sacerdotes ipsorum, et abutuntur : similiter et mulieres eorum decerpentes, neque infirmo, neque mendicanti, aliquid impertiunt.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>De sacrificiis eorum fœtæ et menstruatæ contingunt. Sciens itaque ex his quia non sunt dii, ne timeatis eos.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Unde enim vocantur dii ? quia mulieres apponunt diis argenteis, et aureis, et ligneis :</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>et in domibus eorum sacerdotes sedent habentes tunicas scissas, et capita et barbam rasam, quorum capita nuda sunt.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Rugiunt autem clamantes contra deos suos sicut in cœna mortui.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Vestimenta eorum auferunt sacerdotes, et vestiunt uxores suas et filios suos.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Neque si quid mali patiuntur ab aliquo, neque si quid boni, poterunt retribuere : neque regem constituere possunt, neque auferre.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Similiter neque dare divitias possunt, neque malum retribuere. Si quis illis votum voverit et non reddiderit, neque hoc requirunt.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Hominem a morte non liberant, neque infirmum a potentiori eripiunt.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Hominem cæcum ad visum non restituunt ; de necessitate hominem non liberabunt.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Viduæ non miserebuntur, neque orphanis benefacient.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>Lapidibus de monte similes sunt dii illorum, lignei, et lapidei, et aurei, et argentei : qui autem colunt ea, confundentur.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>Quomodo ergo æstimandum est aut dicendum illos esse deos ?</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>Adhuc enim ipsis Chaldæis non honorantibus ea : qui cum audierint mutum non posse loqui, offerunt illud ad Bel, postulantes ab eo loqui :</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>quasi possint sentire qui non habent motum ! Et ipsi, cum intellexerint, relinquent ea : sensum enim non habent ipsi dii illorum.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Mulieres autem circumdatæ funibus in viis sedent, succendentes ossa olivarum :</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>cum autem aliqua ex ipsis, attracta ab aliquo transeunte, dormierit cum eo, proximæ suæ exprobrat quod ea non sit digna habita, sicut ipsa, neque funis ejus diruptus sit.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Omnia autem quæ illi fiunt, falsa sunt : quomodo æstimandum aut dicendum est illos esse deos ?</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>A fabris autem et ab aurificibus facta sunt : nihil aliud erunt, nisi id quod volunt esse sacerdotes.</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>Artifices etiam ipsi, qui ea faciunt, non sunt multi temporis : numquid ergo possunt ea, quæ fabricata sunt ab ipsis, esse dii ?</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>Reliquerunt autem falsa et opprobrium postea futuris.</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>Nam cum supervenerit illis prælium et mala, cogitant sacerdotes apud se ubi se abscondant cum illis.</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>Quomodo ergo sentiri debeant quoniam dii sunt, qui nec de bello se liberant, neque de malis se eripiunt ?</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>Nam cum sint lignea, inaurata et inargentata, scietur postea quia falsa sunt ab universis gentibus et regibus : quæ manifesta sunt quia non sunt dii, sed opera manuum hominum, et nullum Dei opus cum illis.</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>Unde ergo notum est quia non sunt dii, sed opera manuum hominum, et nullum Dei opus in ipsis est.</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>Regem regioni non suscitant, neque pluviam hominibus dabunt.</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>Judicium quoque non discernent, neque regiones liberabunt ab injuria, quia nihil possunt, sicut corniculæ inter medium cæli et terræ.</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>Etenim cum inciderit ignis in domum deorum ligneorum, argenteorum et aureorum, sacerdotes quidem ipsorum fugient, et liberabuntur : ipsi vero sicut trabes in medio comburentur.</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>Regi autem et bello non resistent. Quomodo ergo æstimandum est aut recipiendum quia dii sunt ?</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>Non a furibus, neque a latronibus se liberabunt dii lignei, et lapidei, et inaurati, et inargentati : quibus hi qui fortiores sunt,</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>aurum et argentum, et vestimentum quo operti sunt, auferent illis, et abibunt, nec sibi auxilium ferent.</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>Itaque melius est esse regem ostentantem virtutem suam, aut vas in domo utile, in quo gloriabitur qui possidet illud, vel ostium in domo, quod custodit quæ in ipsa sunt, quam falsi dii.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>Sol quidem et luna ac sidera, cum sint splendida et emissa ad utilitates, obaudiunt :</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>similiter et fulgur cum apparuerit, perspicuum est : idipsum autem et spiritus in omni regione spirat :</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>et nubes, quibus cum imperatum fuerit a Deo perambulare universum orbem, perficiunt quod imperatum est eis :</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>ignis etiam missus desuper, ut consumat montes et silvas, facit quod præceptum est ei : hæc autem neque speciebus, neque virtutibus, uni eorum similia sunt.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>Unde neque existimandum est, neque dicendum illos esse deos, quando non possunt neque judicium judicare, neque quidquam facere hominibus.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>Scientes itaque quia non sunt dii, ne ergo timueritis eos.</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Neque enim regibus maledicent, neque benedicent.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Signa etiam in cælo gentibus non ostendunt : neque ut sol lucebunt, neque illuminabunt ut luna.</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>Bestiæ meliores sunt illis, quæ possunt fugere sub tectum ac prodesse sibi.</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>Nullo itaque modo nobis est manifestum quia sunt dii : propter quod ne timeatis eos.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>Nam sicut in cucumerario formido nihil custodit, ita sunt dii illorum lignei, et argentei, et inaurati.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>Eodem modo et in horto spina alba, supra quam omnis avis sedet, similiter et mortuo projecto in tenebris, similes sunt dii illorum lignei, et inaurati, et inargentati.</button><button type="button" data-verse="71" aria-pressed="false" class="verse"><sup>71</sup>A purpura quoque et murice, quæ supra illos tineant, scietis itaque quia non sunt dii : ipsi etiam postremo comeduntur, et erunt opprobrium in regione.</button><button type="button" data-verse="72" aria-pressed="false" class="verse"><sup>72</sup>Melior est homo justus qui non habet simulacra, nam erit longe ab opprobriis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/BAR/5/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Baruch 5</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZK/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezekiel 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->6<!-- --> of <!-- -->6<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class= vicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"BAR.6\",{\"bookId\":30,\"usfm\":\"BAR\",\"bookName\":\"Baruch\",\"drName\":\"Baruch\",\"chapter\":6,\"totalChapters\":6,\"dra\":[{\"verse\":1,\"text\":\"For the sins that you have committed before God, you shall be carried away captives into Babylon by Nabuchodonosor the king of Babylon.\"},{\"verse\":2,\"text\":\"And when you are come into Babylon, you shall be there many years, and for a long time, even to seven generations: and after that I will bring you away from thence with peace.\"},{\"verse\":3,\"text\":\"But now, you shall see in Babylon gods of gold, and of silver, and of stone, and of wood borne upon shoulders, causing fear to the Gentiles.\"},{\"verse\":4,\"text\":\"Beware therefore that you imitate not the doings of others, and be afraid, and the fear of them should seize upon you.\"},{\"verse\":5,\"text\":\"But when you see the multitude behind, and before, adoring them, say you in your hearts: Thou oughtest to be adored, O Lord.\"},{\"verse\":6,\"text\":\"For my angel is with you: And I myself will demand an account of your souls.\"},{\"verse\":7,\"text\":\"For their tongue that is polished by the craftsman, and themselves laid over with gold and silver, are false things, and they cannot speak.\"},{\"verse\":8,\"text\":\"And as if it were for a maiden that loveth to go gay: so do they take gold and make them up.\"},{\"verse\":9,\"text\":\"Their gods have golden crowns upon their heads: whereof the priests secretly convey away from them gold, and silver, and bestow it on themselves.\"},{\"verse\":10,\"text\":\"Yea and they give thereof to prostitutes, and they dress out harlots: and again when they receive it of the harlots, they adorn their gods.\"},{\"verse\":11,\"text\":\"And these gods cannot defend themselves from the rust, and the moth.\"},{\"verse\":12,\"text\":\"But when they have covered them with a purple garment, they wipe their face because of the dust of the house, which is very much among them.\"},{\"verse\":13,\"text\":\"This holdeth a sceptre as a man, as a judge of the country, but cannot put to death one that offendeth him.\"},{\"verse\":14,\"text\":\"And this hath in his hand a sword, or an axe, but cannot save himself from war, or from robbers, whereby be it known to you, that they are not gods.\"},{\"verse\":15,\"text\":\"Therefore fear them not. For as a vessel that a man uses when it is broken becometh useless, even so are their gods:\"},{\"verse\":16,\"text\":\"When they are placed in the house, their eyes are full of dust by the feet of them that go in.\"},{\"verse\":17,\"text\":\"And as the gates are made sure on every side upon one that hath offended the king, or like a dead man carried to the grave, so do the priests secure the doors with bars and locks, lest they be stripped by thieves.\"},{\"verse\":18,\"text\":\"They light candles to them, and in great number, of which they cannot see one: but they are like beams in the house.\"},{\"verse\":19,\"text\":\"And they say that the creeping things which are of the earth, gnaw their hearts, while they eat them and their garments, and they feel it not.\"},{\"verse\":20,\"text\":\"Their faces are black with the smoke that is made in the house.\"},{\"verse\":21,\"text\":\"Owls, and swallows, and other birds fly upon their bodies, and upon their heads, and cats in like manner.\"},{\"verse\":22,\"text\":\"Whereby you may know that they are no gods. Therefore fear them not.\"},{\"verse\":23,\"text\":\"The gold also which they have, is for shew, but except a man wipe off the rust, they will not shine: for neither when they were molten, did they feel it.\"},{\"verse\":24,\"text\":\"Men buy them at a high price, whereas there is no breath in them.\"},{\"verse\":25,\"text\":\"And having not the use of feet they are carried upon shoulders, declaring to men how vile they are. Be they confounded also that worship them.\"},{\"verse\":26,\"text\":\"Therefore if they fall to the ground, they rise not up again of themselves, nor if a man set them upright, will they stand by themselves, but their gifts shall be set before them, as to the dead.\"},{\"verse\":27,\"text\":\"The things that are sacrificed to them, their priests sell and abuse: in like manner also their wives take part of them, but give nothing of it either to the sick, or to the poor.\"},{\"verse\":28,\"text\":\"The childbearing and menstruous women touch their sacrifices: knowing, therefore, by these things that they are not gods, fear them not.\"},{\"verse\":29,\"text\":\"For how can they be called gods? because women set offerings before the gods of silver, and of gold, and of wood:\"},{\"verse\":30,\"text\":\"And priests sit in their temples, having their garments rent, and their heads and beards shaven, and nothing upon their heads.\"},{\"verse\":31,\"text\":\"And they roar and cry before their gods, as men do at the feast when one is dead.\"},{\"verse\":32,\"text\":\"The priests take away their garments, and clothe their wives and their children.\"},{\"verse\":33,\"text\":\"And whether it be evil that one doth unto them, or good, they are not able to recompense it: neither can they set up a king, nor put him down:\"},{\"verse\":34,\"text\":\"In like manner they can neither give riches, nor requite evil. If a man make a vow to them, and perform it not: they cannot require it.\"},{\"verse\":35,\"text\":\"They cannot deliver a man from death, nor save the weak from the mighty.\"},{\"verse\":36,\"text\":\"They cannot restore the blind man to his sight: nor deliver a man from distress.\"},{\"verse\":37,\"text\":\"They shall not pity the widow, nor do good to the fatherless.\"},{\"verse\":38,\"text\":\"Their gods, of wood, and of stone, and of gold, and of silver, are like the stones that are hewn out of the mountains: and they that worship them shall be confounded.\"},{\"verse\":39,\"text\":\"How then is it to be supposed, or to be said, that they are gods?\"},{\"verse\":40,\"text\":\"Even the Chaldeans themselves dishonor them: who when they hear of one dumb that cannot speak, they present him to Bel, entreating him, that he may speak.\"},{\"verse\":41,\"text\":\"As though they could be sensible that have no motion themselves: and they, when they shall perceive this, will leave them: for their gods themselves have no sense.\"},{\"verse\":42,\"text\":\"The women also, with cords about them, sit in the ways, burning olive-stones.\"},{\"verse\":43,\"text\":\"And when any one of them, drawn away by some passenger, lieth with him, she upbraideth her neighbor, that she was not thought as worthy as herself, nor her cord broken.\"},{\"verse\":44,\"text\":\"But all things that are done about them, are false: how is it then to be thought, or to be said, that they are gods?\"},{\"verse\":45,\"text\":\"And they are made by workmen, and by goldsmiths. They shall be nothing else but what the priests will have them to be.\"},{\"verse\":46,\"text\":\"For the artificers themselves that make them, are of no long continuance. Can those things then that are made by them, be gods?\"},{\"verse\":47,\"text\":\"But they have left false things and reproach to them that come after.\"},{\"verse\":48,\"text\":\"For when war cometh upon them, or evils: the priests consult with themselves, where they may hide themselves with them.\"},{\"verse\":49,\"text\":\"How then can they be thought to be gods, that can neither deliver themselves from war, nor save themselves from evils?\"},{\"verse\":50,\"text\":\"For seeing they are but of wood, and laid over with gold, and with silver, it shall be known hereafter that they are false things, by all nations, and kings: and it shall be manifest that they are no gods, but the work of men’s hands, and that there is no work of God in them.\"},{\"verse\":51,\"text\":\"Whence, therefore, is it known that they are not gods, but the work of men’s hands, and no work of God is in them?\"},{\"verse\":52,\"text\":\"They cannot set up a king over the land, nor give rain to men.\"},{\"verse\":53,\"text\":\"They determine no causes, nor deliver countries from oppression: because they can do nothing, and are as daws between heaven and earth.\"},{\"verse\":54,\"text\":\"For when fire shall fall upon the house of these gods of wood, and of silver, and of gold, their priests indeed will flee away, and be saved: but they themselves shall be burnt in the midst like beams.\"},{\"verse\":55,\"text\":\"And they cannot withstand a king and war. How then can it be supposed, or admitted, that they are gods?\"},{\"verse\":56,\"text\":\"Neither are these gods of wood, and of stone, and laid over with gold, and with silver, able to deliver themselves from thieves or robbers: they that are stronger than them,\"},{\"verse\":57,\"text\":\"Shall take from them the gold, and silver, and the raiment wherewith they are clothed, and shall go their way, neither shall they help themselves.\"},{\"verse\":58,\"text\":\"Therefore it is better to be a king that sheweth his power: or else a profitable vessel in the house, with which the owner thereof will be well satisfied: or a door in the house, to keep things safe that are therein, than such false gods.\"},{\"verse\":59,\"text\":\"The sun, and the moon, and the stars being bright, and sent forth for profitable uses, are obedient.\"},{\"verse\":60,\"text\":\"In like manner the lightning, when it breaketh forth, is easy to be seen: and after the same manner the wind bloweth in every country.\"},{\"verse\":61,\"text\":\"And the clouds, when God commandeth them to go over the whole world, do that which is commanded them.\"},{\"verse\":62,\"text\":\"The fire also being sent from above to consume mountains, and woods, doth as it is commanded. But these neither in shew, nor in power, are like to any one of them.\"},{\"verse\":63,\"text\":\"Wherefore it is neither to be thought, nor to be said, that they are gods: since they are neither able to judge causes, nor to do any good to men.\"},{\"verse\":64,\"text\":\"Knowing, therefore, that they are not gods, fear them not.\"},{\"verse\":65,\"text\":\"For neither can they curse kings, nor bless them.\"},{\"verse\":66,\"text\":\"Neither do they shew signs in the heaven to the nations, nor shine as the sun, nor give light as the moon.\"},{\"verse\":67,\"text\":\"Beasts are better than they, which can fly under a covert, and help themselves.\"},{\"verse\":68,\"text\":\"Therefore there is no manner of appearance that they are gods: so fear them not.\"},{\"verse\":69,\"text\":\"For as a scarecrow in a garden of cucumbers keepeth nothing, so are their gods of wood, and of silver, and laid over with gold.\"},{\"verse\":70,\"text\":\"They are no better than a white thorn in a garden, upon which every bird sitteth. In like manner also their gods of wood, and laid over with gold, and with silver, are like to a dead body cast forth in the dark.\"},{\"verse\":71,\"text\":\"By the purple also and the scarlet which are motheaten upon them, you shall know that they are not gods. And they themselves at last are consumed, and shall be a reproach in the country.\"},{\"verse\":72,\"text\":\"Better, therefore, is the just man that hath no idols: for he shall be far from reproach.\"}],\"vul\":[{\"verse\":1,\"text\":\"Propter peccata quæ peccastis ante Deum, abducemini in Babyloniam captivi a Nabuchodonosor rege Babylonis.\"},{\"verse\":2,\"text\":\"Ingressi itaque in Babylonem, eritis ibi annis plurimis, et temporibus longis, usque ad generationes septem : post hoc autem educam vos inde cum pace.\"},{\"verse\":3,\"text\":\"Nunc autem videbitis in Babylonia deos aureos et argenteos, et lapideos et ligneos, in humeris portari, ostentantes metum gentibus.\"},{\"verse\":4,\"text\":\"Videte ergo ne et vos similes efficiamini factis alienis, et metuatis, et metus vos capiat in ipsis.\"},{\"verse\":5,\"text\":\"Visa itaque turba de retro et ab ante, adorantes dicite in cordibus vestris : Te oportet adorari, Domine.\"},{\"verse\":6,\"text\":\"Angelus enim meus vobiscum est : ipse autem exquiram animas vestras.\"},{\"verse\":7,\"text\":\"Nam lingua ipsorum polita a fabro ; ipsa etiam inaurata et inargentata : falsa sunt, et non possunt loqui.\"},{\"verse\":8,\"text\":\"Et sicut virgini amanti ornamenta, ita accepto auro fabricati sunt.\"},{\"verse\":9,\"text\":\"Coronas certe aureas habent super capita sua dii illorum : unde subtrahunt sacerdotes ab eis aurum et argentum, et erogant illud in semetipsos.\"},{\"verse\":10,\"text\":\"Dant autem et ex ipso prostitutis, et meretrices ornant : et iterum cum receperint illud a meretricibus, ornant deos suos.\"},{\"verse\":11,\"text\":\"Hi autem non liberantur ab ærugine et tinea.\"},{\"verse\":12,\"text\":\"Opertis autem illis veste purpurea, extergunt faciem ipsorum propter pulverem domus qui est plurimus inter eos.\"},{\"verse\":13,\"text\":\"Sceptrum autem habet ut homo, sicut judex regionis, qui in se peccantem non interficit.\"},{\"verse\":14,\"text\":\"Habet etiam in manu gladium et securim, se autem de bello et a latronibus non liberat. Unde vobis notum sit quia non sunt dii :\"},{\"verse\":15,\"text\":\"non ergo timueritis eos. Sicut enim vas hominis confractum inutile efficitur, tales sunt et dii illorum.\"},{\"verse\":16,\"text\":\"Constitutis illis in domo, oculi eorum pleni sunt pulvere a pedibus introëuntium.\"},{\"verse\":17,\"text\":\"Et sicut alicui qui regem offendit circumseptæ sunt januæ, aut sicut ad sepulchrum adductum mortuum : ita tutantur sacerdotes ostia clausuris et seris, ne a latronibus expolientur.\"},{\"verse\":18,\"text\":\"Lucernas accendunt illis, et quidem multas, ex quibus nullam videre possunt : sunt autem sicut trabes in domo.\"},{\"verse\":19,\"text\":\"Corda vero eorum dicunt elingere serpentes qui de terra sunt, dum comedunt eos, et vestimentum ipsorum, et non sentiunt.\"},{\"verse\":20,\"text\":\"Nigræ fiunt facies eorum a fumo qui in domo fit.\"},{\"verse\":21,\"text\":\"Supra corpus eorum et supra caput eorum volant noctuæ, et hirundines, et aves etiam, similiter et cattæ.\"},{\"verse\":22,\"text\":\"Unde sciatis quia non sunt dii : ne ergo timueritis eos.\"},{\"verse\":23,\"text\":\"Aurum etiam quod habent ad speciem est : nisi aliquis exterserit æruginem, non fulgebunt : neque enim dum conflarentur, sentiebant.\"},{\"verse\":24,\"text\":\"Ex omni pretio empta sunt, in quibus spiritus non inest ipsis.\"},{\"verse\":25,\"text\":\"Sine pedibus, in humeris portantur, ostentantes ignobilitatem suam hominibus : confundantur etiam qui colunt ea.\"},{\"verse\":26,\"text\":\"Propterea si ceciderint in terram, a semetipsis non consurgunt : neque si quis eum statuerit rectum, per semetipsum stabit : sed sicut mortuis munera eorum illis apponentur.\"},{\"verse\":27,\"text\":\"Hostias illorum vendunt sacerdotes ipsorum, et abutuntur : similiter et mulieres eorum decerpentes, neque infirmo, neque mendicanti, aliquid impertiunt.\"},{\"verse\":28,\"text\":\"De sacrificiis eorum fœtæ et menstruatæ contingunt. Sciens itaque ex his quia non sunt dii, ne timeatis eos.\"},{\"verse\":29,\"text\":\"Unde enim vocantur dii ? quia mulieres apponunt diis argenteis, et aureis, et ligneis :\"},{\"verse\":30,\"text\":\"et in domibus eorum sacerdotes sedent habentes tunicas scissas, et capita et barbam rasam, quorum capita nuda sunt.\"},{\"verse\":31,\"text\":\"Rugiunt autem clamantes contra deos suos sicut in cœna mortui.\"},{\"verse\":32,\"text\":\"Vestimenta eorum auferunt sacerdotes, et vestiunt uxores suas et filios suos.\"},{\"verse\":33,\"text\":\"Neque si quid mali patiuntur ab aliquo, neque si quid boni, poterunt retribuere : neque regem constituere possunt, neque auferre.\"},{\"verse\":34,\"text\":\"Similiter neque dare divitias possunt, neque malum retribuere. Si quis illis votum voverit et non reddiderit, neque hoc requirunt.\"},{\"verse\":35,\"text\":\"Hominem a morte non liberant, neque infirmum a potentiori eripiunt.\"},{\"verse\":36,\"text\":\"Hominem cæcum ad visum non restituunt ; de necessitate hominem non liberabunt.\"},{\"verse\":37,\"text\":\"Viduæ non miserebuntur, neque orphanis benefacient.\"},{\"verse\":38,\"text\":\"Lapidibus de monte similes sunt dii illorum, lignei, et lapidei, et aurei, et argentei : qui autem colunt ea, confundentur.\"},{\"verse\":39,\"text\":\"Quomodo ergo æstimandum est aut dicendum illos esse deos ?\"},{\"verse\":40,\"text\":\"Adhuc enim ipsis Chaldæis non honorantibus ea : qui cum audierint mutum non posse loqui, offerunt illud ad Bel, postulantes ab eo loqui :\"},{\"verse\":41,\"text\":\"quasi possint sentire qui non habent motum ! Et ipsi, cum intellexerint, relinquent ea : sensum enim non habent ipsi dii illorum.\"},{\"verse\":42,\"text\":\"Mulieres autem circumdatæ funibus in viis sedent, succendentes ossa olivarum :\"},{\"verse\":43,\"text\":\"cum autem aliqua ex ipsis, attracta ab aliquo transeunte, dormierit cum eo, proximæ suæ exprobrat quod ea non sit digna habita, sicut ipsa, neque funis ejus diruptus sit.\"},{\"verse\":44,\"text\":\"Omnia autem quæ illi fiunt, falsa sunt : quomodo æstimandum aut dicendum est illos esse deos ?\"},{\"verse\":45,\"text\":\"A fabris autem et ab aurificibus facta sunt : nihil aliud erunt, nisi id quod volunt esse sacerdotes.\"},{\"verse\":46,\"text\":\"Artifices etiam ipsi, qui ea faciunt, non sunt multi temporis : numquid ergo possunt ea, quæ fabricata sunt ab ipsis, esse dii ?\"},{\"verse\":47,\"text\":\"Reliquerunt autem falsa et opprobrium postea futuris.\"},{\"verse\":48,\"text\":\"Nam cum supervenerit illis prælium et mala, cogitant sacerdotes apud se ubi se abscondant cum illis.\"},{\"verse\":49,\"text\":\"Quomodo ergo sentiri debeant quoniam dii sunt, qui nec de bello se liberant, neque de malis se eripiunt ?\"},{\"verse\":50,\"text\":\"Nam cum sint lignea, inaurata et inargentata, scietur postea quia falsa sunt ab universis gentibus et regibus : quæ manifesta sunt quia non sunt dii, sed opera manuum hominum, et nullum Dei opus cum illis.\"},{\"verse\":51,\"text\":\"Unde ergo notum est quia non sunt dii, sed opera manuum hominum, et nullum Dei opus in ipsis est.\"},{\"verse\":52,\"text\":\"Regem regioni non suscitant, neque pluviam hominibus dabunt.\"},{\"verse\":53,\"text\":\"Judicium quoque non discernent, neque regiones liberabunt ab injuria, quia nihil possunt, sicut corniculæ inter medium cæli et terræ.\"},{\"verse\":54,\"text\":\"Etenim cum inciderit ignis in domum deorum ligneorum, argenteorum et aureorum, sacerdotes quidem ipsorum fugient, et liberabuntur : ipsi vero sicut trabes in medio comburentur.\"},{\"verse\":55,\"text\":\"Regi autem et bello non resistent. Quomodo ergo æstimandum est aut recipiendum quia dii sunt ?\"},{\"verse\":56,\"text\":\"Non a furibus, neque a latronibus se liberabunt dii lignei, et lapidei, et inaurati, et inargentati : quibus hi qui fortiores sunt,\"},{\"verse\":57,\"text\":\"aurum et argentum, et vestimentum quo operti sunt, auferent illis, et abibunt, nec sibi auxilium ferent.\"},{\"verse\":58,\"text\":\"Itaque melius est esse regem ostentantem virtutem suam, aut vas in domo utile, in quo gloriabitur qui possidet illud, vel ostium in domo, quod custodit quæ in ipsa sunt, quam falsi dii.\"},{\"verse\":59,\"text\":\"Sol quidem et luna ac sidera, cum sint splendida et emissa ad utilitates, obaudiunt :\"},{\"verse\":60,\"text\":\"similiter et fulgur cum apparuerit, perspicuum est : idipsum autem et spiritus in omni regione spirat :\"},{\"verse\":61,\"text\":\"et nubes, quibus cum imperatum fuerit a Deo perambulare universum orbem, perficiunt quod imperatum est eis :\"},{\"verse\":62,\"text\":\"ignis etiam missus desuper, ut consumat montes et silvas, facit quod præceptum est ei : hæc autem neque speciebus, neque virtutibus, uni eorum similia sunt.\"},{\"verse\":63,\"text\":\"Unde neque existimandum est, neque dicendum illos esse deos, quando non possunt neque judicium judicare, neque quidquam facere hominibus.\"},{\"verse\":64,\"text\":\"Scientes itaque quia non sunt dii, ne ergo timueritis eos.\"},{\"verse\":65,\"text\":\"Neque enim regibus maledicent, neque benedicent.\"},{\"verse\":66,\"text\":\"Signa etiam in cælo gentibus non ostendunt : neque ut sol lucebunt, neque illuminabunt ut luna.\"},{\"verse\":67,\"text\":\"Bestiæ meliores sunt illis, quæ possunt fugere sub tectum ac prodesse sibi.\"},{\"verse\":68,\"text\":\"Nullo itaque modo nobis est manifestum quia sunt dii : propter quod ne timeatis eos.\"},{\"verse\":69,\"text\":\"Nam sicut in cucumerario formido nihil custodit, ita sunt dii illorum lignei, et argentei, et inaurati.\"},{\"verse\":70,\"text\":\"Eodem modo et in horto spina alba, supra quam omnis avis sedet, similiter et mortuo projecto in tenebris, similes sunt dii illorum lignei, et inaurati, et inargentati.\"},{\"verse\":71,\"text\":\"A purpura quoque et murice, quæ supra illos tineant, scietis itaque quia non sunt dii : ipsi etiam postremo comeduntur, et erunt opprobrium in regione.\"},{\"verse\":72,\"text\":\"Melior est homo justus qui non habet simulacra, nam erit longe ab opprobriis.\"}],\"summary\":\"The epistle of Jeremias to the captives, as a preservative against idolatry.\",\"intro\":null,\"prev\":{\"usfm\":\"BAR\",\"chapter\":5,\"label\":\"Baruch 5\"},\"next\":{\"usfm\":\"EZK\",\"chapter\":1,\"label\":\"Ezekiel 1\"}}]]\n"])</script></body></html>
