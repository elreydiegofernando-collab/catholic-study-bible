y-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Then king Darius gave orders, and they searched in the library of the books that were laid up in Babylon,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And there was found in Ecbatana, which is a castle in the province of Media, a book in which this record was written.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In the first year of Cyrus the king: Cyrus the king decreed, that the house of God should be built, which is in Jerusalem, in the place where they may offer sacrifices, and that they lay the foundations that may support the height of threescore cubits, and the breadth of threescore cubits,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Three rows of unpolished stones, and so rows of new timber: and the charges shall be given out of the king’s house.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And also let the golden and silver vessels of the temple of God, which Nabuchodonosor took out of the temple of Jerusalem, and brought to Babylon, be restored, and carried back to the temple of Jerusalem to their place, which also were placed in the temple of God.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Now therefore Thathanai, governor of the country beyond the river, Stharbuzanai, and your counsellors the Apharsachites, who are beyond the river, depart far from them,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And let that temple of God be built by the governor of the Jews, and by their ancients, that they may build that house of God in its place.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>I also have commanded what must be done by those ancients of the Jews, that the house of God may be built, to wit, that of the king’s chest, that is, of the tribute that is paid out of the country beyond the river, the charges be diligently given to those men, lest the work be hindered.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And if it shall be necessary, let calves also, and lambs, and kids, for holocausts to the God of heaven, wheat, salt, wine, and oil, according to the custom of the priests that are in Jerusalem, be given them day by day, that there be no complaint in any thing.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And let them offer oblations to the God of heaven, and pray for the life of the king, and of his children.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And I have made a decree: That if any whosoever, shall alter this commandment, a beam be taken from his house, and set up, and he be nailed upon it, and his house be confiscated.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And may the God, that hath caused his name to dwell there, destroy all kingdoms, and the people that shall put out their hand to resist, and to destroy the house of God, that is in Jerusalem. I Darius have made the decree, which I will have diligently complied with.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>So then Thathanai, governor of the country beyond the river, and Stharbuzanai, and his counsellors diligently executed what Darius the king had commanded.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And the ancients of the Jews built, and prospered according to the prophecy of Aggeus the prophet, and of Zacharias the son of Addo: and they built and finished, by the commandment of the God of Israel, and by the commandment of Cyrus, and Darius, and Artaxerxes kings of the Persians.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And they were finishing this house of God, until the third day of the month of Adar, which was in the sixth year of the reign of king Darius.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the children of Israel, the priests and the Levites, and the rest of the children of the captivity kept the dedication of the house of God with joy.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they offered at the dedication of the house of God, a hundred calves, two hundred rams, four hundred lambs, and for a sin offering for all Israel twelve he goats, according to the number of the tribes of Israel.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And they set the priests in their divisions, and the Levites in their courses over the works of God in Jerusalem, as it is written in the book of Moses.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And the children of Israel of the captivity kept the phase, on the fourteenth day of the first month.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For all the priests and the Levites were purified as one man: all were clean to kill the phase for all the children of the captivity, and for their brethren the priests, and themselves.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And the children of Israel that were returned from captivity, and all that had separated themselves from the filthiness of the nations of the earth to them, to seek the Lord the God of Israel, did eat.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And they kept the feast of unleavened bread seven days with joy, for the Lord had made them joyful, and had turned the heart of the king of Assyria to them, that he should help their hands in the work of the house of the Lord the God of Israel.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Tunc Darius rex præcepit : et recensuerunt in bibliotheca librorum, qui erant repositi in Babylone.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et inventum est in Ecbatanis, quod est castrum in Medena provincia, volumen unum : talisque scriptus erat in eo commentarius :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Anno primo Cyri regis, Cyrus rex decrevit ut domus Dei ædificaretur, quæ est in Jerusalem, in loco ubi immolent hostias, et ut ponant fundamenta supportantia altitudinem cubitorum sexaginta, et latitudinem cubitorum sexaginta,</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>ordines de lapidibus impolitis tres, et sic ordines de lignis novis : sumptus autem de domo regis dabuntur.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Sed et vasa templi Dei aurea et argentea, quæ Nabuchodonosor tulerat de templo Jerusalem, et attulerat ea in Babylonem, reddantur, et referantur in templum in Jerusalem in locum suum, quæ et posita sunt in templo Dei.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Nunc ergo Thathanai dux regionis, quæ est trans flumen, Stharbuzanai, et consiliarii vestri Apharsachæi, qui estis trans flumen, procul recedite ab illis,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et dimittite fieri templum Dei illud a duce Judæorum, et a senioribus eorum, ut domum Dei illam ædificent in loco suo.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Sed et a me præceptum est quid oporteat fieri a presbyteris Judæorum illis ut ædificetur domus Dei, scilicet ut de arca regis, id est, de tributis quæ dantur de regione trans flumen, studiose sumptus dentur viris illis, ne impediatur opus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quod si necesse fuerit, et vitulos, et agnos, et hædos in holocaustum Deo cæli, frumentum, sal, vinum, et oleum, secundum ritum sacerdotum, qui sunt in Jerusalem, detur eis per singulos dies, ne sit in aliquo querimonia.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et offerant oblationes Deo cæli, orentque pro vita regis, et filiorum ejus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>A me ergo positum est decretum : ut omnis homo qui hanc mutaverit jussionem, tollatur lignum de domum ipsius, et erigatur, et configatur in eo, domus autem ejus publicetur.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Deus autem, qui habitare fecit nomen suum ibi, dissipet omnia regna, et populum qui extenderit manum suam ut repugnet, et dissipet domum Dei illam, quæ est in Jerusalem. Ego Darius statui decretum, quod studiose impleri volo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Igitur Thathanai dux regionis trans flumen, et Stharbuzanai, et consiliarii ejus, secundum quod præceperat Darius rex, sic diligenter executi sunt.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Seniores autem Judæorum ædificabant, et prosperabantur juxta prophetiam Aggæi prophetæ, et Zachariæ filii Addo : et ædificaverunt et construxerunt, jubente Deo Israël, et jubente Cyro, et Dario, et Artaxerxe regibus Persarum :</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>et compleverunt domum Dei istam, usque ad diem tertium mensis Adar, qui est annus sextus regni Darii regis.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Fecerunt autem filii Israël sacerdotes et Levitæ, et reliqui filiorum transmigrationis, dedicationem domus Dei in gaudio.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et obtulerunt in dedicationem domus Dei, vitulos centum, arietes ducentos, agnos quadringentos, hircos caprarum pro peccato totius Israël duodecim, juxta numerum tribuum Israël.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et statuerunt sacerdotes in ordinibus suis, et Levitas in vicibus suis, super opera Dei in Jerusalem, sicut scriptum est in libro Moysi.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Fecerunt autem filii Israël transmigrationis Pascha, quartadecima die mensis primi.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Purificati enim fuerant sacerdotes et Levitæ quasi unus : omnes mundi ad immolandum Pascha universis filiis transmigrationis, et fratribus suis sacerdotibus, et sibi.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et comederunt filii Israël, qui reversi fuerant de transmigratione, et omnes qui se separaverant a coinquinatione gentium terræ ad eos, ut quærerent Dominum Deum Israël.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et fecerunt solemnitatem azymorum septem diebus in lætitia, quoniam lætificaverat eos Dominus, et converterat cor regis Assur ad eos, ut adjuvaret manus eorum in opere domus Domini Dei Israël.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chap rReader\"]\na:[[\"$\",\"$L18\",\"EZR.6\",{\"bookId\":15,\"usfm\":\"EZR\",\"bookName\":\"Ezra\",\"drName\":\"1 Esdras\",\"chapter\":6,\"totalChapters\":10,\"dra\":[{\"verse\":1,\"text\":\"Then king Darius gave orders, and they searched in the library of the books that were laid up in Babylon,\"},{\"verse\":2,\"text\":\"And there was found in Ecbatana, which is a castle in the province of Media, a book in which this record was written.\"},{\"verse\":3,\"text\":\"In the first year of Cyrus the king: Cyrus the king decreed, that the house of God should be built, which is in Jerusalem, in the place where they may offer sacrifices, and that they lay the foundations that may support the height of threescore cubits, and the breadth of threescore cubits,\"},{\"verse\":4,\"text\":\"Three rows of unpolished stones, and so rows of new timber: and the charges shall be given out of the king’s house.\"},{\"verse\":5,\"text\":\"And also let the golden and silver vessels of the temple of God, which Nabuchodonosor took out of the temple of Jerusalem, and brought to Babylon, be restored, and carried back to the temple of Jerusalem to their place, which also were placed in the temple of God.\"},{\"verse\":6,\"text\":\"Now therefore Thathanai, governor of the country beyond the river, Stharbuzanai, and your counsellors the Apharsachites, who are beyond the river, depart far from them,\"},{\"verse\":7,\"text\":\"And let that temple of God be built by the governor of the Jews, and by their ancients, that they may build that house of God in its place.\"},{\"verse\":8,\"text\":\"I also have commanded what must be done by those ancients of the Jews, that the house of God may be built, to wit, that of the king’s chest, that is, of the tribute that is paid out of the country beyond the river, the charges be diligently given to those men, lest the work be hindered.\"},{\"verse\":9,\"text\":\"And if it shall be necessary, let calves also, and lambs, and kids, for holocausts to the God of heaven, wheat, salt, wine, and oil, according to the custom of the priests that are in Jerusalem, be given them day by day, that there be no complaint in any thing.\"},{\"verse\":10,\"text\":\"And let them offer oblations to the God of heaven, and pray for the life of the king, and of his children.\"},{\"verse\":11,\"text\":\"And I have made a decree: That if any whosoever, shall alter this commandment, a beam be taken from his house, and set up, and he be nailed upon it, and his house be confiscated.\"},{\"verse\":12,\"text\":\"And may the God, that hath caused his name to dwell there, destroy all kingdoms, and the people that shall put out their hand to resist, and to destroy the house of God, that is in Jerusalem. I Darius have made the decree, which I will have diligently complied with.\"},{\"verse\":13,\"text\":\"So then Thathanai, governor of the country beyond the river, and Stharbuzanai, and his counsellors diligently executed what Darius the king had commanded.\"},{\"verse\":14,\"text\":\"And the ancients of the Jews built, and prospered according to the prophecy of Aggeus the prophet, and of Zacharias the son of Addo: and they built and finished, by the commandment of the God of Israel, and by the commandment of Cyrus, and Darius, and Artaxerxes kings of the Persians.\"},{\"verse\":15,\"text\":\"And they were finishing this house of God, until the third day of the month of Adar, which was in the sixth year of the reign of king Darius.\"},{\"verse\":16,\"text\":\"And the children of Israel, the priests and the Levites, and the rest of the children of the captivity kept the dedication of the house of God with joy.\"},{\"verse\":17,\"text\":\"And they offered at the dedication of the house of God, a hundred calves, two hundred rams, four hundred lambs, and for a sin offering for all Israel twelve he goats, according to the number of the tribes of Israel.\"},{\"verse\":18,\"text\":\"And they set the priests in their divisions, and the Levites in their courses over the works of God in Jerusalem, as it is written in the book of Moses.\"},{\"verse\":19,\"text\":\"And the children of Israel of the captivity kept the phase, on the fourteenth day of the first month.\"},{\"verse\":20,\"text\":\"For all the priests and the Levites were purified as one man: all were clean to kill the phase for all the children of the captivity, and for their brethren the priests, and themselves.\"},{\"verse\":21,\"text\":\"And the children of Israel that were returned from captivity, and all that had separated themselves from the filthiness of the nations of the earth to them, to seek the Lord the God of Israel, did eat.\"},{\"verse\":22,\"text\":\"And they kept the feast of unleavened bread seven days with joy, for the Lord had made them joyful, and had turned the heart of the king of Assyria to them, that he should help their hands in the work of the house of the Lord the God of Israel.\"}],\"vul\":[{\"verse\":1,\"text\":\"Tunc Darius rex præcepit : et recensuerunt in bibliotheca librorum, qui erant repositi in Babylone.\"},{\"verse\":2,\"text\":\"Et inventum est in Ecbatanis, quod est castrum in Medena provincia, volumen unum : talisque scriptus erat in eo commentarius :\"},{\"verse\":3,\"text\":\"Anno primo Cyri regis, Cyrus rex decrevit ut domus Dei ædificaretur, quæ est in Jerusalem, in loco ubi immolent hostias, et ut ponant fundamenta supportantia altitudinem cubitorum sexaginta, et latitudinem cubitorum sexaginta,\"},{\"verse\":4,\"text\":\"ordines de lapidibus impolitis tres, et sic ordines de lignis novis : sumptus autem de domo regis dabuntur.\"},{\"verse\":5,\"text\":\"Sed et vasa templi Dei aurea et argentea, quæ Nabuchodonosor tulerat de templo Jerusalem, et attulerat ea in Babylonem, reddantur, et referantur in templum in Jerusalem in locum suum, quæ et posita sunt in templo Dei.\"},{\"verse\":6,\"text\":\"Nunc ergo Thathanai dux regionis, quæ est trans flumen, Stharbuzanai, et consiliarii vestri Apharsachæi, qui estis trans flumen, procul recedite ab illis,\"},{\"verse\":7,\"text\":\"et dimittite fieri templum Dei illud a duce Judæorum, et a senioribus eorum, ut domum Dei illam ædificent in loco suo.\"},{\"verse\":8,\"text\":\"Sed et a me præceptum est quid oporteat fieri a presbyteris Judæorum illis ut ædificetur domus Dei, scilicet ut de arca regis, id est, de tributis quæ dantur de regione trans flumen, studiose sumptus dentur viris illis, ne impediatur opus.\"},{\"verse\":9,\"text\":\"Quod si necesse fuerit, et vitulos, et agnos, et hædos in holocaustum Deo cæli, frumentum, sal, vinum, et oleum, secundum ritum sacerdotum, qui sunt in Jerusalem, detur eis per singulos dies, ne sit in aliquo querimonia.\"},{\"verse\":10,\"text\":\"Et offerant oblationes Deo cæli, orentque pro vita regis, et filiorum ejus.\"},{\"verse\":11,\"text\":\"A me ergo positum est decretum : ut omnis homo qui hanc mutaverit jussionem, tollatur lignum de domum ipsius, et erigatur, et configatur in eo, domus autem ejus publicetur.\"},{\"verse\":12,\"text\":\"Deus autem, qui habitare fecit nomen suum ibi, dissipet omnia regna, et populum qui extenderit manum suam ut repugnet, et dissipet domum Dei illam, quæ est in Jerusalem. Ego Darius statui decretum, quod studiose impleri volo.\"},{\"verse\":13,\"text\":\"Igitur Thathanai dux regionis trans flumen, et Stharbuzanai, et consiliarii ejus, secundum quod præceperat Darius rex, sic diligenter executi sunt.\"},{\"verse\":14,\"text\":\"Seniores autem Judæorum ædificabant, et prosperabantur juxta prophetiam Aggæi prophetæ, et Zachariæ filii Addo : et ædificaverunt et construxerunt, jubente Deo Israël, et jubente Cyro, et Dario, et Artaxerxe regibus Persarum :\"},{\"verse\":15,\"text\":\"et compleverunt domum Dei istam, usque ad diem tertium mensis Adar, qui est annus sextus regni Darii regis.\"},{\"verse\":16,\"text\":\"Fecerunt autem filii Israël sacerdotes et Levitæ, et reliqui filiorum transmigrationis, dedicationem domus Dei in gaudio.\"},{\"verse\":17,\"text\":\"Et obtulerunt in dedicationem domus Dei, vitulos centum, arietes ducentos, agnos quadringentos, hircos caprarum pro peccato totius Israël duodecim, juxta numerum tribuum Israël.\"},{\"verse\":18,\"text\":\"Et statuerunt sacerdotes in ordinibus suis, et Levitas in vicibus suis, super opera Dei in Jerusalem, sicut scriptum est in libro Moysi.\"},{\"verse\":19,\"text\":\"Fecerunt autem filii Israël transmigrationis Pascha, quartadecima die mensis primi.\"},{\"verse\":20,\"text\":\"Purificati enim fuerant sacerdotes et Levitæ quasi unus : omnes mundi ad immolandum Pascha universis filiis transmigrationis, et fratribus suis sacerdotibus, et sibi.\"},{\"verse\":21,\"text\":\"Et comederunt filii Israël, qui reversi fuerant de transmigratione, et omnes qui se separaverant a coinquinatione gentium terræ ad eos, ut quærerent Dominum Deum Israël.\"},{\"verse\":22,\"text\":\"Et fecerunt solemnitatem azymorum septem diebus in lætitia, quoniam lætificaverat eos Dominus, et converterat cor regis Assur ad eos, ut adjuvaret manus eorum in opere domus Domini Dei Israël.\"}],\"summary\":\"King Darius favoureth the building and contributeth to it.\",\"intro\":null,\"prev\":{\"usfm\":\"EZR\",\"chapter\":5,\"label\":\"Ezra 5\"},\"next\":{\"usfm\":\"EZR\",\"chapter\":7,\"label\":\"Ezra 7\"}}]]\n"])</script></body></html>
