20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Ezra<!-- --> <span class="text-stone-500">4</span></h1><p class="mt-0.5 text-[0.9375rem] text-stone-500">Douay: <!-- -->1 Esdras</p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">The Samaritans by their letter to the king hinder the building.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now the enemies of Juda and Benjamin heard that the children of the captivity were building a temple to the Lord the God of Israel.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And they came to Zorobabel, and the chief of the fathers, and said to them: Let us build with you, for we seek your God as ye do: behold we have sacrificed to him, since the days of Asor Haddan king of Assyria, who brought us hither.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>But Zorobabel, and Josue, and the rest of the chief of the fathers of Israel said to them: You have nothing to do with us to build a house to our God, but we ourselves alone will build to the Lord our God, as Cyrus king of the Persians hath commanded us.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Then the people of the land hindered the hands of the people of Juda, and troubled them in building.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And they hired counsellors against them, to frustrate their design all the days of Cyrus king of Persia, even until the reign of Darius king of the Persians.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And in the reign of Assuerus, in the beginning of his reign, they wrote an accusation against the inhabitants of Juda and Jerusalem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And in the days of Artaxerxes, Beselam, Mithridates, and Thabeel, and the rest that were in the council wrote to Artaxerxes king of the Persians: and the letter of accusation was written in Syrian, and was read in the Syrian tongue.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Reum Beelteem, and Samsai the scribe wrote a letter from Jerusalem to king Artaxerxes, in this manner:</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Reum Beelteem, and Samsai the scribe and the rest of their counsellors, the Dinites, and the Apharsathacites, the Therphalites, the Apharsites, the Erchuites, the Babylonians, the Susanechites, the Dievites, and the Elamites,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And the rest of the nations, whom the great and glorious Asenaphar brought over: and made to dwell in the cities of Samaria and in the rest of the countries of this side of the river in peace.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>(This is the copy of the letter, which they sent to him:) To Artaxerxes the king, thy servants, the men that are on this side of the river, send greeting.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Be it known to the king, that the Jews, who came up from thee to us, are come to Jerusalem a rebellious and wicked city, which they are building, setting up the ramparts thereof and repairing the walls.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And now be it known to the king, that if this city be built up, and the walls thereof repaired, they will not pay tribute nor toll, nor yearly revenues, and this loss will fall upon the kings.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>But we remembering the salt that we have eaten in the palace, and because we count it a crime to see the king wronged, have therefore sent and certified the king,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>That search may be made in the books of the histories of thy fathers, and thou shalt find written in the records: and shalt know that this city is a rebellious city, and hurtful to the kings and provinces, and that wars were raised therein of old time: for which cause also the city was destroyed.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>We certify the king, that if this city be built, and the walls thereof repaired, thou shalt have no possession on this side of the river.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The king sent word to Reum Beelteem and Samsai the scribe, and to the rest that were in their council, inhabitants of Samaria, and to the rest beyond the river, sending greeting and peace.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The accusation, which you have sent to us, hath been plainly read before me,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And I commanded: and search hath been made, and it is found, that this city of old time hath rebelled against kings, and seditions and wars have been raised therein.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>For there have been powerful kings in Jerusalem, who have had dominion over all the country that is beyond the river: and have received tribute, and toll and revenues.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Now therefore hear the sentence: Hinder those men, that this city be not built, till further orders be given by me.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>See that you be not negligent in executing this, lest by little and little the evil grow to the hurt of the kings.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Now the copy of the edict of king Artaxerxes was read before Reum Beelteem, and Samsai the scribe, and their counsellors: and they went up in haste to Jerusalem to the Jews, and hindered them with arm and power.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Then the work of the house of the Lord in Jerusalem was interrupted, and ceased till the second year of the reign of Darius king of the Persians.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Audierunt autem hostes Judæ et Benjamin, quia filii captivitatis ædificarent templum Domino Deo Israël :</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>et accedentes ad Zorobabel, et ad principes patrum, dixerunt eis : Ædificemus vobiscum, quia ita ut vos, quærimus Deum vestrum : ecce nos immolavimus victimas a diebus Asor Haddan regis Assur, qui adduxit nos huc.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Et dixit eis Zorobabel, et Josue, et reliqui principes patrum Israël : Non est vobis et nobis ut ædificemus domum Deo nostro, sed nos ipsi soli ædificabimus Domino Deo nostro, sicut præcepit nobis Cyrus rex Persarum.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Factum est igitur ut populus terræ impediret manus populi Judæ, et turbaret eos in ædificando.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Conduxerunt autem adversus eos consiliatores, ut destruerent consilium eorum omnibus diebus Cyri regis Persarum, et usque ad regnum Darii regis Persarum.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>In regno autem Assueri, in principio regni ejus, scripserunt accusationem adversus habitatores Judæ et Jerusalem.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et in diebus Artaxerxis scripsit Beselam, Mithridates, et Thabeel, et reliqui qui erant in consilio eorum, ad Artaxerxem regem Persarum : epistola autem accusationis scripta erat syriace, et legebatur sermone syro.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Reum Beelteem, et Samsai scriba, scripserunt epistolam unam de Jerusalem Artaxerxi regi, hujuscemodi :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Reum Beelteem, et Samsai scriba, et reliqui consiliatores eorum, Dinæi, et Apharsathachæi, Terphalæi, Apharsæi, Erchuæi, Babylonii, Susanechæi, Dievi, et Ælamitæ,</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>et ceteri de gentibus, quas transtulit Asenaphar magnus et gloriosus, et habitare eas fecit in civitatibus Samariæ, et in reliquis regionibus trans flumen in pace</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>(hoc est exemplar epistolæ, quam miserunt ad eum), Artaxerxi regi, servi tui, viri qui sunt trans fluvium, salutem dicunt.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Notum sit regi quia Judæi, qui ascenderunt a te ad nos, venerunt in Jerusalem civitatem rebellem et pessimam, quam ædificant exstruentes muros ejus, et parietes componentes.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nunc igitur notum sit regi, quia si civitas illa ædificata fuerit, et muri ejus instaurati, tributum, et vectigal, et annuos reditus non dabunt, et usque ad reges hæc noxa perveniet.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Nos autem memores salis, quod in palatio comedimus, et quia læsiones regis videre nefas ducimus, idcirco misimus et nuntiavimus regi,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>ut recenseas in libris historiarum patrum tuorum, et invenies scriptum in commentariis : et scies quoniam urbs illa, urbs rebellis est, et nocens regibus et provinciis, et bella concitantur in ea ex diebus antiquis : quam ob rem et civitas ipsa destructa est.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Nuntiamus nos regi, quoniam si civitas illa ædificata fuerit, et muri ipsius instaurati, possessionem trans fluvium non habebis.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Verbum misit rex ad Reum Beelteem, et Samsai scribam, et ad reliquos, qui erant in consilio eorum habitatores Samariæ, et ceteris trans fluvium, salutem dicens et pacem.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Accusatio, quam misistis ad nos, manifeste lecta est coram me,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>et a me præceptum est : et recensuerunt, inveneruntque quoniam civitas illa a diebus antiquis adversum reges rebellat, et seditiones, et prælia concitantur in ea :</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>nam et reges fortissimi fuerunt in Jerusalem, qui et dominati sunt omni regioni quæ trans fluvium est : tributum quoque et vectigal, et reditus accipiebant.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Nunc ergo audite sententiam : prohibeatis viros illos, ut urbs illa non ædificetur donec si forte a me jussum fuerit.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Videte ne negligenter hoc impleatis, et paulatim crescat malum contra reges.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Itaque exemplum edicti Artaxerxis regis lectum est coram Reum Beelteem, et Samsai scriba, et consiliariis eorum : et abierunt festini in Jerusalem ad Judæos, et prohibuerunt eos in brachio et robore.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Tunc intermissum est opus domus Domini in Jerusalem, et non fiebat usque ad annum secundum regni Darii regis Persarum.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZR/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ezra 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZR/5/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ezra 5</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->4<!-- --> of <!-- -->10<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Ezra 3" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EZR/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" fm\":\"EZR\",\"bookName\":\"Ezra\",\"drName\":\"1 Esdras\",\"chapter\":4,\"totalChapters\":10,\"dra\":[{\"verse\":1,\"text\":\"Now the enemies of Juda and Benjamin heard that the children of the captivity were building a temple to the Lord the God of Israel.\"},{\"verse\":2,\"text\":\"And they came to Zorobabel, and the chief of the fathers, and said to them: Let us build with you, for we seek your God as ye do: behold we have sacrificed to him, since the days of Asor Haddan king of Assyria, who brought us hither.\"},{\"verse\":3,\"text\":\"But Zorobabel, and Josue, and the rest of the chief of the fathers of Israel said to them: You have nothing to do with us to build a house to our God, but we ourselves alone will build to the Lord our God, as Cyrus king of the Persians hath commanded us.\"},{\"verse\":4,\"text\":\"Then the people of the land hindered the hands of the people of Juda, and troubled them in building.\"},{\"verse\":5,\"text\":\"And they hired counsellors against them, to frustrate their design all the days of Cyrus king of Persia, even until the reign of Darius king of the Persians.\"},{\"verse\":6,\"text\":\"And in the reign of Assuerus, in the beginning of his reign, they wrote an accusation against the inhabitants of Juda and Jerusalem.\"},{\"verse\":7,\"text\":\"And in the days of Artaxerxes, Beselam, Mithridates, and Thabeel, and the rest that were in the council wrote to Artaxerxes king of the Persians: and the letter of accusation was written in Syrian, and was read in the Syrian tongue.\"},{\"verse\":8,\"text\":\"Reum Beelteem, and Samsai the scribe wrote a letter from Jerusalem to king Artaxerxes, in this manner:\"},{\"verse\":9,\"text\":\"Reum Beelteem, and Samsai the scribe and the rest of their counsellors, the Dinites, and the Apharsathacites, the Therphalites, the Apharsites, the Erchuites, the Babylonians, the Susanechites, the Dievites, and the Elamites,\"},{\"verse\":10,\"text\":\"And the rest of the nations, whom the great and glorious Asenaphar brought over: and made to dwell in the cities of Samaria and in the rest of the countries of this side of the river in peace.\"},{\"verse\":11,\"text\":\"(This is the copy of the letter, which they sent to him:) To Artaxerxes the king, thy servants, the men that are on this side of the river, send greeting.\"},{\"verse\":12,\"text\":\"Be it known to the king, that the Jews, who came up from thee to us, are come to Jerusalem a rebellious and wicked city, which they are building, setting up the ramparts thereof and repairing the walls.\"},{\"verse\":13,\"text\":\"And now be it known to the king, that if this city be built up, and the walls thereof repaired, they will not pay tribute nor toll, nor yearly revenues, and this loss will fall upon the kings.\"},{\"verse\":14,\"text\":\"But we remembering the salt that we have eaten in the palace, and because we count it a crime to see the king wronged, have therefore sent and certified the king,\"},{\"verse\":15,\"text\":\"That search may be made in the books of the histories of thy fathers, and thou shalt find written in the records: and shalt know that this city is a rebellious city, and hurtful to the kings and provinces, and that wars were raised therein of old time: for which cause also the city was destroyed.\"},{\"verse\":16,\"text\":\"We certify the king, that if this city be built, and the walls thereof repaired, thou shalt have no possession on this side of the river.\"},{\"verse\":17,\"text\":\"The king sent word to Reum Beelteem and Samsai the scribe, and to the rest that were in their council, inhabitants of Samaria, and to the rest beyond the river, sending greeting and peace.\"},{\"verse\":18,\"text\":\"The accusation, which you have sent to us, hath been plainly read before me,\"},{\"verse\":19,\"text\":\"And I commanded: and search hath been made, and it is found, that this city of old time hath rebelled against kings, and seditions and wars have been raised therein.\"},{\"verse\":20,\"text\":\"For there have been powerful kings in Jerusalem, who have had dominion over all the country that is beyond the river: and have received tribute, and toll and revenues.\"},{\"verse\":21,\"text\":\"Now therefore hear the sentence: Hinder those men, that this city be not built, till further orders be given by me.\"},{\"verse\":22,\"text\":\"See that you be not negligent in executing this, lest by little and little the evil grow to the hurt of the kings.\"},{\"verse\":23,\"text\":\"Now the copy of the edict of king Artaxerxes was read before Reum Beelteem, and Samsai the scribe, and their counsellors: and they went up in haste to Jerusalem to the Jews, and hindered them with arm and power.\"},{\"verse\":24,\"text\":\"Then the work of the house of the Lord in Jerusalem was interrupted, and ceased till the second year of the reign of Darius king of the Persians.\"}],\"vul\":[{\"verse\":1,\"text\":\"Audierunt autem hostes Judæ et Benjamin, quia filii captivitatis ædificarent templum Domino Deo Israël :\"},{\"verse\":2,\"text\":\"et accedentes ad Zorobabel, et ad principes patrum, dixerunt eis : Ædificemus vobiscum, quia ita ut vos, quærimus Deum vestrum : ecce nos immolavimus victimas a diebus Asor Haddan regis Assur, qui adduxit nos huc.\"},{\"verse\":3,\"text\":\"Et dixit eis Zorobabel, et Josue, et reliqui principes patrum Israël : Non est vobis et nobis ut ædificemus domum Deo nostro, sed nos ipsi soli ædificabimus Domino Deo nostro, sicut præcepit nobis Cyrus rex Persarum.\"},{\"verse\":4,\"text\":\"Factum est igitur ut populus terræ impediret manus populi Judæ, et turbaret eos in ædificando.\"},{\"verse\":5,\"text\":\"Conduxerunt autem adversus eos consiliatores, ut destruerent consilium eorum omnibus diebus Cyri regis Persarum, et usque ad regnum Darii regis Persarum.\"},{\"verse\":6,\"text\":\"In regno autem Assueri, in principio regni ejus, scripserunt accusationem adversus habitatores Judæ et Jerusalem.\"},{\"verse\":7,\"text\":\"Et in diebus Artaxerxis scripsit Beselam, Mithridates, et Thabeel, et reliqui qui erant in consilio eorum, ad Artaxerxem regem Persarum : epistola autem accusationis scripta erat syriace, et legebatur sermone syro.\"},{\"verse\":8,\"text\":\"Reum Beelteem, et Samsai scriba, scripserunt epistolam unam de Jerusalem Artaxerxi regi, hujuscemodi :\"},{\"verse\":9,\"text\":\"Reum Beelteem, et Samsai scriba, et reliqui consiliatores eorum, Dinæi, et Apharsathachæi, Terphalæi, Apharsæi, Erchuæi, Babylonii, Susanechæi, Dievi, et Ælamitæ,\"},{\"verse\":10,\"text\":\"et ceteri de gentibus, quas transtulit Asenaphar magnus et gloriosus, et habitare eas fecit in civitatibus Samariæ, et in reliquis regionibus trans flumen in pace\"},{\"verse\":11,\"text\":\"(hoc est exemplar epistolæ, quam miserunt ad eum), Artaxerxi regi, servi tui, viri qui sunt trans fluvium, salutem dicunt.\"},{\"verse\":12,\"text\":\"Notum sit regi quia Judæi, qui ascenderunt a te ad nos, venerunt in Jerusalem civitatem rebellem et pessimam, quam ædificant exstruentes muros ejus, et parietes componentes.\"},{\"verse\":13,\"text\":\"Nunc igitur notum sit regi, quia si civitas illa ædificata fuerit, et muri ejus instaurati, tributum, et vectigal, et annuos reditus non dabunt, et usque ad reges hæc noxa perveniet.\"},{\"verse\":14,\"text\":\"Nos autem memores salis, quod in palatio comedimus, et quia læsiones regis videre nefas ducimus, idcirco misimus et nuntiavimus regi,\"},{\"verse\":15,\"text\":\"ut recenseas in libris historiarum patrum tuorum, et invenies scriptum in commentariis : et scies quoniam urbs illa, urbs rebellis est, et nocens regibus et provinciis, et bella concitantur in ea ex diebus antiquis : quam ob rem et civitas ipsa destructa est.\"},{\"verse\":16,\"text\":\"Nuntiamus nos regi, quoniam si civitas illa ædificata fuerit, et muri ipsius instaurati, possessionem trans fluvium non habebis.\"},{\"verse\":17,\"text\":\"Verbum misit rex ad Reum Beelteem, et Samsai scribam, et ad reliquos, qui erant in consilio eorum habitatores Samariæ, et ceteris trans fluvium, salutem dicens et pacem.\"},{\"verse\":18,\"text\":\"Accusatio, quam misistis ad nos, manifeste lecta est coram me,\"},{\"verse\":19,\"text\":\"et a me præceptum est : et recensuerunt, inveneruntque quoniam civitas illa a diebus antiquis adversum reges rebellat, et seditiones, et prælia concitantur in ea :\"},{\"verse\":20,\"text\":\"nam et reges fortissimi fuerunt in Jerusalem, qui et dominati sunt omni regioni quæ trans fluvium est : tributum quoque et vectigal, et reditus accipiebant.\"},{\"verse\":21,\"text\":\"Nunc ergo audite sententiam : prohibeatis viros illos, ut urbs illa non ædificetur donec si forte a me jussum fuerit.\"},{\"verse\":22,\"text\":\"Videte ne negligenter hoc impleatis, et paulatim crescat malum contra reges.\"},{\"verse\":23,\"text\":\"Itaque exemplum edicti Artaxerxis regis lectum est coram Reum Beelteem, et Samsai scriba, et consiliariis eorum : et abierunt festini in Jerusalem ad Judæos, et prohibuerunt eos in brachio et robore.\"},{\"verse\":24,\"text\":\"Tunc intermissum est opus domus Domini in Jerusalem, et non fiebat usque ad annum secundum regni Darii regis Persarum.\"}],\"summary\":\"The Samaritans by their letter to the king hinder the building.\",\"intro\":null,\"prev\":{\"usfm\":\"EZR\",\"chapter\":3,\"label\":\"Ezra 3\"},\"next\":{\"usfm\":\"EZR\",\"chapter\":5,\"label\":\"Ezra 5\"}}]]\n"])</script></body></html>
