lic Study Bible"/><link rel="manifest" href="/catholic-study-bible/manifest.webmanifest"/><meta name="robots" content="noindex, nofollow"/><meta name="format-detection" content="telephone=no, address=no, email=no"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="Study Bible"/><meta name="apple-mobile-web-app-status-bar-style" content="default"/><link rel="icon" href="/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico" sizes="48x48" type="image/x-icon"/><link rel="apple-touch-icon" href="/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png" sizes="180x180" type="image/png"/><meta name="next-size-adjust" content=""/><script>(function(){try{var t=localStorage.getItem("ts");if(t)document.documentElement.setAttribute("data-ts",t)}catch(e){}})()</script><script>(function(){try{var q=new URLSearchParams(location.search).get("t");var t=q==="VUL"||q==="DRA"?q:localStorage.getItem("lang");if(q)localStorage.setItem("lang",q);if(t==="VUL")document.documentElement.setAttribute("data-t","VUL")}catch(e){}})()</script><script src="/catholic-study-bible/_next/static/chunks/0cz1d0mv5g_q7.js" noModule=""></script></head><body class="min-h-dvh flex flex-col font-sans"><div hidden=""><!--$--><!--/$--></div><header class="sticky top-0 z-20 border-b border-stone-300/70 bg-paper/90 pt-[env(safe-area-inset-top)] backdrop-blur"><div class="mx-auto flex h-14 max-w-6xl items-center justify-between gap-1 px-2 sm:px-4"><a class="flex min-h-11 items-center rounded-full px-2 font-serif text-xl tracking-wide" href="/catholic-study-bible/">Study Bible</a><nav class="flex items-center gap-0.5" aria-label="Main"><a aria-label="Search" class="inline-flex h-11 w-11 items-center justify-center rounded-full text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/search/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-[1.35rem] w-[1.35rem]" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></a><a class="inline-flex h-11 items-center rounded-full px-3 text-[0.9375rem] text-stone-700 hover:bg-stone-200/60 active:bg-stone-200" href="/catholic-study-bible/doctors/">Doctors</a><div class="relative"><button type="button" aria-label="Text size" aria-expanded="false" class="inline-flex h-11 w-11 items-center justify-center rounded-full font-serif text-lg text-stone-700 hover:bg-stone-200/60 active:bg-stone-200">Aa</button></div></nav></div></header><main class="flex-1"><!--$!--><template data-dgst="BAILOUT_TO_CLIENT_SIDE_RENDERING"></template><!--/$--><div class="mx-auto max-w-6xl px-4 sm:px-6 "><article class="mx-auto max-w-[38rem] pb-[calc(6.5rem+env(safe-area-inset-bottom))] "><header class="pb-2 pt-5"><h1 class="font-serif text-[2rem] leading-tight">Ezra<!-- --> <span class="text-stone-500">10</span></h1><p class="mt-0.5 flex flex-wrap items-center gap-x-3 text-[0.9375rem] text-stone-500"><span>Douay: <!-- -->1 Esdras</span><a class="inline-flex min-h-11 items-center text-sky-700 underline" href="/catholic-study-bible/read/EZR/">About <!-- -->Ezra</a></p><div class="mt-3 inline-flex rounded-full border border-stone-300 bg-card p-1" role="group" aria-label="Language"><button type="button" data-lang="DRA" aria-pressed="true" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">English</button><button type="button" data-lang="VUL" aria-pressed="false" class="lang-btn inline-flex h-11 items-center rounded-full px-4 text-[0.9375rem] text-stone-700">Latin</button></div></header><p class="mb-4 mt-2 border-l-2 border-stone-300 pl-3 font-serif text-[1.0625rem] italic leading-[1.55] text-stone-600">Order is given for discharging strange women: the names of the guilty.</p><p class="mb-2 text-sm text-stone-500">Tap a verse for the original words, the Church&#x27;s teaching and commentary.</p><div data-list="DRA" class="only-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now when Esdras was thus praying, and beseeching, and weeping, and lying before the temple of God, there was gathered to him of Israel an exceeding great assembly of men and women and children, and the people wept with much lamentation.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Sechenias the son of Jehiel of the sons of Elam answered, and said to Esdras: We have sinned against our God, and have taken strange wives of the people of the land: and now if there be repentance in Israel concerning this,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Let us make a covenant with the Lord our God, to put away all the wives, and such as are born of them, according to the will of the Lord, and of them that fear the commandment of the Lord our God: let it be done according to the law.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Arise, it is thy part to give orders, and we will be with thee: take courage, and do it.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>So Esdras arose, and made the chiefs of the priests and of the Levites, and all Israel, to swear that they would do according to this word, and they swore.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And Esdras rose up from before the house of God, and went to the chamber of Johanan the son of Eliasib, and entered in thither: he ate no bread, and drank no water: for he mourned for the transgression of them that were come out of the captivity.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And proclamation was made in Juda and Jerusalem to all the children of the captivity, that they should assemble together into Jerusalem.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And that whosoever would not come within three days, according to the counsel of the princes and the ancients, all his substance should be taken away, and he should be cast out of the company of them that were returned from captivity.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Then all the men of Juda, and Benjamin gathered themselves together to Jerusalem within three days, in the ninth month, the twentieth day of the month: and all the people sat in the street of the house of God, trembling because of the sin, and the rain.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>And Esdras the priest stood up, and said to them: You have transgressed, and taken strange wives, to add to the sins of Israel.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And now make confession to the Lord the God of your fathers, and do his pleasure, and separate yourselves from the people of the land, and from your strange wives.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>And all the multitude answered and said with a loud voice: According to thy word unto us, so be it done.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But as the people are many, and it is time of rain, and we are not able to stand without, and it is not a work of one day or two, (for we have exceedingly sinned in this matter,)</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Let rulers be appointed in all the multitude: and in all our cities, let them that have taken strange wives come at the times appointed, and with them the ancients and the judges of every city, until the wrath of our God be turned away from us for this sin.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Then Jonathan the son of Azahel, and Jaasia the son of Thecua were appointed over this, and Mesollam and Sebethai, Levites, helped them:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And the children of the captivity did so. And Esdras the priest, and the men heads of the families in the houses of their fathers, and all by their names, went and sat down in the first day of the tenth month to examine the matter.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And they made an end with all the men that had taken strange wives by the first day of the first month.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>And there were found among the sons of the priests that had taken strange wives: Of the sons of Josue the son of Josedec, and his brethren, Maasia, and Eliezer, and Jarib, and Godolia.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And they gave their hands to put away their wives, and to offer for their offence a ram of the flock.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And of the sons of Emmer, Hanani, and Zebedia.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And of the sons of Harim, Maasia, and Elia, and Semeia, and Jehiel, and Ozias.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And of the sons of Pheshur, Elioenai, Maasia, Ismael, Nathanael, Jozabed, and Elasa.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And of the sons of the Levites, Jozabed, and Semei, and Celaia, the same is Calita, Phataia, Juda, and Eliezer.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And of the singing men, Elisiab: and of the porters, Sellum, and Telem, and Uri.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>And of Israel, of the sons of Pharos, Remeia, and Jezia, and Melchia, and Miamin, and Eliezer, and Melchia, and Banea.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>And of the sons of Elam, Mathania, Zacharias, and Jehiel, and Abdi, and Jerimoth, and Elia.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>And of the sons of Zethua, Elioenai, Eliasib, Mathania, Jerimuth, and Zabad, and Aziaza.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>And of the sons of Babai, Johanan, Hanania, Zabbai, Athalai:</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>And of the sons of Bani, Mosollam, and Melluch, and Adaia, Jasub, and Saal, and Ramoth.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And of the sons of Phahath, Moab, Edna, and Chalal, Banaias, and Maasias, Mathanias, Beseleel, Bennui, and Manasse.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>And of the sons of Herem, Eliezer, Josue, Melchias, Semeias, Simeon,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Benjamin, Maloch, Samarias.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>And of the sons of Hasom, Mathanai, Mathatha, Zabad, Eliphelet, Jermai, Manasse, Semei.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>Of the sons of Bani, Maaddi, Amram, and Uel,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Baneas, and Badaias, Cheliau,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Vania, Marimuth, and Eliasib,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Mathanias, Mathania, and Jasi,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>And Bani, and Bennui, Semei,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>And Salmias, and Nathan, and Adaias,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>And Mechnedebai, Sisai, Sarai,</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Ezrel, and Selemiau, Semeria,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Sellum, Amaria, Joseph.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>Of the sons of Nebo, Jehiel, Mathathias, Zabad, Zabina, Jeddu, and Joel, and Banaia.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>All these had taken strange wives, and there were among them women that had borne children.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Sic ergo orante Esdra, et implorante eo et flente, et jacente ante templum Dei, collectus est ad eum de Israël cœtus grandis nimis virorum et mulierum et puerorum, et flevit populus fletu multo.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Et respondit Sechenias filius Jehiel de filiis Ælam, et dixit Esdræ : Nos prævaricati sumus in Deum nostrum, et duximus uxores alienigenas de populis terræ : et nunc, si est pœnitentia in Israël super hoc,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>percutiamus fœdus cum Domino Deo nostro, ut projiciamus universas uxores, et eos qui de his nati sunt, juxta voluntatem Domini, et eorum qui timent præceptum Domini Dei nostri : secundum legem fiat.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Surge, tuum est decernere, nosque erimus tecum : confortare, et fac.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Surrexit ergo Esdras, et adjuravit principes sacerdotum et Levitarum, et omnem Israël, ut facerent secundum verbum hoc : et juraverunt.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Et surrexit Esdras ante domum Dei, et abiit ad cubiculum Johanan filii Eliasib, et ingressus est illuc : panem non comedit, et aquam non bibit : lugebat enim transgressionem eorum, qui venerant de captivitate.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Et missa est vox in Juda et in Jerusalem omnibus filiis transmigrationis, ut congregarentur in Jerusalem :</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>et omnis qui non venerit in tribus diebus juxta consilium principum et seniorum, auferetur universa substantia ejus, et ipse abjicietur de cœtu transmigrationis.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Convenerunt igitur omnes viri Juda et Benjamin in Jerusalem tribus diebus : ipse est mensis nonus, vigesimo die mensis : et sedit omnis populus in platea domus Dei, trementes pro peccato, et pluviis.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Et surrexit Esdras sacerdos, et dixit ad eos : Vos transgressi estis, et duxistis uxores alienigenas, ut adderetis super delictum Israël.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et nunc date confessionem Domino Deo patrum vestrorum, et facite placitum ejus, et separamini a populis terræ, et ab uxoribus alienigenis.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Et respondit universa multitudo, dixitque voce magna : Juxta verbum tuum ad nos, sic fiat.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Verumtamen quia populus multus est, et tempus pluviæ, et non sustinemus stare foris, et opus non est diei unius vel duorum (vehementer quippe peccavimus in sermone isto),</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>constituantur principes in universa multitudine : et omnes in civitatibus nostris qui duxerunt uxores alienigenas veniant in temporibus statutis, et cum his seniores per civitatem et civitatem, et judices ejus, donec avertatur ira Dei nostri a nobis super peccato hoc.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Igitur Jonathan filius Azahel, et Jaasia filius Thecue, steterunt super hoc, et Messollam et Sebethai Levites adjuverunt eos :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>feceruntque sic filii transmigrationis. Et abierunt Esdras sacerdos, et viri principes familiarum, in domos patrum suorum, et omnes per nomina sua, et sederunt in die primo mensis decimi ut quærerent rem.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et consummati sunt omnes viri, qui duxerant uxores alienigenas, usque ad diem primam mensis primi.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Et inventi sunt de filiis sacerdotum qui duxerant uxores alienigenas. De filiis Josue filii Josedec, et fratres ejus, Maasia, et Eliezer, et Jarib, et Godolia.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Et dederunt manus suas ut ejicerent uxores suas, et pro delicto suo arietem de ovibus offerrent.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Et de filiis Emmer, Hanani, et Zebedia.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et de filiis Harim, Maasia, et Elia, et Semeia, et Jehiel, et Ozias.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Et de filiis Pheshur, Elioënai, Maasia, Ismaël, Nathanaël, Jozabed, et Elasa.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Et de filiis Levitarum, Jozabed, et Semei, et Celaia, ipse est Calita, Phataia, Juda, et Eliezer.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>Et de cantoribus, Eliasib. Et de janitoribus, Sellum, et Telem, et Uri.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Et ex Israël, de filiis Pharos, Remeia, et Jesia, et Melchia, et Miamin, et Eliezer, et Melchia, et Banea.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Et de filiis Ælam, Mathania, Zacharias, et Jehiel, et Abdi, et Jerimoth, et Elia.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Et de filiis Zethua, Elioënai, Eliasib, Mathania, et Jerimuth, et Zabad, et Aziza.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>Et de filiis Bebai, Johanan, Hanania, Zabbai, Athalai.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Et de filiis Bani, Mosollam, et Melluch, et Adaia, Jasub, et Saal, et Ramoth.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et de filiis Phahath Moab, Edna, et Chalal, Banaias, et Maasias, Mathanias, Beseleel, Bennui, et Manasse.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Et de filiis Herem, Eliezer, Josue, Melchias, Semeias, Simeon,</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Benjamin, Maloch, Samarias.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>Et de filiis Hasom, Mathanai, Mathatha, Zabad, Eliphelet, Jermai, Manasse, Semei.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>De filiis Bani, Maadi, Amram, et Vel,</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>Baneas, et Badaias, Cheliau,</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>Vania, Marimuth, et Eliasib,</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>Mathanias, Mathanai, et Jasi,</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>et Bani, et Bennui, Semei,</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>et Salmias, et Nathan, et Adaias,</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>et Mechnedebai, Sisai, Sarai,</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>Ezrel, et Selemiau, Semeria,</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>Sellum, Amaria, Joseph.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>De filiis Nebo, Jehiel, Mathathias, Zabad, Zabina, Jeddu, et Joël, et Banaia.</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>Omnes hi acceperant uxores alienigenas, et fuerunt ex eis mulieres, quæ pepererant filios.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 item \",\"$L18\",\"EZR.10\",{\"bookId\":15,\"usfm\":\"EZR\",\"bookName\":\"Ezra\",\"drName\":\"1 Esdras\",\"chapter\":10,\"totalChapters\":10,\"dra\":[{\"verse\":1,\"text\":\"Now when Esdras was thus praying, and beseeching, and weeping, and lying before the temple of God, there was gathered to him of Israel an exceeding great assembly of men and women and children, and the people wept with much lamentation.\"},{\"verse\":2,\"text\":\"And Sechenias the son of Jehiel of the sons of Elam answered, and said to Esdras: We have sinned against our God, and have taken strange wives of the people of the land: and now if there be repentance in Israel concerning this,\"},{\"verse\":3,\"text\":\"Let us make a covenant with the Lord our God, to put away all the wives, and such as are born of them, according to the will of the Lord, and of them that fear the commandment of the Lord our God: let it be done according to the law.\"},{\"verse\":4,\"text\":\"Arise, it is thy part to give orders, and we will be with thee: take courage, and do it.\"},{\"verse\":5,\"text\":\"So Esdras arose, and made the chiefs of the priests and of the Levites, and all Israel, to swear that they would do according to this word, and they swore.\"},{\"verse\":6,\"text\":\"And Esdras rose up from before the house of God, and went to the chamber of Johanan the son of Eliasib, and entered in thither: he ate no bread, and drank no water: for he mourned for the transgression of them that were come out of the captivity.\"},{\"verse\":7,\"text\":\"And proclamation was made in Juda and Jerusalem to all the children of the captivity, that they should assemble together into Jerusalem.\"},{\"verse\":8,\"text\":\"And that whosoever would not come within three days, according to the counsel of the princes and the ancients, all his substance should be taken away, and he should be cast out of the company of them that were returned from captivity.\"},{\"verse\":9,\"text\":\"Then all the men of Juda, and Benjamin gathered themselves together to Jerusalem within three days, in the ninth month, the twentieth day of the month: and all the people sat in the street of the house of God, trembling because of the sin, and the rain.\"},{\"verse\":10,\"text\":\"And Esdras the priest stood up, and said to them: You have transgressed, and taken strange wives, to add to the sins of Israel.\"},{\"verse\":11,\"text\":\"And now make confession to the Lord the God of your fathers, and do his pleasure, and separate yourselves from the people of the land, and from your strange wives.\"},{\"verse\":12,\"text\":\"And all the multitude answered and said with a loud voice: According to thy word unto us, so be it done.\"},{\"verse\":13,\"text\":\"But as the people are many, and it is time of rain, and we are not able to stand without, and it is not a work of one day or two, (for we have exceedingly sinned in this matter,)\"},{\"verse\":14,\"text\":\"Let rulers be appointed in all the multitude: and in all our cities, let them that have taken strange wives come at the times appointed, and with them the ancients and the judges of every city, until the wrath of our God be turned away from us for this sin.\"},{\"verse\":15,\"text\":\"Then Jonathan the son of Azahel, and Jaasia the son of Thecua were appointed over this, and Mesollam and Sebethai, Levites, helped them:\"},{\"verse\":16,\"text\":\"And the children of the captivity did so. And Esdras the priest, and the men heads of the families in the houses of their fathers, and all by their names, went and sat down in the first day of the tenth month to examine the matter.\"},{\"verse\":17,\"text\":\"And they made an end with all the men that had taken strange wives by the first day of the first month.\"},{\"verse\":18,\"text\":\"And there were found among the sons of the priests that had taken strange wives: Of the sons of Josue the son of Josedec, and his brethren, Maasia, and Eliezer, and Jarib, and Godolia.\"},{\"verse\":19,\"text\":\"And they gave their hands to put away their wives, and to offer for their offence a ram of the flock.\"},{\"verse\":20,\"text\":\"And of the sons of Emmer, Hanani, and Zebedia.\"},{\"verse\":21,\"text\":\"And of the sons of Harim, Maasia, and Elia, and Semeia, and Jehiel, and Ozias.\"},{\"verse\":22,\"text\":\"And of the sons of Pheshur, Elioenai, Maasia, Ismael, Nathanael, Jozabed, and Elasa.\"},{\"verse\":23,\"text\":\"And of the sons of the Levites, Jozabed, and Semei, and Celaia, the same is Calita, Phataia, Juda, and Eliezer.\"},{\"verse\":24,\"text\":\"And of the singing men, Elisiab: and of the porters, Sellum, and Telem, and Uri.\"},{\"verse\":25,\"text\":\"And of Israel, of the sons of Pharos, Remeia, and Jezia, and Melchia, and Miamin, and Eliezer, and Melchia, and Banea.\"},{\"verse\":26,\"text\":\"And of the sons of Elam, Mathania, Zacharias, and Jehiel, and Abdi, and Jerimoth, and Elia.\"},{\"verse\":27,\"text\":\"And of the sons of Zethua, Elioenai, Eliasib, Mathania, Jerimuth, and Zabad, and Aziaza.\"},{\"verse\":28,\"text\":\"And of the sons of Babai, Johanan, Hanania, Zabbai, Athalai:\"},{\"verse\":29,\"text\":\"And of the sons of Bani, Mosollam, and Melluch, and Adaia, Jasub, and Saal, and Ramoth.\"},{\"verse\":30,\"text\":\"And of the sons of Phahath, Moab, Edna, and Chalal, Banaias, and Maasias, Mathanias, Beseleel, Bennui, and Manasse.\"},{\"verse\":31,\"text\":\"And of the sons of Herem, Eliezer, Josue, Melchias, Semeias, Simeon,\"},{\"verse\":32,\"text\":\"Benjamin, Maloch, Samarias.\"},{\"verse\":33,\"text\":\"And of the sons of Hasom, Mathanai, Mathatha, Zabad, Eliphelet, Jermai, Manasse, Semei.\"},{\"verse\":34,\"text\":\"Of the sons of Bani, Maaddi, Amram, and Uel,\"},{\"verse\":35,\"text\":\"Baneas, and Badaias, Cheliau,\"},{\"verse\":36,\"text\":\"Vania, Marimuth, and Eliasib,\"},{\"verse\":37,\"text\":\"Mathanias, Mathania, and Jasi,\"},{\"verse\":38,\"text\":\"And Bani, and Bennui, Semei,\"},{\"verse\":39,\"text\":\"And Salmias, and Nathan, and Adaias,\"},{\"verse\":40,\"text\":\"And Mechnedebai, Sisai, Sarai,\"},{\"verse\":41,\"text\":\"Ezrel, and Selemiau, Semeria,\"},{\"verse\":42,\"text\":\"Sellum, Amaria, Joseph.\"},{\"verse\":43,\"text\":\"Of the sons of Nebo, Jehiel, Mathathias, Zabad, Zabina, Jeddu, and Joel, and Banaia.\"},{\"verse\":44,\"text\":\"All these had taken strange wives, and there were among them women that had borne children.\"}],\"vul\":[{\"verse\":1,\"text\":\"Sic ergo orante Esdra, et implorante eo et flente, et jacente ante templum Dei, collectus est ad eum de Israël cœtus grandis nimis virorum et mulierum et puerorum, et flevit populus fletu multo.\"},{\"verse\":2,\"text\":\"Et respondit Sechenias filius Jehiel de filiis Ælam, et dixit Esdræ : Nos prævaricati sumus in Deum nostrum, et duximus uxores alienigenas de populis terræ : et nunc, si est pœnitentia in Israël super hoc,\"},{\"verse\":3,\"text\":\"percutiamus fœdus cum Domino Deo nostro, ut projiciamus universas uxores, et eos qui de his nati sunt, juxta voluntatem Domini, et eorum qui timent præceptum Domini Dei nostri : secundum legem fiat.\"},{\"verse\":4,\"text\":\"Surge, tuum est decernere, nosque erimus tecum : confortare, et fac.\"},{\"verse\":5,\"text\":\"Surrexit ergo Esdras, et adjuravit principes sacerdotum et Levitarum, et omnem Israël, ut facerent secundum verbum hoc : et juraverunt.\"},{\"verse\":6,\"text\":\"Et surrexit Esdras ante domum Dei, et abiit ad cubiculum Johanan filii Eliasib, et ingressus est illuc : panem non comedit, et aquam non bibit : lugebat enim transgressionem eorum, qui venerant de captivitate.\"},{\"verse\":7,\"text\":\"Et missa est vox in Juda et in Jerusalem omnibus filiis transmigrationis, ut congregarentur in Jerusalem :\"},{\"verse\":8,\"text\":\"et omnis qui non venerit in tribus diebus juxta consilium principum et seniorum, auferetur universa substantia ejus, et ipse abjicietur de cœtu transmigrationis.\"},{\"verse\":9,\"text\":\"Convenerunt igitur omnes viri Juda et Benjamin in Jerusalem tribus diebus : ipse est mensis nonus, vigesimo die mensis : et sedit omnis populus in platea domus Dei, trementes pro peccato, et pluviis.\"},{\"verse\":10,\"text\":\"Et surrexit Esdras sacerdos, et dixit ad eos : Vos transgressi estis, et duxistis uxores alienigenas, ut adderetis super delictum Israël.\"},{\"verse\":11,\"text\":\"Et nunc date confessionem Domino Deo patrum vestrorum, et facite placitum ejus, et separamini a populis terræ, et ab uxoribus alienigenis.\"},{\"verse\":12,\"text\":\"Et respondit universa multitudo, dixitque voce magna : Juxta verbum tuum ad nos, sic fiat.\"},{\"verse\":13,\"text\":\"Verumtamen quia populus multus est, et tempus pluviæ, et non sustinemus stare foris, et opus non est diei unius vel duorum (vehementer quippe peccavimus in sermone isto),\"},{\"verse\":14,\"text\":\"constituantur principes in universa multitudine : et omnes in civitatibus nostris qui duxerunt uxores alienigenas veniant in temporibus statutis, et cum his seniores per civitatem et civitatem, et judices ejus, donec avertatur ira Dei nostri a nobis super peccato hoc.\"},{\"verse\":15,\"text\":\"Igitur Jonathan filius Azahel, et Jaasia filius Thecue, steterunt super hoc, et Messollam et Sebethai Levites adjuverunt eos :\"},{\"verse\":16,\"text\":\"feceruntque sic filii transmigrationis. Et abierunt Esdras sacerdos, et viri principes familiarum, in domos patrum suorum, et omnes per nomina sua, et sederunt in die primo mensis decimi ut quærerent rem.\"},{\"verse\":17,\"text\":\"Et consummati sunt omnes viri, qui duxerant uxores alienigenas, usque ad diem primam mensis primi.\"},{\"verse\":18,\"text\":\"Et inventi sunt de filiis sacerdotum qui duxerant uxores alienigenas. De filiis Josue filii Josedec, et fratres ejus, Maasia, et Eliezer, et Jarib, et Godolia.\"},{\"verse\":19,\"text\":\"Et dederunt manus suas ut ejicerent uxores suas, et pro delicto suo arietem de ovibus offerrent.\"},{\"verse\":20,\"text\":\"Et de filiis Emmer, Hanani, et Zebedia.\"},{\"verse\":21,\"text\":\"Et de filiis Harim, Maasia, et Elia, et Semeia, et Jehiel, et Ozias.\"},{\"verse\":22,\"text\":\"Et de filiis Pheshur, Elioënai, Maasia, Ismaël, Nathanaël, Jozabed, et Elasa.\"},{\"verse\":23,\"text\":\"Et de filiis Levitarum, Jozabed, et Semei, et Celaia, ipse est Calita, Phataia, Juda, et Eliezer.\"},{\"verse\":24,\"text\":\"Et de cantoribus, Eliasib. Et de janitoribus, Sellum, et Telem, et Uri.\"},{\"verse\":25,\"text\":\"Et ex Israël, de filiis Pharos, Remeia, et Jesia, et Melchia, et Miamin, et Eliezer, et Melchia, et Banea.\"},{\"verse\":26,\"text\":\"Et de filiis Ælam, Mathania, Zacharias, et Jehiel, et Abdi, et Jerimoth, et Elia.\"},{\"verse\":27,\"text\":\"Et de filiis Zethua, Elioënai, Eliasib, Mathania, et Jerimuth, et Zabad, et Aziza.\"},{\"verse\":28,\"text\":\"Et de filiis Bebai, Johanan, Hanania, Zabbai, Athalai.\"},{\"verse\":29,\"text\":\"Et de filiis Bani, Mosollam, et Melluch, et Adaia, Jasub, et Saal, et Ramoth.\"},{\"verse\":30,\"text\":\"Et de filiis Phahath Moab, Edna, et Chalal, Banaias, et Maasias, Mathanias, Beseleel, Bennui, et Manasse.\"},{\"verse\":31,\"text\":\"Et de filiis Herem, Eliezer, Josue, Melchias, Semeias, Simeon,\"},{\"verse\":32,\"text\":\"Benjamin, Maloch, Samarias.\"},{\"verse\":33,\"text\":\"Et de filiis Hasom, Mathanai, Mathatha, Zabad, Eliphelet, Jermai, Manasse, Semei.\"},{\"verse\":34,\"text\":\"De filiis Bani, Maadi, Amram, et Vel,\"},{\"verse\":35,\"text\":\"Baneas, et Badaias, Cheliau,\"},{\"verse\":36,\"text\":\"Vania, Marimuth, et Eliasib,\"},{\"verse\":37,\"text\":\"Mathanias, Mathanai, et Jasi,\"},{\"verse\":38,\"text\":\"et Bani, et Bennui, Semei,\"},{\"verse\":39,\"text\":\"et Salmias, et Nathan, et Adaias,\"},{\"verse\":40,\"text\":\"et Mechnedebai, Sisai, Sarai,\"},{\"verse\":41,\"text\":\"Ezrel, et Selemiau, Semeria,\"},{\"verse\":42,\"text\":\"Sellum, Amaria, Joseph.\"},{\"verse\":43,\"text\":\"De filiis Nebo, Jehiel, Mathathias, Zabad, Zabina, Jeddu, et Joël, et Banaia.\"},{\"verse\":44,\"text\":\"Omnes hi acceperant uxores alienigenas, et fuerunt ex eis mulieres, quæ pepererant filios.\"}],\"summary\":\"Order is given for discharging strange women: the names of the guilty.\",\"intro\":null,\"prev\":{\"usfm\":\"EZR\",\"chapter\":9,\"label\":\"Ezra 9\"},\"next\":{\"usfm\":\"NEH\",\"chapter\":1,\"label\":\"Nehemiah 1\"}}]]\n"])</script></body></html>
