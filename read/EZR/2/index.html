ly-dra font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now these are the children of the province, that went out of the captivity, which Nabuchodonosor king of Babylon had carried away to Babylon, and who returned to Jerusalem and Juda, every man to his city.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Who came with Zorobabel, Josue, Nehemia, Saraia, Rahelaia, Mardochai, Belsan, Mesphar, Beguai, Rehum, Baana. The number of the men of the people of Israel:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>The children of Pharos two thousand one hundred seventy-two.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>The children of Sephatia, three hundred seventy-two.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>The children of Area, seven hundred seventy-five.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>The children of Phahath Moab, of the children of Josue: Joab, Two thousand eight hundred twelve.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>The children of Elam, a thousand two hundred fifty-four.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>The children of Zethua, nine hundred forty-five.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>The children of Zachai, seven hundred sixty.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The children of Bani, six hundred forty-two.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The children of Bebai, six hundred twenty-three.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The children of Azgad, a thousand two hundred twenty-two.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>The children of Adonicam, six hundred sixty-six.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>The children of Beguai, two thousand fifty-six.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>The children of Adin, four hundred fifty-four.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>The children of Ather, who were of Ezechias, ninety-eight.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>The children of Besai, three hundred and twenty-three.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>The children of Jora, a hundred and twelve.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The children of Hasum, two hundred twenty-three.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>The children of Gebbar, ninety-five.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>The children of Bethlehem, a hundred twenty-three.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>The men of Netupha, fifty-six.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>The men of Anathoth, a hundred twenty-eight.</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>The children of Azmaveth, forty-two.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>The children of Cariathiarim, Cephira, and Beroth, seven hundred forty-three.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>The children of Rama and Gabaa, six hundred twenty-one.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>The men of Machmas, a hundred twenty-two.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>The men of Bethel and Hai, two hundred twenty-three.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>The children of Nebo, fifty-two.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>The children of Megbis, a hundred fifty-six.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>The children of the other Elam, a thousand two hundred fifty-four.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>The children of Harim, three hundred and twenty.</button><button type="button" data-verse="33" aria-pressed="false" class="verse"><sup>33</sup>The children of Lod, Hadid and Ono, seven hundred twenty-five.</button><button type="button" data-verse="34" aria-pressed="false" class="verse"><sup>34</sup>The children of Jericho, three hundred forty-five.</button><button type="button" data-verse="35" aria-pressed="false" class="verse"><sup>35</sup>The children of Senaa, three thousand six hundred thirty.</button><button type="button" data-verse="36" aria-pressed="false" class="verse"><sup>36</sup>The priests: the children of Jadaia of the house of Josue, nine hundred seventy-three.</button><button type="button" data-verse="37" aria-pressed="false" class="verse"><sup>37</sup>The children of Emmer, a thousand fifty-two.</button><button type="button" data-verse="38" aria-pressed="false" class="verse"><sup>38</sup>The children of Pheshur, a thousand two hundred forty-seven.</button><button type="button" data-verse="39" aria-pressed="false" class="verse"><sup>39</sup>The children of Harim, a thousand and seventeen.</button><button type="button" data-verse="40" aria-pressed="false" class="verse"><sup>40</sup>The Levites: the children of Josue and of Cedmihel, the children of Odovia, seventy-four.</button><button type="button" data-verse="41" aria-pressed="false" class="verse"><sup>41</sup>The singing men: the children of Asaph, a hundred twenty-eight.</button><button type="button" data-verse="42" aria-pressed="false" class="verse"><sup>42</sup>The children of the porters: the children of Sellum, the children of Ater, the children of Telmon, the children of Accub, the children of Hatita, the children of Sobai: in all a hundred thirty-nine.</button><button type="button" data-verse="43" aria-pressed="false" class="verse"><sup>43</sup>The Nathinites: the children of Siha, the children of Hasupha, the children of Tabbaoth,</button><button type="button" data-verse="44" aria-pressed="false" class="verse"><sup>44</sup>The children of Ceros, the children of Sia, the children of Phadon,</button><button type="button" data-verse="45" aria-pressed="false" class="verse"><sup>45</sup>The children of Lebana, the children of Hegaba, the children of Accub,</button><button type="button" data-verse="46" aria-pressed="false" class="verse"><sup>46</sup>The children of Hagab, the children of Semlai, the children of Hanan,</button><button type="button" data-verse="47" aria-pressed="false" class="verse"><sup>47</sup>The children of Gaddel, the children of Gaher, the children of Raaia,</button><button type="button" data-verse="48" aria-pressed="false" class="verse"><sup>48</sup>The children of Rasin, the children of Necoda, the children of Gazam,</button><button type="button" data-verse="49" aria-pressed="false" class="verse"><sup>49</sup>The children of Asa, the children of Phasea, the children of Besee,</button><button type="button" data-verse="50" aria-pressed="false" class="verse"><sup>50</sup>The children of Asena, the children of Munim, the children of Nephusim,</button><button type="button" data-verse="51" aria-pressed="false" class="verse"><sup>51</sup>The children of Bacbuc, the children of Hacupha, the children of Harhur,</button><button type="button" data-verse="52" aria-pressed="false" class="verse"><sup>52</sup>The children of Besluth, the children of Mahida, the children of Harsa,</button><button type="button" data-verse="53" aria-pressed="false" class="verse"><sup>53</sup>The children of Bercos, the children of Sisara, the children of Thema,</button><button type="button" data-verse="54" aria-pressed="false" class="verse"><sup>54</sup>The children of Nasia, the children of Hatipha,</button><button type="button" data-verse="55" aria-pressed="false" class="verse"><sup>55</sup>The children of the servants of Solomon, the children of Sotai, the children of Sopheret, the children of Pharuda,</button><button type="button" data-verse="56" aria-pressed="false" class="verse"><sup>56</sup>The children of Jala, the children of Dercon, the children of Geddel,</button><button type="button" data-verse="57" aria-pressed="false" class="verse"><sup>57</sup>The children of Saphatia, the children of Hatil, the children of Phochereth, which were of Asebaim, the children of Ami,</button><button type="button" data-verse="58" aria-pressed="false" class="verse"><sup>58</sup>All the Nathinites, and the children of the servants of Solomon, three hundred ninety-two.</button><button type="button" data-verse="59" aria-pressed="false" class="verse"><sup>59</sup>And these are they that came up from Thelmela, Thelharsa, Cherub, and Adon, and Emer. And they could not shew the house of their fathers and their seed, whether they were of Israel.</button><button type="button" data-verse="60" aria-pressed="false" class="verse"><sup>60</sup>The children of Dalaia, the children of Tobia, the children of Necoda, six hundred fifty-two.</button><button type="button" data-verse="61" aria-pressed="false" class="verse"><sup>61</sup>And of the children of the priests: the children of Hobia, the children of Accos, the children of Berzellai, who took a wife of the daughters of Berzellai, the Galaadite, and was called by their name:</button><button type="button" data-verse="62" aria-pressed="false" class="verse"><sup>62</sup>These sought the writing of their genealogy, and found it not, and they were cast out of the priesthood.</button><button type="button" data-verse="63" aria-pressed="false" class="verse"><sup>63</sup>And Athersatha said to them, that they should not eat of the holy of holies, till there arose a priest learned and perfect.</button><button type="button" data-verse="64" aria-pressed="false" class="verse"><sup>64</sup>All the multitudes as one man, were forty-two thousand three hundred and sixty:</button><button type="button" data-verse="65" aria-pressed="false" class="verse"><sup>65</sup>Besides their menservants, and womenservants, of whom there were seven thousand three hundred and thirty-seven: and among them singing men, and singing women two hundred.</button><button type="button" data-verse="66" aria-pressed="false" class="verse"><sup>66</sup>Their horses seven hundred thirty-six, their mules two hundred forty-five,</button><button type="button" data-verse="67" aria-pressed="false" class="verse"><sup>67</sup>Their camels four hundred thirty-five, their asses six thousand seven hundred and twenty.</button><button type="button" data-verse="68" aria-pressed="false" class="verse"><sup>68</sup>And some of the chief of the fathers, when they came to the temple of the Lord, which is in Jerusalem, offered freely to the house of the Lord to build it in its place.</button><button type="button" data-verse="69" aria-pressed="false" class="verse"><sup>69</sup>According to their ability, they gave towards the expenses of the work, sixty-one thousand solids of gold, five thousand pounds of silver, and a hundred garments for the priests.</button><button type="button" data-verse="70" aria-pressed="false" class="verse"><sup>70</sup>So the priests and the Levites, and some of the people, and the singing men, and the porters, and the Nathinites dwelt in their cities, and all Israel in their cities.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Hi sunt autem provinciæ filii, qui ascenderunt de captivitate, quam transtulerat Nabuchodonosor rex Babylonis in Babylonem, et reversi sunt in Jerusalem et Judam, unusquisque in civitatem suam.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Qui venerunt cum Zorobabel, Josue, Nehemia, Saraia, Rahelaia, Mardochai, Belsan, Mesphar, Beguai, Rehum, Baana. Numerus virorum populi Israël :</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>filii Pharos duo millia centum septuaginta duo.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Filii Sephatia, trecenti septuaginta duo.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Filii Area, septingenti septuaginta quinque.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Filii Phahath Moab, filiorum Josue : Joab, duo millia octingenti duodecim.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Filii Ælam, mille ducenti quinquaginta quatuor.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Filii Zethua, nongenti quadraginta quinque.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Filii Zachai, septingenti sexaginta.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Filii Bani, sexcenti quadraginta duo.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Filii Bebai, sexcenti v of Area, seven hundred seventy-five.\"},{\"verse\":6,\"text\":\"The children of Phahath Moab, of the children of Josue: Joab, Two thousand eight hundred twelve.\"},{\"verse\":7,\"text\":\"The children of Elam, a thousand two hundred fifty-four.\"},{\"verse\":8,\"text\":\"The children of Zethua, nine hundred forty-five.\"},{\"verse\":9,\"text\":\"The children of Zachai, seven hundred sixty.\"},{\"verse\":10,\"text\":\"The children of Bani, six hundred forty-two.\"},{\"verse\":11,\"text\":\"The children of Bebai, six hundred twenty-three.\"},{\"verse\":12,\"text\":\"The children of Azgad, a thousand two hundred twenty-two.\"},{\"verse\":13,\"text\":\"The children of Adonicam, six hundred sixty-six.\"},{\"verse\":14,\"text\":\"The children of Beguai, two thousand fifty-six.\"},{\"verse\":15,\"text\":\"The children of Adin, four hundred fifty-four.\"},{\"verse\":16,\"text\":\"The children of Ather, who were of Ezechias, ninety-eight.\"},{\"verse\":17,\"text\":\"The children of Besai, three hundred and twenty-three.\"},{\"verse\":18,\"text\":\"The children of Jora, a hundred and twelve.\"},{\"verse\":19,\"text\":\"The children of Hasum, two hundred twenty-three.\"},{\"verse\":20,\"text\":\"The children of Gebbar, ninety-five.\"},{\"verse\":21,\"text\":\"The children of Bethlehem, a hundred twenty-three.\"},{\"verse\":22,\"text\":\"The men of Netupha, fifty-six.\"},{\"verse\":23,\"text\":\"The men of Anathoth, a hundred twenty-eight.\"},{\"verse\":24,\"text\":\"The children of Azmaveth, forty-two.\"},{\"verse\":25,\"text\":\"The children of Cariathiarim, Cephira, and Beroth, seven hundred forty-three.\"},{\"verse\":26,\"text\":\"The children of Rama and Gabaa, six hundred twenty-one.\"},{\"verse\":27,\"text\":\"The men of Machmas, a hundred twenty-two.\"},{\"verse\":28,\"text\":\"The men of Bethel and Hai, two hundred twenty-three.\"},{\"verse\":29,\"text\":\"The children of Nebo, fifty-two.\"},{\"verse\":30,\"text\":\"The children of Megbis, a hundred fifty-six.\"},{\"verse\":31,\"text\":\"The children of the other Elam, a thousand two hundred fifty-four.\"},{\"verse\":32,\"text\":\"The children of Harim, three hundred and twenty.\"},{\"verse\":33,\"text\":\"The children of Lod, Hadid and Ono, seven hundred twenty-five.\"},{\"verse\":34,\"text\":\"The children of Jericho, three hundred forty-five.\"},{\"verse\":35,\"text\":\"The children of Senaa, three thousand six hundred thirty.\"},{\"verse\":36,\"text\":\"The priests: the children of Jadaia of the house of Josue, nine hundred seventy-three.\"},{\"verse\":37,\"text\":\"The children of Emmer, a thousand fifty-two.\"},{\"verse\":38,\"text\":\"The children of Pheshur, a thousand two hundred forty-seven.\"},{\"verse\":39,\"text\":\"The children of Harim, a thousand and seventeen.\"},{\"verse\":40,\"text\":\"The Levites: the children of Josue and of Cedmihel, the children of Odovia, seventy-four.\"},{\"verse\":41,\"text\":\"The singing men: the children of Asaph, a hundred twenty-eight.\"},{\"verse\":42,\"text\":\"The children of the porters: the children of Sellum, the children of Ater, the children of Telmon, the children of Accub, the children of Hatita, the children of Sobai: in all a hundred thirty-nine.\"},{\"verse\":43,\"text\":\"The Nathinites: the children of Siha, the children of Hasupha, the children of Tabbaoth,\"},{\"verse\":44,\"text\":\"The children of Ceros, the children of Sia, the children of Phadon,\"},{\"verse\":45,\"text\":\"The children of Lebana, the children of Hegaba, the children of Accub,\"},{\"verse\":46,\"text\":\"The children of Hagab, the children of Semlai, the children of Hanan,\"},{\"verse\":47,\"text\":\"The children of Gaddel, the children of Gaher, the children of Raaia,\"},{\"verse\":48,\"text\":\"The children of Rasin, the children of Necoda, the children of Gazam,\"},{\"verse\":49,\"text\":\"The children of Asa, the children of Phasea, the children of Besee,\"},{\"verse\":50,\"text\":\"The children of Asena, the children of Munim, the children of Nephusim,\"},{\"verse\":51,\"text\":\"The children of Bacbuc, the children of Hacupha, the children of Harhur,\"},{\"verse\":52,\"text\":\"The children of Besluth, the children of Mahida, the children of Harsa,\"},{\"verse\":53,\"text\":\"The children of Bercos, the children of Sisara, the children of Thema,\"},{\"verse\":54,\"text\":\"The children of Nasia, the children of Hatipha,\"},{\"verse\":55,\"text\":\"The children of the servants of Solomon, the children of Sotai, the children of Sopheret, the children of Pharuda,\"},{\"verse\":56,\"text\":\"The children of Jala, the children of Dercon, the children of Geddel,\"},{\"verse\":57,\"text\":\"The children of Saphatia, the children of Hatil, the children of Phochereth, which were of Asebaim, the children of Ami,\"},{\"verse\":58,\"text\":\"All the Nathinites, and the children of the servants of Solomon, three hundred ninety-two.\"},{\"verse\":59,\"text\":\"And these are they that came up from Thelmela, Thelharsa, Cherub, and Adon, and Emer. And they could not shew the house of their fathers and their seed, whether they were of Israel.\"},{\"verse\":60,\"text\":\"The children of Dalaia, the children of Tobia, the children of Necoda, six hundred fifty-two.\"},{\"verse\":61,\"text\":\"And of the children of the priests: the children of Hobia, the children of Accos, the children of Berzellai, who took a wife of the daughters of Berzellai, the Galaadite, and was called by their name:\"},{\"verse\":62,\"text\":\"These sought the writing of their genealogy, and found it not, and they were cast out of the priesthood.\"},{\"verse\":63,\"text\":\"And Athersatha said to them, that they should not eat of the holy of holies, till there arose a priest learned and perfect.\"},{\"verse\":64,\"text\":\"All the multitudes as one man, were forty-two thousand three hundred and sixty:\"},{\"verse\":65,\"text\":\"Besides their menservants, and womenservants, of whom there were seven thousand three hundred and thirty-seven: and among them singing men, and singing women two hundred.\"},{\"verse\":66,\"text\":\"Their horses seven hundred thirty-six, their mules two hundred forty-five,\"},{\"verse\":67,\"text\":\"Their camels four hundred thirty-five, their asses six thousand seven hundred and twenty.\"},{\"verse\":68,\"text\":\"And some of the chief of the fathers, when they came to the temple of the Lord, which is in Jerusalem, offered freely to the house of the Lord to build it in its place.\"},{\"verse\":69,\"text\":\"According to their ability, they gave towards the expenses of the work, sixty-one thousand solids of gold, five thousand pounds of silver, and a hundred garments for the priests.\"},{\"verse\":70,\"text\":\"So the priests and the Levites, and some of the people, and the singing men, and the porters, and the Nathinites dwelt in their cities, and all Israel in their cities.\"}],\"vul\":[{\"verse\":1,\"text\":\"Hi sunt autem provinciæ filii, qui ascenderunt de captivitate, quam transtulerat Nabuchodonosor rex Babylonis in Babylonem, et reversi sunt in Jerusalem et Judam, unusquisque in civitatem suam.\"},{\"verse\":2,\"text\":\"Qui venerunt cum Zorobabel, Josue, Nehemia, Saraia, Rahelaia, Mardochai, Belsan, Mesphar, Beguai, Rehum, Baana. Numerus virorum populi Israël :\"},{\"verse\":3,\"text\":\"filii Pharos duo millia centum septuaginta duo.\"},{\"verse\":4,\"text\":\"Filii Sephatia, trecenti septuaginta duo.\"},{\"verse\":5,\"text\":\"Filii Area, septingenti septuaginta quinque.\"},{\"verse\":6,\"text\":\"Filii Phahath Moab, filiorum Josue : Joab, duo millia octingenti duodecim.\"},{\"verse\":7,\"text\":\"Filii Ælam, mille ducenti quinquaginta quatuor.\"},{\"verse\":8,\"text\":\"Filii Zethua, nongenti quadraginta quinque.\"},{\"verse\":9,\"text\":\"Filii Zachai, septingenti sexaginta.\"},{\"verse\":10,\"text\":\"Filii Bani, sexcenti quadraginta duo.\"},{\"verse\":11,\"text\":\"Filii Bebai, sexcenti viginti tres.\"},{\"verse\":12,\"text\":\"Filii Azgad, mille ducenti viginti duo.\"},{\"verse\":13,\"text\":\"Filii Adonicam, sexcenti sexaginta sex.\"},{\"verse\":14,\"text\":\"Filii Beguai, duo millia quinquaginta sex.\"},{\"verse\":15,\"text\":\"Filii Adin, quadringenti quinquaginta quatuor.\"},{\"verse\":16,\"text\":\"Filii Ather, qui erant ex Ezechia, nonaginta octo.\"},{\"verse\":17,\"text\":\"Filii Besai, trecenti viginti tres.\"},{\"verse\":18,\"text\":\"Filii Jora, centum duodecim.\"},{\"verse\":19,\"text\":\"Filii Hasum, ducenti viginti tres.\"},{\"verse\":20,\"text\":\"Filii Gebbar, nonaginta quinque.\"},{\"verse\":21,\"text\":\"Filii Bethlehem, centum viginti tres.\"},{\"verse\":22,\"text\":\"Viri Netupha, quinquaginta sex.\"},{\"verse\":23,\"text\":\"Viri Anathoth, centum viginti octo.\"},{\"verse\":24,\"text\":\"Filii Azmaveth, quadraginta duo.\"},{\"verse\":25,\"text\":\"Filii Cariathiarim, Cephira et Beroth, septingenti quadraginta tres.\"},{\"verse\":26,\"text\":\"Filii Rama et Gabaa, sexcenti viginti unus.\"},{\"verse\":27,\"text\":\"Viri Machmas, centum viginti duo.\"},{\"verse\":28,\"text\":\"Viri Bethel et Hai, ducenti viginti tres.\"},{\"verse\":29,\"text\":\"Filii Nebo, quinquaginta duo.\"},{\"verse\":30,\"text\":\"Filii Megbis, centum quinquaginta sex.\"},{\"verse\":31,\"text\":\"Filii Ælam alterius, mille ducenti quinquaginta quatuor.\"},{\"verse\":32,\"text\":\"Filii Harim, trecenti viginti.\"},{\"verse\":33,\"text\":\"Filii Lod Hadid, et Ono, septingenti viginti quinque.\"},{\"verse\":34,\"text\":\"Filii Jericho, trecenti quadraginta quinque.\"},{\"verse\":35,\"text\":\"Filii Senaa, tria millia sexcenti triginta.\"},{\"verse\":36,\"text\":\"Sacerdotes : filii Jadaia in domo Josue, nongenti septuaginta tres.\"},{\"verse\":37,\"text\":\"Filii Emmer, mille quinquaginta duo.\"},{\"verse\":38,\"text\":\"Filii Pheshur, mille ducenti quadraginta septem.\"},{\"verse\":39,\"text\":\"Filii Harim, mille decem et septem.\"},{\"verse\":40,\"text\":\"Levitæ : filii Josue et Cedmihel filiorum Odoviæ, septuaginta quatuor.\"},{\"verse\":41,\"text\":\"Cantores : filii Asaph, centum viginti octo.\"},{\"verse\":42,\"text\":\"Filii janitorum : filii Sellum, filii Ater, filii Telmon, filii Accub, filii Hatitha, filii Sobai : universi centum triginta novem.\"},{\"verse\":43,\"text\":\"Nathinæi : filii Siha, filii Hasupha, filii Tabbaoth,\"},{\"verse\":44,\"text\":\"filii Ceros, filii Siaa, filii Phadon,\"},{\"verse\":45,\"text\":\"filii Lebana, filii Hagaba, filii Accub,\"},{\"verse\":46,\"text\":\"filii Hagab, filii Semlai, filii Hanan,\"},{\"verse\":47,\"text\":\"filii Gaddel, filii Gaher, filii Raaia,\"},{\"verse\":48,\"text\":\"filii Rasin, filii Necoda, filii Gazam,\"},{\"verse\":49,\"text\":\"filii Aza, filii Phasea, filii Besee,\"},{\"verse\":50,\"text\":\"filii Asena, filii Munim, filii Nephusim,\"},{\"verse\":51,\"text\":\"filii Bacbuc, filii Hacupha, filii Harhur,\"},{\"verse\":52,\"text\":\"filii Besluth, filii Mahida, filii Harsa,\"},{\"verse\":53,\"text\":\"filii Bercos, filii Sisara, filii Thema,\"},{\"verse\":54,\"text\":\"filii Nasia, filii Hatipha,\"},{\"verse\":55,\"text\":\"filii servorum Salomonis, filii Sotai, filii Sophereth, filii Pharuda,\"},{\"verse\":56,\"text\":\"filii Jala, filii Dercon, filii Geddel,\"},{\"verse\":57,\"text\":\"filii Saphatia, filii Hatil, filii Phochereth, qui erant de Asebaim, filii Ami :\"},{\"verse\":58,\"text\":\"omnes Nathinæi, et filii servorum Salomonis, trecenti nonaginta duo.\"},{\"verse\":59,\"text\":\"Et hi qui ascenderunt de Thelmala, Thelharsa, Cherub, et Adon, et Emer : et non potuerunt indicare domum patrum suorum et semen suum, utrum ex Israël essent.\"},{\"verse\":60,\"text\":\"Filii Dalaia, filii Tobia, filii Necoda, sexcenti quinquaginta duo.\"},{\"verse\":61,\"text\":\"Et de filiis sacerdotum : filii Hobia, filii Accos, filii Berzellai, qui accepit de filiabus Berzellai Galaaditis, uxorem, et vocatus est nomine eorum :\"},{\"verse\":62,\"text\":\"hi quæsierunt scripturam genealogiæ suæ, et non invenerunt, et ejecti sunt de sacerdotio.\"},{\"verse\":63,\"text\":\"Et dixit Athersatha eis ut non comederent de Sancto sanctorum, donec surgeret sacerdos doctus atque perfectus.\"},{\"verse\":64,\"text\":\"Omnis multitudo quasi unus, quadraginta duo millia trecenti sexaginta :\"},{\"verse\":65,\"text\":\"exceptis servis eorum, et ancillis, qui erant septem millia trecenti triginta septem : et in ipsis cantores atque cantatrices ducenti.\"},{\"verse\":66,\"text\":\"Equi eorum septingenti triginta sex, muli eorum, ducenti quadraginta quinque,\"},{\"verse\":67,\"text\":\"cameli eorum, quadringenti triginta quinque, asini eorum, sex millia septingenti viginti.\"},{\"verse\":68,\"text\":\"Et de principibus patrum, cum ingrederentur templum Domini, quod est in Jerusalem, sponte obtulerunt in domum Dei ad exstruendam eam in loco suo.\"},{\"verse\":69,\"text\":\"Secundum vires suas dederunt impensas operis, auri solidos sexaginta millia et mille, argenti mnas quinque millia, et vestes sacerdotales centum.\"},{\"verse\":70,\"text\":\"Habitaverunt ergo sacerdotes, et Levitæ, et de populo, et cantores, et janitores, et Nathinæi, in urbibus suis, universusque Israël in civitatibus suis.\"}],\"summary\":\"The number of them that returned to Judea: their oblations.\",\"intro\":null,\"prev\":{\"usfm\":\"EZR\",\"chapter\":1,\"label\":\"Ezra 1\"},\"next\":{\"usfm\":\"EZR\",\"chapter\":3,\"label\":\"Ezra 3\"}}]]\n"])</script></body></html>
