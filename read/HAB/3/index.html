thou art angry, thou wilt remember mercy.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>God will come from the south, and the holy one from mount Pharan: His glory covered the heavens, and the earth is full of his praise.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>His brightness shall be as the light: horns are in his hands: There is his strength hid:</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Death shall go before his face. And the devil shall go forth before his feet.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>He stood and measured the earth. He beheld, and melted the nations: and the ancient mountains were crushed to pieces. The hills of the world were bowed down by the journeys of his eternity.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>I saw the tents of Ethiopia for their iniquity, the curtains of the land of Madian shall be troubled.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Wast thou angry, O Lord, with the rivers? or was thy wrath upon the rivers? or thy indignation in the sea? Who will ride upon thy horses: and thy chariots are salvation.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Thou wilt surely take up thy bow: according to the oaths which thou hast spoken to the tribes. Thou wilt divide the rivers of the earth.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>The mountains saw thee, and were grieved: the great body of waters passed away. The deep put forth its voice: the deep lifted up its hands.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>The sun and the moon stood still in their habitation, in the light of thy arrows, they shall go in the brightness of thy glittering spear.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In thy anger thou wilt tread the earth under foot: in thy wrath thou wilt astonish the nations.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Thou wentest forth for the salvation of thy people: for salvation with thy Christ. Thou struckest the head of the house of the wicked: thou hast laid bare his foundation even to the neck.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Thou hast cursed his sceptres, the head of his warriors, them that came out as a whirlwind to scatter me. Their joy was like that of him that devoureth the poor man in secret.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Thou madest a way in the sea for thy horses, in the mud of many waters.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>I have heard and my bowels were troubled: my lips trembled at the voice. Let rottenness enter into my bones, and swarm under me. That I may rest in the day of tribulation: that I may go up to our people that are girded.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>For the fig tree shall not blossom: and there shall be no spring in the vines. The labour of the olive tree shall fail: and the fields shall yield no food: the flock shall be cut off from the fold, and there shall be no herd in the stalls.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>But I will rejoice in the Lord: and I will joy in God my Jesus.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>The Lord God is my strength: and he will make my feet like the feet of harts: and he the conqueror will lead me upon my high places singing psalms.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Oratio Habacuc prophetæ, pro ignorantiis.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Domine, audivi auditionem tuam, et timui. Domine, opus tuum, in medio annorum vivifica illud ; in medio annorum notum facies : cum iratus fueris, misericordiæ recordaberis.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Deus ab austro veniet, et Sanctus de monte Pharan : operuit cælos gloria ejus, et laudis ejus plena est terra.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Splendor ejus ut lux erit, cornua in manibus ejus : ibi abscondita est fortitudo ejus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Ante faciem ejus ibit mors, et egredietur diabolus ante pedes ejus.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Stetit, et mensus est terram ; aspexit, et dissolvit gentes, et contriti sunt montes sæculi : incurvati sunt colles mundi ab itineribus æternitatis ejus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Pro iniquitate vidi tentoria Æthiopiæ ; turbabuntur pelles terræ Madian.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Numquid in fluminibus iratus es, Domine ? aut in fluminibus furor tuus ? vel in mari indignatio tua ? Qui ascendes super equos tuos, et quadrigæ tuæ salvatio.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Suscitans suscitabis arcum tuum, juramenta tribubus quæ locutus es ; fluvios scindes terræ.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Viderunt te, et doluerunt montes ; gurges aquarum transiit : dedit abyssus vocem suam ; altitudo manus suas levavit.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Sol et luna steterunt in habitaculo suo : in luce sagittarum tuarum ibunt, in splendore fulgurantis hastæ tuæ.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>In fremitu conculcabis terram ; in furore obstupefacies gentes.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Egressus es in salutem populi tui, in salutem cum christo tuo : percussisti caput de domo impii, denudasti fundamentum ejus usque ad collum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Maledixisti sceptris ejus, capiti bellatorum ejus, venientibus ut turbo ad dispergendum me : exsultatio eorum, sicut ejus qui devorat pauperem in abscondito.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Viam fecisti in mari equis tuis, in luto aquarum multarum.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>Audivi, et conturbatus est venter meus ; a voce contremuerunt labia mea. Ingrediatur putredo in ossibus meis, et subter me scateat : ut requiescam in die tribulationis, ut ascendam ad populum accinctum nostrum.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Ficus enim non florebit, et non erit germen in vineis ; mentietur opus olivæ, et arva non afferent cibum : abscindetur de ovili pecus, et non erit armentum in præsepibus.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Ego autem in Domino gaudebo ; et exsultabo in Deo Jesu meo.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Deus Dominus fortitudo mea, et ponet pedes meos quasi cervorum : et super excelsa mea deducet me victor in psalmis canentem.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HAB/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Habakkuk 2</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/ZEP/1/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Zephaniah 1</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->3<!-- --> of <!-- -->3<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl items-center gap-2 px-3"><a aria-label="Previous: Habakkuk 2" class="inline-flex h-12 w-14 shrink-0 items-center justify-center rounded-xl border border-stone-300/80 bg-card text-stone-800 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/HAB/2/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-lin 40,\"usfm\":\"HAB\",\"bookName\":\"Habakkuk\",\"drName\":\"Habacuc\",\"chapter\":3,\"totalChapters\":3,\"dra\":[{\"verse\":1,\"text\":\"A PRAYER OF HABACUC THE PROPHET FOR IGNORANCES.\"},{\"verse\":2,\"text\":\"O Lord, I have heard thy hearing, and was afraid. O Lord, thy work, in the midst of the years bring it to life: In the midst of the years thou shalt make it known: when thou art angry, thou wilt remember mercy.\"},{\"verse\":3,\"text\":\"God will come from the south, and the holy one from mount Pharan: His glory covered the heavens, and the earth is full of his praise.\"},{\"verse\":4,\"text\":\"His brightness shall be as the light: horns are in his hands: There is his strength hid:\"},{\"verse\":5,\"text\":\"Death shall go before his face. And the devil shall go forth before his feet.\"},{\"verse\":6,\"text\":\"He stood and measured the earth. He beheld, and melted the nations: and the ancient mountains were crushed to pieces. The hills of the world were bowed down by the journeys of his eternity.\"},{\"verse\":7,\"text\":\"I saw the tents of Ethiopia for their iniquity, the curtains of the land of Madian shall be troubled.\"},{\"verse\":8,\"text\":\"Wast thou angry, O Lord, with the rivers? or was thy wrath upon the rivers? or thy indignation in the sea? Who will ride upon thy horses: and thy chariots are salvation.\"},{\"verse\":9,\"text\":\"Thou wilt surely take up thy bow: according to the oaths which thou hast spoken to the tribes. Thou wilt divide the rivers of the earth.\"},{\"verse\":10,\"text\":\"The mountains saw thee, and were grieved: the great body of waters passed away. The deep put forth its voice: the deep lifted up its hands.\"},{\"verse\":11,\"text\":\"The sun and the moon stood still in their habitation, in the light of thy arrows, they shall go in the brightness of thy glittering spear.\"},{\"verse\":12,\"text\":\"In thy anger thou wilt tread the earth under foot: in thy wrath thou wilt astonish the nations.\"},{\"verse\":13,\"text\":\"Thou wentest forth for the salvation of thy people: for salvation with thy Christ. Thou struckest the head of the house of the wicked: thou hast laid bare his foundation even to the neck.\"},{\"verse\":14,\"text\":\"Thou hast cursed his sceptres, the head of his warriors, them that came out as a whirlwind to scatter me. Their joy was like that of him that devoureth the poor man in secret.\"},{\"verse\":15,\"text\":\"Thou madest a way in the sea for thy horses, in the mud of many waters.\"},{\"verse\":16,\"text\":\"I have heard and my bowels were troubled: my lips trembled at the voice. Let rottenness enter into my bones, and swarm under me. That I may rest in the day of tribulation: that I may go up to our people that are girded.\"},{\"verse\":17,\"text\":\"For the fig tree shall not blossom: and there shall be no spring in the vines. The labour of the olive tree shall fail: and the fields shall yield no food: the flock shall be cut off from the fold, and there shall be no herd in the stalls.\"},{\"verse\":18,\"text\":\"But I will rejoice in the Lord: and I will joy in God my Jesus.\"},{\"verse\":19,\"text\":\"The Lord God is my strength: and he will make my feet like the feet of harts: and he the conqueror will lead me upon my high places singing psalms.\"}],\"vul\":[{\"verse\":1,\"text\":\"Oratio Habacuc prophetæ, pro ignorantiis.\"},{\"verse\":2,\"text\":\"Domine, audivi auditionem tuam, et timui. Domine, opus tuum, in medio annorum vivifica illud ; in medio annorum notum facies : cum iratus fueris, misericordiæ recordaberis.\"},{\"verse\":3,\"text\":\"Deus ab austro veniet, et Sanctus de monte Pharan : operuit cælos gloria ejus, et laudis ejus plena est terra.\"},{\"verse\":4,\"text\":\"Splendor ejus ut lux erit, cornua in manibus ejus : ibi abscondita est fortitudo ejus.\"},{\"verse\":5,\"text\":\"Ante faciem ejus ibit mors, et egredietur diabolus ante pedes ejus.\"},{\"verse\":6,\"text\":\"Stetit, et mensus est terram ; aspexit, et dissolvit gentes, et contriti sunt montes sæculi : incurvati sunt colles mundi ab itineribus æternitatis ejus.\"},{\"verse\":7,\"text\":\"Pro iniquitate vidi tentoria Æthiopiæ ; turbabuntur pelles terræ Madian.\"},{\"verse\":8,\"text\":\"Numquid in fluminibus iratus es, Domine ? aut in fluminibus furor tuus ? vel in mari indignatio tua ? Qui ascendes super equos tuos, et quadrigæ tuæ salvatio.\"},{\"verse\":9,\"text\":\"Suscitans suscitabis arcum tuum, juramenta tribubus quæ locutus es ; fluvios scindes terræ.\"},{\"verse\":10,\"text\":\"Viderunt te, et doluerunt montes ; gurges aquarum transiit : dedit abyssus vocem suam ; altitudo manus suas levavit.\"},{\"verse\":11,\"text\":\"Sol et luna steterunt in habitaculo suo : in luce sagittarum tuarum ibunt, in splendore fulgurantis hastæ tuæ.\"},{\"verse\":12,\"text\":\"In fremitu conculcabis terram ; in furore obstupefacies gentes.\"},{\"verse\":13,\"text\":\"Egressus es in salutem populi tui, in salutem cum christo tuo : percussisti caput de domo impii, denudasti fundamentum ejus usque ad collum.\"},{\"verse\":14,\"text\":\"Maledixisti sceptris ejus, capiti bellatorum ejus, venientibus ut turbo ad dispergendum me : exsultatio eorum, sicut ejus qui devorat pauperem in abscondito.\"},{\"verse\":15,\"text\":\"Viam fecisti in mari equis tuis, in luto aquarum multarum.\"},{\"verse\":16,\"text\":\"Audivi, et conturbatus est venter meus ; a voce contremuerunt labia mea. Ingrediatur putredo in ossibus meis, et subter me scateat : ut requiescam in die tribulationis, ut ascendam ad populum accinctum nostrum.\"},{\"verse\":17,\"text\":\"Ficus enim non florebit, et non erit germen in vineis ; mentietur opus olivæ, et arva non afferent cibum : abscindetur de ovili pecus, et non erit armentum in præsepibus.\"},{\"verse\":18,\"text\":\"Ego autem in Domino gaudebo ; et exsultabo in Deo Jesu meo.\"},{\"verse\":19,\"text\":\"Deus Dominus fortitudo mea, et ponet pedes meos quasi cervorum : et super excelsa mea deducet me victor in psalmis canentem.\"}],\"summary\":null,\"intro\":null,\"prev\":{\"usfm\":\"HAB\",\"chapter\":2,\"label\":\"Habakkuk 2\"},\"next\":{\"usfm\":\"ZEP\",\"chapter\":1,\"label\":\"Zephaniah 1\"}}]]\n"])</script></body></html>
