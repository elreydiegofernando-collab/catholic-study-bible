5rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>And you, when you were dead in your offences and sins,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Wherein in time past you walked according to the course of this world, according to the prince of the power of this air, of the spirit that now worketh on the children of unbelief:</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>In which also we all conversed in time past, in the desires of our flesh, fulfilling the will of the flesh and of our thoughts, and were by nature children of wrath, even as the rest:</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>But God (who is rich in mercy) for his exceeding charity wherewith he loved us</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Even when we were dead in sins, hath quickened us together in Christ (by whose grace you are saved)</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And hath raised us up together and hath made us sit together in the heavenly places, through Christ Jesus.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>That he might shew in the ages to come the abundant riches of his grace, in his bounty towards us in Christ Jesus.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>For by grace you are saved through faith: and that not of yourselves, for it is the gift of God.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Not of works, that no man may glory.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>For we are his workmanship, created in Christ Jesus in good works, which God hath prepared that we should walk in them.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>For which cause be mindful that you, being heretofore gentiles in the flesh, who are called uncircumcision by that which is called circumcision in the flesh, made by hands:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>That you were at that time without Christ, being aliens from the conversation of Israel and strangers to the testament, having no hope of the promise and without God in this world.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>But now in Christ Jesus, you, who some time were afar off, are made nigh by the blood of Christ.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>For he is our peace, who hath made both one, and breaking down the middle wall of partition, the enmities in his flesh:</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Making void the law of commandments contained in decrees: that he might make the two in himself into one new man, making peace.</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And might reconcile both to God in one body by the cross, killing the enmities in himself.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>And coming, he preached peace to you that were afar off: and peace to them that were nigh.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>For by him we have access both in one Spirit to the Father.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Now therefore you are no more strangers and foreigners: but you are fellow citizens with the saints and the domestics of God,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Built upon the foundation of the apostles and prophets, Jesus Christ himself being the chief corner stone:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>In whom all the building, being framed together, groweth up into an holy temple in the Lord.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>In whom you also are built together into an habitation of God in the Spirit.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Et vos, cum essetis mortui delictis et peccatis vestris,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>in quibus aliquando ambulastis secundum sæculum mundi hujus, secundum principem potestatis aëris hujus, spiritus, qui nunc operatur in filios diffidentiæ,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>in quibus et nos omnes aliquando conversati sumus in desideriis carnis nostræ, facientes voluntatem carnis et cogitationum, et eramus natura filii iræ, sicut et ceteri :</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Deus autem, qui dives est in misericordia, propter nimiam caritatem suam, qua dilexit nos,</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>et cum essemus mortui peccatis, convivificavit nos in Christo (cujus gratia estis salvati),</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>et conresuscitavit, et consedere fecit in cælestibus in Christo Jesu :</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>ut ostenderet in sæculis supervenientibus abundantes divitias gratiæ suæ, in bonitate super nos in Christo Jesu.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Gratia enim estis salvati per fidem, et hoc non ex vobis : Dei enim donum est :</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>non ex operibus, ut ne quis glorietur.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Ipsius enim sumus factura, creati in Christo Jesu in operibus bonis, quæ præparavit Deus ut in illis ambulemus.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Propter quod memores estote quod aliquando vos gentes in carne, qui dicimini præputium ab ea quæ dicitur circumcisio in carne, manu facta :</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>quia eratis illo in tempore sine Christo, alienati a conversatione Israël, et hospites testamentorum, promissionis spem non habentes, et sine Deo in hoc mundo.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Nunc autem in Christo Jesu, vos, qui aliquando eratis longe, facti estis prope in sanguine Christi.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Ipse enim est pax nostra, qui fecit utraque unum, et medium parietem maceriæ solvens, inimicitias in carne sua,</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>legem mandatorum decretis evacuans, ut duos condat in semetipso in unum novum hominem, faciens pacem :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et reconciliet ambos in uno corpore, Deo per crucem, interficiens inimicitias in semetipso.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Et veniens evangelizavit pacem vobis, qui longe fuistis, et pacem iis, qui prope.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quoniam per ipsum habemus accessum ambo in uno Spiritu ad Patrem.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Ergo jam non estis hospites, et advenæ : sed estis cives sanctorum, et domestici Dei,</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>superædificati super fundamentum apostolorum, et prophetarum, ipso summo angulari lapide Christo Jesu :</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>in quo omnis ædificatio constructa crescit in templum sanctum in Domino,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>in quo et vos coædificamini in habitaculum Dei in Spiritu.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EPH/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ephesians 1</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EPH/3/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ephesians 3</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6  to come the abundant riches of his grace, in his bounty towards us in Christ Jesus.\"},{\"verse\":8,\"text\":\"For by grace you are saved through faith: and that not of yourselves, for it is the gift of God.\"},{\"verse\":9,\"text\":\"Not of works, that no man may glory.\"},{\"verse\":10,\"text\":\"For we are his workmanship, created in Christ Jesus in good works, which God hath prepared that we should walk in them.\"},{\"verse\":11,\"text\":\"For which cause be mindful that you, being heretofore gentiles in the flesh, who are called uncircumcision by that which is called circumcision in the flesh, made by hands:\"},{\"verse\":12,\"text\":\"That you were at that time without Christ, being aliens from the conversation of Israel and strangers to the testament, having no hope of the promise and without God in this world.\"},{\"verse\":13,\"text\":\"But now in Christ Jesus, you, who some time were afar off, are made nigh by the blood of Christ.\"},{\"verse\":14,\"text\":\"For he is our peace, who hath made both one, and breaking down the middle wall of partition, the enmities in his flesh:\"},{\"verse\":15,\"text\":\"Making void the law of commandments contained in decrees: that he might make the two in himself into one new man, making peace.\"},{\"verse\":16,\"text\":\"And might reconcile both to God in one body by the cross, killing the enmities in himself.\"},{\"verse\":17,\"text\":\"And coming, he preached peace to you that were afar off: and peace to them that were nigh.\"},{\"verse\":18,\"text\":\"For by him we have access both in one Spirit to the Father.\"},{\"verse\":19,\"text\":\"Now therefore you are no more strangers and foreigners: but you are fellow citizens with the saints and the domestics of God,\"},{\"verse\":20,\"text\":\"Built upon the foundation of the apostles and prophets, Jesus Christ himself being the chief corner stone:\"},{\"verse\":21,\"text\":\"In whom all the building, being framed together, groweth up into an holy temple in the Lord.\"},{\"verse\":22,\"text\":\"In whom you also are built together into an habitation of God in the Spirit.\"}],\"vul\":[{\"verse\":1,\"text\":\"Et vos, cum essetis mortui delictis et peccatis vestris,\"},{\"verse\":2,\"text\":\"in quibus aliquando ambulastis secundum sæculum mundi hujus, secundum principem potestatis aëris hujus, spiritus, qui nunc operatur in filios diffidentiæ,\"},{\"verse\":3,\"text\":\"in quibus et nos omnes aliquando conversati sumus in desideriis carnis nostræ, facientes voluntatem carnis et cogitationum, et eramus natura filii iræ, sicut et ceteri :\"},{\"verse\":4,\"text\":\"Deus autem, qui dives est in misericordia, propter nimiam caritatem suam, qua dilexit nos,\"},{\"verse\":5,\"text\":\"et cum essemus mortui peccatis, convivificavit nos in Christo (cujus gratia estis salvati),\"},{\"verse\":6,\"text\":\"et conresuscitavit, et consedere fecit in cælestibus in Christo Jesu :\"},{\"verse\":7,\"text\":\"ut ostenderet in sæculis supervenientibus abundantes divitias gratiæ suæ, in bonitate super nos in Christo Jesu.\"},{\"verse\":8,\"text\":\"Gratia enim estis salvati per fidem, et hoc non ex vobis : Dei enim donum est :\"},{\"verse\":9,\"text\":\"non ex operibus, ut ne quis glorietur.\"},{\"verse\":10,\"text\":\"Ipsius enim sumus factura, creati in Christo Jesu in operibus bonis, quæ præparavit Deus ut in illis ambulemus.\"},{\"verse\":11,\"text\":\"Propter quod memores estote quod aliquando vos gentes in carne, qui dicimini præputium ab ea quæ dicitur circumcisio in carne, manu facta :\"},{\"verse\":12,\"text\":\"quia eratis illo in tempore sine Christo, alienati a conversatione Israël, et hospites testamentorum, promissionis spem non habentes, et sine Deo in hoc mundo.\"},{\"verse\":13,\"text\":\"Nunc autem in Christo Jesu, vos, qui aliquando eratis longe, facti estis prope in sanguine Christi.\"},{\"verse\":14,\"text\":\"Ipse enim est pax nostra, qui fecit utraque unum, et medium parietem maceriæ solvens, inimicitias in carne sua,\"},{\"verse\":15,\"text\":\"legem mandatorum decretis evacuans, ut duos condat in semetipso in unum novum hominem, faciens pacem :\"},{\"verse\":16,\"text\":\"et reconciliet ambos in uno corpore, Deo per crucem, interficiens inimicitias in semetipso.\"},{\"verse\":17,\"text\":\"Et veniens evangelizavit pacem vobis, qui longe fuistis, et pacem iis, qui prope.\"},{\"verse\":18,\"text\":\"Quoniam per ipsum habemus accessum ambo in uno Spiritu ad Patrem.\"},{\"verse\":19,\"text\":\"Ergo jam non estis hospites, et advenæ : sed estis cives sanctorum, et domestici Dei,\"},{\"verse\":20,\"text\":\"superædificati super fundamentum apostolorum, et prophetarum, ipso summo angulari lapide Christo Jesu :\"},{\"verse\":21,\"text\":\"in quo omnis ædificatio constructa crescit in templum sanctum in Domino,\"},{\"verse\":22,\"text\":\"in quo et vos coædificamini in habitaculum Dei in Spiritu.\"}],\"summary\":\"All our good comes through Christ. He is our peace.\",\"intro\":null,\"prev\":{\"usfm\":\"EPH\",\"chapter\":1,\"label\":\"Ephesians 1\"},\"next\":{\"usfm\":\"EPH\",\"chapter\":3,\"label\":\"Ephesians 3\"}}]]\n"])</script></body></html>
