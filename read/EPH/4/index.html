f text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>I therefore, a prisoner in the Lord, beseech you that you walk worthy of the vocation in which you are called:</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>With all humility and mildness, with patience, supporting one another in charity.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Careful to keep the unity of the Spirit in the bond of peace.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>One body and one Spirit: as you are called in one hope of your calling.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>One Lord, one faith, one baptism.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>One God and Father of all, who is above all, and through all, and in us all.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>But to every one of us is given grace, according to the measure of the giving of Christ.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Wherefore he saith: Ascending on high, he led captivity captive: he gave gifts to men.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Now that he ascended, what is it, but because he also descended first into the lower parts of the earth?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>He that descended is the same also that ascended above all the heavens: that he might fill all things.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he gave some apostles, and some prophets, and other some evangelists, and other some pastors and doctors:</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>For the perfecting of the saints, for the work of the ministry, for the edifying of the body of Christ:</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Until we all meet into the unity of faith and of the knowledge of the Son of God, unto a perfect man, unto the measure of the age of the fulness of Christ:</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>That henceforth we be no more children tossed to and fro and carried about with every wind of doctrine, by the wickedness of men, by cunning craftiness by which they lie in wait to deceive.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>But doing the truth in charity, we may in all things grow up in him who is the head, even Christ:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>From whom the whole body, being compacted and fitly joined together, by what every joint supplieth, according to the operation in the measure of every part, maketh increase of the body, unto the edifying of itself in charity.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>This then I say and testify in the Lord: That henceforward you walk not as also the Gentiles walk in the vanity of their mind:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Having their understanding darkened: being alienated from the life of God through the ignorance that is in them, because of the blindness of their hearts.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Who despairing have given themselves up to lasciviousness, unto the working of all uncleanness, unto covetousness.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>But you have not so learned Christ:</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>If so be that you have heard him and have been taught in him, as the truth is in Jesus:</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>To put off, according to former conversation, the old man, who is corrupted according to the desire of error.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>And be renewed in the spirit of your mind:</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>And put on the new man, who according to God is created in justice and holiness of truth.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Wherefore, putting away lying, speak ye the truth, every man with his neighbour. For we are members one of another.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Be angry: and sin not. Let not the sun go down upon your anger.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Give not place to the devil.</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>He that stole, let him now steal no more: but rather let him labour, working with his hands the thing which is good, that he may have something to give to him that suffereth need.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Let no evil speech proceed from your mouth: but that which is good, to the edification of faith: that it may administer grace to the hearers.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>And grieve not the holy Spirit of God: whereby you are sealed unto the day of redemption.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Let all bitterness and anger and indignation and clamour and blasphemy be put away from you, with all malice.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>And be ye kind one to another: merciful, forgiving one another, even as God hath forgiven you in Christ.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Obsecro itaque vos ego vinctus in Domino, ut digne ambuletis vocatione, qua vocati estis,</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>cum omni humilitate, et mansuetudine, cum patientia, supportantes invicem in caritate,</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>solliciti servare unitatem Spiritus in vinculo pacis.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Unum corpus, et unus Spiritus, sicut vocati estis in una spe vocationis vestræ.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Unus Dominus, una fides, unum baptisma.</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Unus Deus et Pater omnium, qui est super omnes, et per omnia, et in omnibus nobis.</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>Unicuique autem nostrum data est gratia secundum mensuram donationis Christi.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Propter quod dicit : Ascendens in altum, captivam duxit captivitatem : dedit dona hominibus.</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>Quod autem ascendit, quid est, nisi quia et descendit primum in inferiores partes terræ ?</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Qui descendit, ipse est et qui ascendit super omnes cælos, ut impleret omnia.</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Et ipse dedit quosdam quidem apostolos, quosdam autem prophetas, alios vero evangelistas, alios autem pastores et doctores,</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>ad consummationem sanctorum in opus ministerii, in ædificationem corporis Christi :</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>donec occurramus omnes in unitatem fidei, et agnitionis Filii Dei, in virum perfectum, in mensuram ætatis plenitudinis Christi :</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>ut jam non simus parvuli fluctuantes, et circumferamur omni vento doctrinæ in nequitia hominum, in astutia ad circumventionem erroris.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Veritatem autem facientes in caritate, crescamus in illo per omnia, qui est caput Christus :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>ex quo totum corpus compactum et connexum per omnem juncturam subministrationis, secundum operationem in mensuram uniuscujusque membri, augmentum corporis facit in ædificationem sui in caritate.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Hoc igitur dico, et testificor in Domino, ut jam non ambuletis, sicut et gentes ambulant in vanitate sensus sui,</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>tenebris obscuratum habentes intellectum, alienati a vita Dei per ignorantiam, quæ est in illis, propter cæcitatem cordis ipsorum,</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>qui desperantes, semetipsos tradiderunt impudicitiæ, in operationem immunditiæ omnis in avaritiam.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Vos autem non ita didicistis Christum,</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>si tamen illum audistis, et in ipso edocti estis, sicut est veritas in Jesu,</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>deponere vos secundum pristinam conversationem veterem hominem, qui corrumpitur secundum desideria erroris.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Renovamini autem spiritu mentis vestræ,</button><button type="button" data-verse="24" aria-pressed="false" class="verse"><sup>24</sup>et induite novum hominem, qui secundum Deum creatus est in justitia, et sanctitate veritatis.</button><button type="button" data-verse="25" aria-pressed="false" class="verse"><sup>25</sup>Propter quod deponentes mendacium, loquimini veritatem unusquisque cum proximo suo : quoniam sumus invicem membra.</button><button type="button" data-verse="26" aria-pressed="false" class="verse"><sup>26</sup>Irascimini, et nolite peccare : sol non occidat super iracundiam vestram.</button><button type="button" data-verse="27" aria-pressed="false" class="verse"><sup>27</sup>Nolite locum dare diabolo :</button><button type="button" data-verse="28" aria-pressed="false" class="verse"><sup>28</sup>qui furabatur, jam non furetur : magis autem laboret, operando manibus suis, quod bonum est, ut habeat unde tribuat necessitatem patienti.</button><button type="button" data-verse="29" aria-pressed="false" class="verse"><sup>29</sup>Omnis sermo malus ex ore vestro non procedat : sed si quis bonus ad ædificationem fidei ut det gratiam audientibus.</button><button type="button" data-verse="30" aria-pressed="false" class="verse"><sup>30</sup>Et nolite contristare Spiritum Sanctum Dei : in quo signati estis in diem redemptionis.</button><button type="button" data-verse="31" aria-pressed="false" class="verse"><sup>31</sup>Omnis amaritudo, et ira, et indignatio, et clamor, et blasphemia tollatur a vobis cum omni malitia.</button><button type="button" data-verse="32" aria-pressed="false" class="verse"><sup>32</sup>Estote autem invicem benigni, misericordes, donantes invicem sicut et Deus in Christo donavit vobis.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EPH/3/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Previous</span><span class="block truncate font-serif text-lg">Ephesians 3</span></span></a><a class="flex min-h-14 items-center justify-end gap-2 rounded-xl border border-stone-300 bg-card px-3 text-right hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/EPH/5/"><span class="min-w-0"><span class="block text-xs uppercase tracking-wide text-stone-500">Next</span><span class="block truncate font-serif text-lg">Ephesians 5</span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a></nav><p class="mt-3 text-center text-xs text-stone-500">Chapter <!-- -->4<!-- --> of <!-- -->6<!-- --> · swipe left or right to turn the page</p></article></div><nav aria-label="Chapters" class="fixed inset-x-0 bottom-0 z-30 border-t border-stone-300/70 bg-paper/95 pb-[env(safe-area-inset-bottom)] backdrop-blur"><div class="mx-auto flex h-16 max-w-3xl item _5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"EPH.4\",{\"bookId\":56,\"usfm\":\"EPH\",\"bookName\":\"Ephesians\",\"drName\":\"Ephesians\",\"chapter\":4,\"totalChapters\":6,\"dra\":[{\"verse\":1,\"text\":\"I therefore, a prisoner in the Lord, beseech you that you walk worthy of the vocation in which you are called:\"},{\"verse\":2,\"text\":\"With all humility and mildness, with patience, supporting one another in charity.\"},{\"verse\":3,\"text\":\"Careful to keep the unity of the Spirit in the bond of peace.\"},{\"verse\":4,\"text\":\"One body and one Spirit: as you are called in one hope of your calling.\"},{\"verse\":5,\"text\":\"One Lord, one faith, one baptism.\"},{\"verse\":6,\"text\":\"One God and Father of all, who is above all, and through all, and in us all.\"},{\"verse\":7,\"text\":\"But to every one of us is given grace, according to the measure of the giving of Christ.\"},{\"verse\":8,\"text\":\"Wherefore he saith: Ascending on high, he led captivity captive: he gave gifts to men.\"},{\"verse\":9,\"text\":\"Now that he ascended, what is it, but because he also descended first into the lower parts of the earth?\"},{\"verse\":10,\"text\":\"He that descended is the same also that ascended above all the heavens: that he might fill all things.\"},{\"verse\":11,\"text\":\"And he gave some apostles, and some prophets, and other some evangelists, and other some pastors and doctors:\"},{\"verse\":12,\"text\":\"For the perfecting of the saints, for the work of the ministry, for the edifying of the body of Christ:\"},{\"verse\":13,\"text\":\"Until we all meet into the unity of faith and of the knowledge of the Son of God, unto a perfect man, unto the measure of the age of the fulness of Christ:\"},{\"verse\":14,\"text\":\"That henceforth we be no more children tossed to and fro and carried about with every wind of doctrine, by the wickedness of men, by cunning craftiness by which they lie in wait to deceive.\"},{\"verse\":15,\"text\":\"But doing the truth in charity, we may in all things grow up in him who is the head, even Christ:\"},{\"verse\":16,\"text\":\"From whom the whole body, being compacted and fitly joined together, by what every joint supplieth, according to the operation in the measure of every part, maketh increase of the body, unto the edifying of itself in charity.\"},{\"verse\":17,\"text\":\"This then I say and testify in the Lord: That henceforward you walk not as also the Gentiles walk in the vanity of their mind:\"},{\"verse\":18,\"text\":\"Having their understanding darkened: being alienated from the life of God through the ignorance that is in them, because of the blindness of their hearts.\"},{\"verse\":19,\"text\":\"Who despairing have given themselves up to lasciviousness, unto the working of all uncleanness, unto covetousness.\"},{\"verse\":20,\"text\":\"But you have not so learned Christ:\"},{\"verse\":21,\"text\":\"If so be that you have heard him and have been taught in him, as the truth is in Jesus:\"},{\"verse\":22,\"text\":\"To put off, according to former conversation, the old man, who is corrupted according to the desire of error.\"},{\"verse\":23,\"text\":\"And be renewed in the spirit of your mind:\"},{\"verse\":24,\"text\":\"And put on the new man, who according to God is created in justice and holiness of truth.\"},{\"verse\":25,\"text\":\"Wherefore, putting away lying, speak ye the truth, every man with his neighbour. For we are members one of another.\"},{\"verse\":26,\"text\":\"Be angry: and sin not. Let not the sun go down upon your anger.\"},{\"verse\":27,\"text\":\"Give not place to the devil.\"},{\"verse\":28,\"text\":\"He that stole, let him now steal no more: but rather let him labour, working with his hands the thing which is good, that he may have something to give to him that suffereth need.\"},{\"verse\":29,\"text\":\"Let no evil speech proceed from your mouth: but that which is good, to the edification of faith: that it may administer grace to the hearers.\"},{\"verse\":30,\"text\":\"And grieve not the holy Spirit of God: whereby you are sealed unto the day of redemption.\"},{\"verse\":31,\"text\":\"Let all bitterness and anger and indignation and clamour and blasphemy be put away from you, with all malice.\"},{\"verse\":32,\"text\":\"And be ye kind one to another: merciful, forgiving one another, even as God hath forgiven you in Christ.\"}],\"vul\":[{\"verse\":1,\"text\":\"Obsecro itaque vos ego vinctus in Domino, ut digne ambuletis vocatione, qua vocati estis,\"},{\"verse\":2,\"text\":\"cum omni humilitate, et mansuetudine, cum patientia, supportantes invicem in caritate,\"},{\"verse\":3,\"text\":\"solliciti servare unitatem Spiritus in vinculo pacis.\"},{\"verse\":4,\"text\":\"Unum corpus, et unus Spiritus, sicut vocati estis in una spe vocationis vestræ.\"},{\"verse\":5,\"text\":\"Unus Dominus, una fides, unum baptisma.\"},{\"verse\":6,\"text\":\"Unus Deus et Pater omnium, qui est super omnes, et per omnia, et in omnibus nobis.\"},{\"verse\":7,\"text\":\"Unicuique autem nostrum data est gratia secundum mensuram donationis Christi.\"},{\"verse\":8,\"text\":\"Propter quod dicit : Ascendens in altum, captivam duxit captivitatem : dedit dona hominibus.\"},{\"verse\":9,\"text\":\"Quod autem ascendit, quid est, nisi quia et descendit primum in inferiores partes terræ ?\"},{\"verse\":10,\"text\":\"Qui descendit, ipse est et qui ascendit super omnes cælos, ut impleret omnia.\"},{\"verse\":11,\"text\":\"Et ipse dedit quosdam quidem apostolos, quosdam autem prophetas, alios vero evangelistas, alios autem pastores et doctores,\"},{\"verse\":12,\"text\":\"ad consummationem sanctorum in opus ministerii, in ædificationem corporis Christi :\"},{\"verse\":13,\"text\":\"donec occurramus omnes in unitatem fidei, et agnitionis Filii Dei, in virum perfectum, in mensuram ætatis plenitudinis Christi :\"},{\"verse\":14,\"text\":\"ut jam non simus parvuli fluctuantes, et circumferamur omni vento doctrinæ in nequitia hominum, in astutia ad circumventionem erroris.\"},{\"verse\":15,\"text\":\"Veritatem autem facientes in caritate, crescamus in illo per omnia, qui est caput Christus :\"},{\"verse\":16,\"text\":\"ex quo totum corpus compactum et connexum per omnem juncturam subministrationis, secundum operationem in mensuram uniuscujusque membri, augmentum corporis facit in ædificationem sui in caritate.\"},{\"verse\":17,\"text\":\"Hoc igitur dico, et testificor in Domino, ut jam non ambuletis, sicut et gentes ambulant in vanitate sensus sui,\"},{\"verse\":18,\"text\":\"tenebris obscuratum habentes intellectum, alienati a vita Dei per ignorantiam, quæ est in illis, propter cæcitatem cordis ipsorum,\"},{\"verse\":19,\"text\":\"qui desperantes, semetipsos tradiderunt impudicitiæ, in operationem immunditiæ omnis in avaritiam.\"},{\"verse\":20,\"text\":\"Vos autem non ita didicistis Christum,\"},{\"verse\":21,\"text\":\"si tamen illum audistis, et in ipso edocti estis, sicut est veritas in Jesu,\"},{\"verse\":22,\"text\":\"deponere vos secundum pristinam conversationem veterem hominem, qui corrumpitur secundum desideria erroris.\"},{\"verse\":23,\"text\":\"Renovamini autem spiritu mentis vestræ,\"},{\"verse\":24,\"text\":\"et induite novum hominem, qui secundum Deum creatus est in justitia, et sanctitate veritatis.\"},{\"verse\":25,\"text\":\"Propter quod deponentes mendacium, loquimini veritatem unusquisque cum proximo suo : quoniam sumus invicem membra.\"},{\"verse\":26,\"text\":\"Irascimini, et nolite peccare : sol non occidat super iracundiam vestram.\"},{\"verse\":27,\"text\":\"Nolite locum dare diabolo :\"},{\"verse\":28,\"text\":\"qui furabatur, jam non furetur : magis autem laboret, operando manibus suis, quod bonum est, ut habeat unde tribuat necessitatem patienti.\"},{\"verse\":29,\"text\":\"Omnis sermo malus ex ore vestro non procedat : sed si quis bonus ad ædificationem fidei ut det gratiam audientibus.\"},{\"verse\":30,\"text\":\"Et nolite contristare Spiritum Sanctum Dei : in quo signati estis in diem redemptionis.\"},{\"verse\":31,\"text\":\"Omnis amaritudo, et ira, et indignatio, et clamor, et blasphemia tollatur a vobis cum omni malitia.\"},{\"verse\":32,\"text\":\"Estote autem invicem benigni, misericordes, donantes invicem sicut et Deus in Christo donavit vobis.\"}],\"summary\":\"He exhorts them to unity, to put on the new man, and to fly sin.\",\"intro\":null,\"prev\":{\"usfm\":\"EPH\",\"chapter\":3,\"label\":\"Ephesians 3\"},\"next\":{\"usfm\":\"EPH\",\"chapter\":5,\"label\":\"Ephesians 5\"}}]]\n"])</script></body></html>
