eading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Now her husband Elimelech had a kinsman, a powerful man, and very rich, whose name was Booz.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>And Ruth, the Moabitess, said to her mother in law: If thou wilt, I will go into the field, and glean the ears of corn that escape the hands of the reapers, wheresoever I shall find grace with a householder, that will be favourable to me. And she answered her: Go, my daughter.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>She went, therefore, and gleaned the ears of corn after the reapers. And it happened that the owner of that field was Booz, who was of the kindred of Elimelech.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>And behold, he came out of Bethlehem, and said to the reapers: The Lord be with you. And they answered him: The Lord bless thee.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>And Booz said to the young man that was set over the reapers: Whose maid is this?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>And he answered him: This is the Moabitess, who came with Noemi, from the land of Moab,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>And she desired leave to glean the ears of corn that remain, following the steps of the reapers: and she hath been in the field from morning till now, and hath not gone home for one moment.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>And Booz said to Ruth: Hear me, daughter, do not go to glean in any other field, and do not depart from this place: but keep with my maids,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>And follow where they reap. For I have charged my young men, not to molest thee: and if thou art thirsty, go to the vessels, and drink of the waters whereof the servants drink.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>She fell on her face, and worshipping upon the ground, said to him: Whence cometh this to me, that I should find grace before thy eyes, and that thou shouldst vouchsafe to take notice of me, a woman of another country?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>And he answered her: All hath been told me, that thou hast done to thy mother in law after the death of thy husband: and how thou hast left thy parents, and the land wherein thou wast born, and art come to a people which thou knewest not heretofore.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>The Lord render unto thee for thy work, and mayst thou receive a full reward of the Lord the God of Israel, to whom thou art come, and under whose wings thou art fled.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>And she said: I have found grace in thy eyes, my lord, who hast comforted me, and hast spoken to the heart of thy handmaid, who am not like to one of thy maids.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>And Booz said to her: At mealtime come thou hither, and eat of the bread, and dip thy morsel in the vinegar. So she sat at the side of the reapers, and she heaped to herself frumenty, and ate and was filled, and took the leavings.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>And she arose from thence, to glean the ears of corn as before. And Booz commanded his servants, saying: If she would even reap with you, hinder her not:</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>And let fall some of your handfuls of purpose, and leave them, that she may gather them without shame, and let no man rebuke her when she gathereth them.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>She gleaned therefore in the field till evening: and beating out with a rod, and threshing what she had gleaned, she found about the measure of an ephi of barley, that is, three bushels:</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Which she took up, and returned into the city, and shewed it to her mother in law: moreover, she brought out, and gave her of the remains of her meat, wherewith she had been filled.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>And her mother in law said to her: Where hast thou gleaned today, and where hast thou wrought? blessed be he that hath had pity on thee. And she told her with whom she had wrought: and she told the man’s name, that he was called Booz.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>And Noemi answered her: Blessed be he of the Lord: because the same kindness which he shewed to the living, he hath kept also to the dead. And again she said: The man is our kinsman.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>And Ruth said: He also charged me, that I should keep close to his reapers, till all the corn should be reaped.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>And her mother in law said to her: It is better for thee, my daughter, to go out to reap with his maids, lest in another man’s field some one may resist thee.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>So she kept close to the maids of Booz: and continued to glean with them, till all the barley and the wheat were laid up in the barns.</button></div><div data-list="VUL" lang="la" class="only-vul font-serif text-[1.1875rem] leading-[1.75]"><button type="button" data-verse="1" aria-pressed="false" class="verse"><sup>1</sup>Erat autem viro Elimelech consanguineus, homo potens, et magnarum opum, nomine Booz.</button><button type="button" data-verse="2" aria-pressed="false" class="verse"><sup>2</sup>Dixitque Ruth Moabitis ad socrum suam : Si jubes, vadam in agrum, et colligam spicas quæ fugerint manus metentium, ubicumque clementis in me patrisfamilias reperero gratiam. Cui illa respondit : Vade, filia mea.</button><button type="button" data-verse="3" aria-pressed="false" class="verse"><sup>3</sup>Abiit itaque et colligebat spicas post terga metentium. Accidit autem ut ager ille haberet dominum nomine Booz, qui erat de cognatione Elimelech.</button><button type="button" data-verse="4" aria-pressed="false" class="verse"><sup>4</sup>Et ecce, ipse veniebat de Bethlehem, dixitque messoribus : Dominus vobiscum. Qui responderunt ei : Benedicat tibi Dominus.</button><button type="button" data-verse="5" aria-pressed="false" class="verse"><sup>5</sup>Dixitque Booz juveni, qui messoribus præerat : Cujus est hæc puella ?</button><button type="button" data-verse="6" aria-pressed="false" class="verse"><sup>6</sup>Cui respondit : Hæc est Moabitis, quæ venit cum Noëmi, de regione Moabitide,</button><button type="button" data-verse="7" aria-pressed="false" class="verse"><sup>7</sup>et rogavit ut spicas colligeret remanentes, sequens messorum vestigia : et de mane usque nunc stat in agro, et ne ad momentum quidem domum reversa est.</button><button type="button" data-verse="8" aria-pressed="false" class="verse"><sup>8</sup>Et ait Booz ad Ruth : Audi, filia, ne vadas in alterum agrum ad colligendum, nec recedas ab hoc loco : sed jungere puellis meis,</button><button type="button" data-verse="9" aria-pressed="false" class="verse"><sup>9</sup>et ubi messuerint, sequere. Mandavi enim pueris meis, ut nemo molestus sit tibi : sed etiam si sitieris, vade ad sarcinulas, et bibe aquas, de quibus et pueri bibunt.</button><button type="button" data-verse="10" aria-pressed="false" class="verse"><sup>10</sup>Quæ cadens in faciem suam et adorans super terram, dixit ad eum : Unde mihi hoc, ut invenirem gratiam ante oculos tuos, et nosse me dignareris peregrinam mulierem ?</button><button type="button" data-verse="11" aria-pressed="false" class="verse"><sup>11</sup>Cui ille respondit : Nuntiata sunt mihi omnia quæ feceris socrui tuæ post mortem viri tui : et quod reliqueris parentes tuos, et terram in qua nata es, et veneris ad populum, quem antea nesciebas.</button><button type="button" data-verse="12" aria-pressed="false" class="verse"><sup>12</sup>Reddat tibi Dominus pro opere tuo, et plenam mercedem recipias a Domino Deo Israël, ad quem venisti, et sub cujus confugisti alas.</button><button type="button" data-verse="13" aria-pressed="false" class="verse"><sup>13</sup>Quæ ait : Inveni gratiam apud oculos tuos, domine mi, qui consolatus es me, et locutus es ad cor ancillæ tuæ, quæ non sum similis unius puellarum tuarum.</button><button type="button" data-verse="14" aria-pressed="false" class="verse"><sup>14</sup>Dixitque ad eam Booz : Quando hora vescendi fuerit, veni huc, et comede panem, et intinge buccellam tuam in aceto. Sedit itaque ad messorum latus, et congessit polentam sibi, comeditque et saturata est, et tulit reliquias.</button><button type="button" data-verse="15" aria-pressed="false" class="verse"><sup>15</sup>Atque inde surrexit, ut spicas ex more colligeret. Præcepit autem Booz pueris suis, dicens : Etiamsi vobiscum metere voluerit, ne prohibeatis eam :</button><button type="button" data-verse="16" aria-pressed="false" class="verse"><sup>16</sup>et de vestris quoque manipulis projicite de industria, et remanere permittite, ut absque rubore colligat, et colligentem nemo corripiat.</button><button type="button" data-verse="17" aria-pressed="false" class="verse"><sup>17</sup>Collegit ergo in agro usque ad vesperam : et quæ collegerat virga cædens et excutiens, invenit hordei quasi ephi mensuram, id est, tres modios.</button><button type="button" data-verse="18" aria-pressed="false" class="verse"><sup>18</sup>Quos portans reversa est in civitatem, et ostendit socrui suæ : insuper protulit, et dedit ei de reliquiis cibi sui, quo saturata fuerat.</button><button type="button" data-verse="19" aria-pressed="false" class="verse"><sup>19</sup>Dixitque ei socrus sua : Ubi hodie collegisti, et ubi fecisti opus ? sit benedictus qui misertus est tui. Indicavitque ei apud quem fuisset operata : et nomen dixit viri, quod Booz vocaretur.</button><button type="button" data-verse="20" aria-pressed="false" class="verse"><sup>20</sup>Cui respondit Noëmi : Benedictus sit a Domino : quoniam eamdem gratiam, quam præbuerat vivis, servavit et mortuis. Rursumque ait : Propinquus noster est homo.</button><button type="button" data-verse="21" aria-pressed="false" class="verse"><sup>21</sup>Et ait Ruth : Hoc quoque, inquit, præcepit mihi, ut tamdiu messoribus ejus jungerer, donec omnes segetes meterentur.</button><button type="button" data-verse="22" aria-pressed="false" class="verse"><sup>22</sup>Cui dixit socrus : Melius est, filia mea, ut cum puellis ejus exeas ad metendum, ne in alieno agro quispiam resistat tibi.</button><button type="button" data-verse="23" aria-pressed="false" class="verse"><sup>23</sup>Juncta est itaque puellis Booz : et tamdiu cum eis messuit, donec hordea et triticum in horreis conderentur.</button></div><nav class="mt-8 grid grid-cols-2 gap-3" aria-label="Previous and next chapter"><a class="flex min-h-14 items-center gap-2 rounded-xl border border-stone-300 bg-card px-3 hover:border-stone-400 active:bg-stone-100" href="/catholic-study-bible/read/RUT/1/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5 shrink-0" aria-hidden="true"><path [27201,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\"],\"IconMark\"]\n12:null\n16:[[\"$\",\"title\",\"0\",{\"children\":\"Ruth 2 · Catholic Study Bible\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"The 73-book canon with the original languages, the Vulgate, and the Church's reading of every verse.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"application-name\",\"content\":\"Catholic Study Bible\"}],[\"$\",\"link\",\"3\",{\"rel\":\"manifest\",\"href\":\"/catholic-study-bible/manifest.webmanifest\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"meta\",\"4\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"meta\",\"5\",{\"name\":\"format-detection\",\"content\":\"telephone=no, address=no, email=no\"}],[\"$\",\"meta\",\"6\",{\"name\":\"mobile-web-app-capable\",\"content\":\"yes\"}],[\"$\",\"meta\",\"7\",{\"name\":\"apple-mobile-web-app-title\",\"content\":\"Study Bible\"}],[\"$\",\"meta\",\"8\",{\"name\":\"apple-mobile-web-app-status-bar-style\",\"content\":\"default\"}],[\"$\",\"link\",\"9\",{\"rel\":\"icon\",\"href\":\"/catholic-study-bible/favicon.ico?favicon.0_5vo_94a2vc-.ico\",\"sizes\":\"48x48\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"10\",{\"rel\":\"apple-touch-icon\",\"href\":\"/catholic-study-bible/apple-icon.png?apple-icon.17stkdt5roq9m.png\",\"sizes\":\"180x180\",\"type\":\"image/png\"}],[\"$\",\"$L17\",\"11\",{}]]\n"])</script><script>self.__next_f.push([1,"18:I[23634,[\"/catholic-study-bible/_next/static/chunks/033qu0m_jcft9.js\",\"/catholic-study-bible/_next/static/chunks/44gl51hi_zt2w.js\",\"/catholic-study-bible/_next/static/chunks/25k9yckjlk09-.js\"],\"ChapterReader\"]\na:[[\"$\",\"$L18\",\"RUT.2\",{\"bookId\":8,\"usfm\":\"RUT\",\"bookName\":\"Ruth\",\"drName\":\"Ruth\",\"chapter\":2,\"totalChapters\":4,\"dra\":[{\"verse\":1,\"text\":\"Now her husband Elimelech had a kinsman, a powerful man, and very rich, whose name was Booz.\"},{\"verse\":2,\"text\":\"And Ruth, the Moabitess, said to her mother in law: If thou wilt, I will go into the field, and glean the ears of corn that escape the hands of the reapers, wheresoever I shall find grace with a householder, that will be favourable to me. And she answered her: Go, my daughter.\"},{\"verse\":3,\"text\":\"She went, therefore, and gleaned the ears of corn after the reapers. And it happened that the owner of that field was Booz, who was of the kindred of Elimelech.\"},{\"verse\":4,\"text\":\"And behold, he came out of Bethlehem, and said to the reapers: The Lord be with you. And they answered him: The Lord bless thee.\"},{\"verse\":5,\"text\":\"And Booz said to the young man that was set over the reapers: Whose maid is this?\"},{\"verse\":6,\"text\":\"And he answered him: This is the Moabitess, who came with Noemi, from the land of Moab,\"},{\"verse\":7,\"text\":\"And she desired leave to glean the ears of corn that remain, following the steps of the reapers: and she hath been in the field from morning till now, and hath not gone home for one moment.\"},{\"verse\":8,\"text\":\"And Booz said to Ruth: Hear me, daughter, do not go to glean in any other field, and do not depart from this place: but keep with my maids,\"},{\"verse\":9,\"text\":\"And follow where they reap. For I have charged my young men, not to molest thee: and if thou art thirsty, go to the vessels, and drink of the waters whereof the servants drink.\"},{\"verse\":10,\"text\":\"She fell on her face, and worshipping upon the ground, said to him: Whence cometh this to me, that I should find grace before thy eyes, and that thou shouldst vouchsafe to take notice of me, a woman of another country?\"},{\"verse\":11,\"text\":\"And he answered her: All hath been told me, that thou hast done to thy mother in law after the death of thy husband: and how thou hast left thy parents, and the land wherein thou wast born, and art come to a people which thou knewest not heretofore.\"},{\"verse\":12,\"text\":\"The Lord render unto thee for thy work, and mayst thou receive a full reward of the Lord the God of Israel, to whom thou art come, and under whose wings thou art fled.\"},{\"verse\":13,\"text\":\"And she said: I have found grace in thy eyes, my lord, who hast comforted me, and hast spoken to the heart of thy handmaid, who am not like to one of thy maids.\"},{\"verse\":14,\"text\":\"And Booz said to her: At mealtime come thou hither, and eat of the bread, and dip thy morsel in the vinegar. So she sat at the side of the reapers, and she heaped to herself frumenty, and ate and was filled, and took the leavings.\"},{\"verse\":15,\"text\":\"And she arose from thence, to glean the ears of corn as before. And Booz commanded his servants, saying: If she would even reap with you, hinder her not:\"},{\"verse\":16,\"text\":\"And let fall some of your handfuls of purpose, and leave them, that she may gather them without shame, and let no man rebuke her when she gathereth them.\"},{\"verse\":17,\"text\":\"She gleaned therefore in the field till evening: and beating out with a rod, and threshing what she had gleaned, she found about the measure of an ephi of barley, that is, three bushels:\"},{\"verse\":18,\"text\":\"Which she took up, and returned into the city, and shewed it to her mother in law: moreover, she brought out, and gave her of the remains of her meat, wherewith she had been filled.\"},{\"verse\":19,\"text\":\"And her mother in law said to her: Where hast thou gleaned today, and where hast thou wrought? blessed be he that hath had pity on thee. And she told her with whom she had wrought: and she told the man’s name, that he was called Booz.\"},{\"verse\":20,\"text\":\"And Noemi answered her: Blessed be he of the Lord: because the same kindness which he shewed to the living, he hath kept also to the dead. And again she said: The man is our kinsman.\"},{\"verse\":21,\"text\":\"And Ruth said: He also charged me, that I should keep close to his reapers, till all the corn should be reaped.\"},{\"verse\":22,\"text\":\"And her mother in law said to her: It is better for thee, my daughter, to go out to reap with his maids, lest in another man’s field some one may resist thee.\"},{\"verse\":23,\"text\":\"So she kept close to the maids of Booz: and continued to glean with them, till all the barley and the wheat were laid up in the barns.\"}],\"vul\":[{\"verse\":1,\"text\":\"Erat autem viro Elimelech consanguineus, homo potens, et magnarum opum, nomine Booz.\"},{\"verse\":2,\"text\":\"Dixitque Ruth Moabitis ad socrum suam : Si jubes, vadam in agrum, et colligam spicas quæ fugerint manus metentium, ubicumque clementis in me patrisfamilias reperero gratiam. Cui illa respondit : Vade, filia mea.\"},{\"verse\":3,\"text\":\"Abiit itaque et colligebat spicas post terga metentium. Accidit autem ut ager ille haberet dominum nomine Booz, qui erat de cognatione Elimelech.\"},{\"verse\":4,\"text\":\"Et ecce, ipse veniebat de Bethlehem, dixitque messoribus : Dominus vobiscum. Qui responderunt ei : Benedicat tibi Dominus.\"},{\"verse\":5,\"text\":\"Dixitque Booz juveni, qui messoribus præerat : Cujus est hæc puella ?\"},{\"verse\":6,\"text\":\"Cui respondit : Hæc est Moabitis, quæ venit cum Noëmi, de regione Moabitide,\"},{\"verse\":7,\"text\":\"et rogavit ut spicas colligeret remanentes, sequens messorum vestigia : et de mane usque nunc stat in agro, et ne ad momentum quidem domum reversa est.\"},{\"verse\":8,\"text\":\"Et ait Booz ad Ruth : Audi, filia, ne vadas in alterum agrum ad colligendum, nec recedas ab hoc loco : sed jungere puellis meis,\"},{\"verse\":9,\"text\":\"et ubi messuerint, sequere. Mandavi enim pueris meis, ut nemo molestus sit tibi : sed etiam si sitieris, vade ad sarcinulas, et bibe aquas, de quibus et pueri bibunt.\"},{\"verse\":10,\"text\":\"Quæ cadens in faciem suam et adorans super terram, dixit ad eum : Unde mihi hoc, ut invenirem gratiam ante oculos tuos, et nosse me dignareris peregrinam mulierem ?\"},{\"verse\":11,\"text\":\"Cui ille respondit : Nuntiata sunt mihi omnia quæ feceris socrui tuæ post mortem viri tui : et quod reliqueris parentes tuos, et terram in qua nata es, et veneris ad populum, quem antea nesciebas.\"},{\"verse\":12,\"text\":\"Reddat tibi Dominus pro opere tuo, et plenam mercedem recipias a Domino Deo Israël, ad quem venisti, et sub cujus confugisti alas.\"},{\"verse\":13,\"text\":\"Quæ ait : Inveni gratiam apud oculos tuos, domine mi, qui consolatus es me, et locutus es ad cor ancillæ tuæ, quæ non sum similis unius puellarum tuarum.\"},{\"verse\":14,\"text\":\"Dixitque ad eam Booz : Quando hora vescendi fuerit, veni huc, et comede panem, et intinge buccellam tuam in aceto. Sedit itaque ad messorum latus, et congessit polentam sibi, comeditque et saturata est, et tulit reliquias.\"},{\"verse\":15,\"text\":\"Atque inde surrexit, ut spicas ex more colligeret. Præcepit autem Booz pueris suis, dicens : Etiamsi vobiscum metere voluerit, ne prohibeatis eam :\"},{\"verse\":16,\"text\":\"et de vestris quoque manipulis projicite de industria, et remanere permittite, ut absque rubore colligat, et colligentem nemo corripiat.\"},{\"verse\":17,\"text\":\"Collegit ergo in agro usque ad vesperam : et quæ collegerat virga cædens et excutiens, invenit hordei quasi ephi mensuram, id est, tres modios.\"},{\"verse\":18,\"text\":\"Quos portans reversa est in civitatem, et ostendit socrui suæ : insuper protulit, et dedit ei de reliquiis cibi sui, quo saturata fuerat.\"},{\"verse\":19,\"text\":\"Dixitque ei socrus sua : Ubi hodie collegisti, et ubi fecisti opus ? sit benedictus qui misertus est tui. Indicavitque ei apud quem fuisset operata : et nomen dixit viri, quod Booz vocaretur.\"},{\"verse\":20,\"text\":\"Cui respondit Noëmi : Benedictus sit a Domino : quoniam eamdem gratiam, quam præbuerat vivis, servavit et mortuis. Rursumque ait : Propinquus noster est homo.\"},{\"verse\":21,\"text\":\"Et ait Ruth : Hoc quoque, inquit, præcepit mihi, ut tamdiu messoribus ejus jungerer, donec omnes segetes meterentur.\"},{\"verse\":22,\"text\":\"Cui dixit socrus : Melius est, filia mea, ut cum puellis ejus exeas ad metendum, ne in alieno agro quispiam resistat tibi.\"},{\"verse\":23,\"text\":\"Juncta est itaque puellis Booz : et tamdiu cum eis messuit, donec hordea et triticum in horreis conderentur.\"}],\"summary\":\"Ruth gleaneth in the field of Booz, who sheweth her favour.\",\"intro\":null,\"prev\":{\"usfm\":\"RUT\",\"chapter\":1,\"label\":\"Ruth 1\"},\"next\":{\"usfm\":\"RUT\",\"chapter\":3,\"label\":\"Ruth 3\"}}]]\n"])</script></body></html>
